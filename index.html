erence H, p. 344; Reference G, p. 434."}, {"letter": "D", "text": "Sensory ganglion of the trigeminal nerve.", "answer": "TRUE", "explanation": "A posterior relation. Reference G, p. 434."}, {"letter": "E", "text": "Pia mater.", "answer": "FALSE", "explanation": "The cranial venous sinuses lie between layers of dura mater. Reference G, p. 432."}]}, {"qid": "64", "stem": "The cavernous sinus:", "options": [{"letter": "A", "text": "Drains into the superior and inferior petrosal sinuses.", "answer": "TRUE", "explanation": "The superior petrosal sinus joins cavernous and transverse sinuses. The inferior petrosal sinus joins the cavernous sinus to the internal jugular vein. Reference H, p. 352."}, {"letter": "B", "text": "Is connected to the pterygoid venous plexus via emissary veins.", "answer": "TRUE", "explanation": "Reference G, p. 435."}, {"letter": "C", "text": "Has the three divisions of the trigeminal nerve in its lateral wall.", "answer": "FALSE", "explanation": "It has the ophthalmic and maxillary divisions only. Reference G, p. 434."}, {"letter": "D", "text": "Receives the occipital sinus.", "answer": "FALSE", "explanation": "This small sinus runs from the posterior margin of the foramen magnum to the sinus confluens. It lies in the line of attachment of the falx cerebri to the occipital bone. Reference H, p. 467."}, {"letter": "E", "text": "Lies entirely superior to the pituitary gland.", "answer": "FALSE", "explanation": "The cavernous sinus lies to each side of the pituitary. Reference G, p. 434."}]}, {"qid": "65", "stem": "The following are tributaries of the internal jugular vein:", "options": [{"letter": "A", "text": "The facial vein.", "answer": "TRUE", "explanation": "This vein forms at the medial angle of the eye and joins the anterior branch of the retromandibular vein. Reference G, p. 370."}, {"letter": "B", "text": "The cephalic vein.", "answer": "FALSE", "explanation": "This vein passes along the lateral aspect of the arm and joins the axillary vein after piercing the clavipectoral fascia. Reference G, p. 234."}, {"letter": "C", "text": "The posterior auricular vein.", "answer": "FALSE", "explanation": "This joins the posterior division of the retromandibular vein to form the external jugular. Reference G, p. 371."}, {"letter": "D", "text": "The anterior jugular vein.", "answer": "FALSE", "explanation": "This drains into the external jugular behind the clavicle. Reference G, p. 372."}, {"letter": "E", "text": "The external jugular vein.", "answer": "FALSE", "explanation": "This enters the subclavian vein. Reference G, p. 372."}]}, {"qid": "66", "stem": "The following may be seen on a lateral projection of the skull:", "options": [{"letter": "A", "text": "The soft palate.", "answer": "TRUE", "explanation": "Reference H, p. 268 (Fig. 6-45)."}, {"letter": "B", "text": "The sphenoid air sinus.", "answer": "TRUE", "explanation": "Reference H, p. 268 (Fig. 6-45)."}, {"letter": "C", "text": "The lateral mass of the atlas.", "answer": "FALSE", "explanation": "This may be seen on the straight PA view. Reference H, p. 266 (Fig. 6-43)."}, {"letter": "D", "text": "The frontal sinus.", "answer": "TRUE", "explanation": "Reference H, p. 268 (Fig. 6-45)."}, {"letter": "E", "text": "The coronoid process of the mandible.", "answer": "TRUE", "explanation": "Because it may be superimposed on the inferior turbinate, the coronoid process may simulate a tumour of the maxillary antrum. Reference X, p. 136 (Fig. 2-28)."}]}, {"qid": "67", "stem": "The following structures may be identified in the lateral oblique projection of the mastoid process:", "options": [{"letter": "A", "text": "The mastoid emissary vein.", "answer": "TRUE", "explanation": "This may be seen immediately posterior to the pneumatized portion of the temporal bone. Reference H, p. 330."}, {"letter": "B", "text": "The jugular foramen.", "answer": "FALSE", "explanation": "Reference H, p. 330."}, {"letter": "C", "text": "The middle ear ossicles.", "answer": "TRUE", "explanation": "Reference H, p. 330."}, {"letter": "D", "text": "The cochlea.", "answer": "FALSE", "explanation": "Reference H, p. 330."}, {"letter": "E", "text": "The styloid process.", "answer": "TRUE", "explanation": "Reference H, p. 330."}]}, {"qid": "68", "stem": "The following structures may be seen on a standard axial view of the skull:", "options": [{"letter": "A", "text": "The foramen ovale.", "answer": "TRUE", "explanation": "Reference H, p. 269 (Fig. 6-46)."}, {"letter": "B", "text": "The foramen spinosum.", "answer": "TRUE", "explanation": "Reference H, p. 269 (Fig. 6-46)."}, {"letter": "C", "text": "The clivus.", "answer": "TRUE", "explanation": "Reference H, p. 269 (Fig. 6-46)."}, {"letter": "D", "text": "The nasal septum.", "answer": "TRUE", "explanation": "Reference H, p. 269 (Fig. 6-46)."}, {"letter": "E", "text": "The dorsum sellae.", "answer": "FALSE", "explanation": "This is seen on lateral or frontal views of the skull."}]}]}, {"title": "Section 5 · Skull Projections & Foramina", "questions": [{"qid": "69", "stem": "In the submentovertical (axial) projection of the skull:", "options": [{"letter": "A", "text": "The cribriform plate is seen.", "answer": "FALSE", "explanation": "The hard palate and mandible are superimposed on the medial part of the anterior cranial fossa. As a general rule, the cribriform plate is too thin a structure to cast an image on plain films. Reference H, p. 269 (Fig. 6-46)."}, {"letter": "B", "text": "The pharyngeal recess (fossa of Rosenmüller) may be seen.", "answer": "TRUE", "explanation": "Reference H, p. 583 (Fig. 10-1 D-F)."}, {"letter": "C", "text": "The uvula may be identified as a nodular structure surrounded by air.", "answer": "TRUE", "explanation": "Reference H, p. 581."}, {"letter": "D", "text": "The zygomatic arch is best seen with a lower kVp exposure.", "answer": "TRUE", "explanation": "It tends to be blacked out on the standard film. Reference H, p. 276."}, {"letter": "E", "text": "The lateral wall of the maxillary antrum forms a straight line superimposed on the lateral wall of the orbit.", "answer": "FALSE", "explanation": "The antral line is S-shaped, being concave laterally in its anterior portion and convex laterally in its posterior portion. It is superimposed on the straight line formed by the lateral wall of the orbit. Reference H, p. 304 (Fig. 7-17B and C)."}]}, {"qid": "70", "stem": "The following may be seen on a 30 degrees fronto-occipital (Towne's) projection of the skull:", "options": [{"letter": "A", "text": "The arcuate eminence.", "answer": "TRUE", "explanation": "Reference H, p. 267 (Fig. 6-44)."}, {"letter": "B", "text": "The internal auditory canal.", "answer": "TRUE", "explanation": "Reference H, p. 267."}, {"letter": "C", "text": "The superior orbital fissure.", "answer": "FALSE", "explanation": "This is seen on a PA with 15 degrees of caudal tilt of the tube. Reference H, p. 265 (Fig. 6-42)."}, {"letter": "D", "text": "The head of the mandible.", "answer": "TRUE", "explanation": "Reference H, p. 267 (Fig. 6-44)."}, {"letter": "E", "text": "The lesser wing of the sphenoid.", "answer": "FALSE", "explanation": "Seen on the PA 15. Reference H, p. 265 (Fig. 6-42)."}]}, {"qid": "71", "stem": "Concerning the foramina in the base of the skull:", "options": [{"letter": "A", "text": "The foramen rotundum is seen on the Towne's projection.", "answer": "FALSE", "explanation": "It is seen on PA projections, e.g. the PA view with 15 degrees of caudal tube tilt (Caldwell's projection). Reference H, p. 236."}, {"letter": "B", "text": "The foramen ovale transmits the mandibular nerve.", "answer": "TRUE", "explanation": "Reference H, p. 241."}, {"letter": "C", "text": "The foramen spinosum transmits the middle cerebral artery.", "answer": "FALSE", "explanation": "It transmits the middle meningeal artery. Reference H, p. 237."}, {"letter": "D", "text": "The carotid canal lies posterior to the cochlea.", "answer": "FALSE", "explanation": "It lies anterior to the cochlea. Reference H, p. 239."}, {"letter": "E", "text": "The right jugular foramen is usually larger than the left.", "answer": "TRUE", "explanation": "In 70-90% of cases. Reference H, p. 240. This reflects the fact that the right transverse sinus receives the superior sagittal sinus."}]}, {"qid": "72", "stem": "The superior orbital fissure:", "options": [{"letter": "A", "text": "Lies in the greater wing of the sphenoid.", "answer": "FALSE", "explanation": "It lies between the lesser and greater wings of the sphenoid. Reference G, p. 312."}, {"letter": "B", "text": "Transmits the abducent nerve.", "answer": "TRUE", "explanation": "Reference G, p. 312."}, {"letter": "C", "text": "Transmits the superior ophthalmic vein.", "answer": "TRUE", "explanation": "Reference G, p. 312."}, {"letter": "D", "text": "Transmits the ophthalmic artery.", "answer": "FALSE", "explanation": "This accompanies the optic nerve in the optic canal. Reference G, p. 312."}, {"letter": "E", "text": "Transmits the zygomatic nerve.", "answer": "FALSE", "explanation": "This passes with the maxillary nerve and a number of communicating veins through the inferior orbital fissure. Reference G, p. 312."}]}]}, {"title": "Section 6 · Great Vessels of the Head & Neck", "questions": [{"qid": "73", "stem": "Relating to the aortic arch and its branches:", "options": [{"letter": "A", "text": "The common carotid arteries arise from the innominate in about 5% of cases.", "answer": "FALSE", "explanation": "This arrangement, which is seen in about 27% of cases, reduces the number of stems arising from the arch to two. Reference H, p. 414 (Fig. 8-60)."}, {"letter": "B", "text": "The common carotid artery usually bifurcates at the level of C2.", "answer": "FALSE", "explanation": "Although the point of bifurcation is variable, it is usual for it to occur at the level of C4. Reference H, p. 410."}, {"letter": "C", "text": "The left vertebral artery arises directly from the arch in about 4% of cases.", "answer": "TRUE", "explanation": "Reference H, p. 414 (Fig. 8-60)."}, {"letter": "D", "text": "The right vertebral artery arises from the right subclavian in less than 50% of cases.", "answer": "FALSE", "explanation": "This occurs in approximately 90% of cases. Reference H, p. 446 (Fig. 8-82)."}, {"letter": "E", "text": "An anomalous right subclavian occurs in about 1% of the population.", "answer": "TRUE", "explanation": "Reference H, p. 414 (Fig. 8-60)."}]}, {"qid": "74", "stem": "The following arteries arise directly from the external carotid artery:", "options": [{"letter": "A", "text": "The middle meningeal artery.", "answer": "FALSE", "explanation": "This arises from the maxillary artery. Reference G, p. 369."}, {"letter": "B", "text": "The maxillary artery.", "answer": "TRUE", "explanation": "This arises posterior to the neck of the mandible as the larger terminal branch of the external carotid artery. It traverses the infratemporal and pterygopalatine fossae. Reference G, p. 369."}, {"letter": "C", "text": "The ascending pharyngeal artery.", "answer": "TRUE", "explanation": "Reference G, p. 368."}, {"letter": "D", "text": "The ophthalmic artery.", "answer": "FALSE", "explanation": "This is a branch of the internal carotid. Reference G, p. 370."}, {"letter": "E", "text": "The superior thyroid artery.", "answer": "TRUE", "explanation": "It supplies the larynx, the pharynx, the thyroid gland and the infrahyoid muscles. Reference G, p. 368."}]}, {"qid": "75", "stem": "The vertebral artery:", "options": [{"letter": "A", "text": "Usually arises lateral to the thyrocervical trunk.", "answer": "FALSE", "explanation": "The vertebral artery is usually the first branch of the subclavian. Reference H, p. 445."}, {"letter": "B", "text": "Passes through the foramen transversarium of C7.", "answer": "FALSE", "explanation": "It passes through the foramen transversarium of the upper six cervical vertebrae. Reference H, p. 445."}, {"letter": "C", "text": "Is related to the lateral edge of the posterior atlanto-occipital membrane.", "answer": "TRUE", "explanation": "Reference P3, p. 142. Some of the lateral fibres of the membrane may ossify. This may produce the appearance of a foramen on the lateral view of the neck; the so-called arcuate foramen. Reference X, p. 168 (Fig. 3-20)."}, {"letter": "D", "text": "Is not related to the vertebral veins.", "answer": "FALSE", "explanation": "As it passes through the foramina transversaria of the cervical vertebrae, the artery is accompanied by one or two vertebral veins. Reference P3, p. 138."}, {"letter": "E", "text": "Supplies the spinal cord.", "answer": "TRUE", "explanation": "Through branches in the neck and via the anterior spinal artery. Reference G, p. 435."}]}, {"qid": "76", "stem": "The subclavian artery:", "options": [{"letter": "A", "text": "Gives rise to the internal mammary artery.", "answer": "TRUE", "explanation": "Reference G, p. 365."}, {"letter": "B", "text": "Gives off the acromiothoracic artery.", "answer": "FALSE", "explanation": "This is a branch of the axillary artery. Reference G, p. 202."}, {"letter": "C", "text": "Lies posterior to scalenus anterior.", "answer": "TRUE", "explanation": "For descriptive purposes, the artery can be divided into three parts: the second part lies behind scalenus anterior, the first part lies medial to it, and the third part extends lateral to it. Reference P3, p. 114."}, {"letter": "D", "text": "Gives rise to the inferior thyroid artery via the thyrocervical trunk.", "answer": "TRUE", "explanation": "Reference G, p. 367."}, {"letter": "E", "text": "May enlarge the shadow of the superior mediastinum of normal elderly patients seen on the frontal chest film.", "answer": "TRUE", "explanation": "Reference X, p. 719 (Fig. 9-155)."}]}, {"qid": "77", "stem": "Concerning variations in the arterial circle of Willis:", "options": [{"letter": "A", "text": "The presence of all its components with normal diameters is found in a minority of cases.", "answer": "TRUE", "explanation": "In 18% of individuals only. Reference H, p. 461."}, {"letter": "B", "text": "The posterior communicating artery may normally have a funnel-shaped appearance in its proximal portion.", "answer": "TRUE", "explanation": "The funnel, which is called an infundibulum, should not be confused with an aneurysm. Reference H, p. 434 (Fig. 8-74)."}, {"letter": "C", "text": "The vertebral arteries are usually the same size.", "answer": "FALSE", "explanation": "In only 25% of cases. Reference H, p. 463."}, {"letter": "D", "text": "A trigeminal artery may be rarely present.", "answer": "TRUE", "explanation": "This forms a carotid-basilar channel as a result of persistence of an embryonic vessel into adult life. Reference H, p. 448 (Fig. 8-83)."}, {"letter": "E", "text": "Lateral displacement of the basilar artery is a finding that usually signifies a mass lesion.", "answer": "FALSE", "explanation": "Although it is usually in the midline, it may normally deviate considerably, especially in older individuals. Reference H, p. 445."}]}, {"qid": "78", "stem": "The internal carotid artery:", "options": [{"letter": "A", "text": "Gives rise to the posterior communicating artery.", "answer": "TRUE", "explanation": "This is given off in the chiasmatic cistern. Reference H, p. 424."}, {"letter": "B", "text": "Passes through the cavernous sinus.", "answer": "TRUE", "explanation": "Crossed on its lateral side by the abducent nerve. Reference G, p. 370."}, {"letter": "C", "text": "Passes to the lateral side of the anterior clinoid process.", "answer": "FALSE", "explanation": "It passes to the medial side. Reference G, p. 370."}, {"letter": "D", "text": "Gives off the meningo-hypophyseal artery.", "answer": "TRUE", "explanation": "This artery is given off within the cavernous sinus. Reference H, p. 422."}, {"letter": "E", "text": "May give rise to the anterior choroidal artery.", "answer": "TRUE", "explanation": "It is given off in the region of the bifurcation into anterior and middle cerebral arteries. Reference H, p. 426."}]}]}, {"title": "Section 7 · Cerebral Arteries, Ventricles & Posterior Fossa", "questions": [{"qid": "79", "stem": "The anterior cerebral artery gives off:", "options": [{"letter": "A", "text": "The anterior communicating artery.", "answer": "TRUE", "explanation": "This connects the two anterior cerebral arteries immediately anterior to the lamina terminalis. Reference H, p. 433."}, {"letter": "B", "text": "The frontopolar artery.", "answer": "TRUE", "explanation": "Reference H, p. 432 (Fig. 8-73)."}, {"letter": "C", "text": "Temporal branches.", "answer": "FALSE", "explanation": "Reference H, p. 432 (Fig. 8-73)."}, {"letter": "D", "text": "The pericallosal artery.", "answer": "TRUE", "explanation": "Reference H, p. 432 (Fig. 8-73)."}, {"letter": "E", "text": "A callosomarginal branch.", "answer": "TRUE", "explanation": "Reference H, p. 432 (Fig. 8-73). The principal arteries deriving their origin from the anterior cerebral artery are the anterior striate, the frontobasal, the frontopolar, the callosomarginal, the pericallosal and the posterior frontal (in that order). The anterior striate arteries are given off before the anterior communicating artery."}]}, {"qid": "80", "stem": "The middle cerebral artery:", "options": [{"letter": "A", "text": "Is smaller than the anterior cerebral artery.", "answer": "FALSE", "explanation": "The middle cerebral artery is the largest branch of the internal carotid. Reference H, p. 437."}, {"letter": "B", "text": "Passes into the lateral sulcus.", "answer": "TRUE", "explanation": "Reference G, p. 430."}, {"letter": "C", "text": "Gives off the posterior choroidal arteries.", "answer": "FALSE", "explanation": "These are derived from the posterior cerebral artery. Reference H, p. 458."}, {"letter": "D", "text": "Gives off the posterior temporal artery.", "answer": "TRUE", "explanation": "Reference H, p. 438 (Fig. 8-77)."}, {"letter": "E", "text": "Supplies the central and precentral gyri.", "answer": "TRUE", "explanation": "Via the precentral and central arteries which frequently have a common trunk. Reference H, p. 438 (Fig. 8-77)."}]}, {"qid": "81", "stem": "Concerning the blood supply of the posterior cranial fossa:", "options": [{"letter": "A", "text": "The basilar artery lies anterior to the pons.", "answer": "TRUE", "explanation": "Reference H, p. 455."}, {"letter": "B", "text": "The basilar artery cannot be seen on a CT scan without contrast enhancement.", "answer": "FALSE", "explanation": "It may be seen on a plain scan surrounded by cerebrospinal fluid in the prepontine and basal cisterns."}, {"letter": "C", "text": "The posterior inferior cerebellar artery is usually a branch of the basilar.", "answer": "FALSE", "explanation": "Although it may arise from the basilar artery, it usually arises from the vertebral. Reference H, p. 447."}, {"letter": "D", "text": "The posterior cerebral artery may derive its blood supply from either the internal carotid or vertebral systems.", "answer": "TRUE", "explanation": "This is because the posterior communicating artery arises about 1 cm from the origin of the posterior cerebral and connects it to the internal carotid. Reference H, p. 458."}, {"letter": "E", "text": "The internal auditory artery is a branch of the posterior cerebral.", "answer": "FALSE", "explanation": "It usually arises from the anterior inferior cerebellar artery, but may arise from the basilar. Reference H, p. 455."}]}, {"qid": "82", "stem": "Intracranial calcification may normally occur in the:", "options": [{"letter": "A", "text": "Petroclinoid ligaments.", "answer": "TRUE", "explanation": "This occurs in about 12% of adults and forms a thin calcific shadow extending posteriorly from the dorsum sella to the petrous ridge. It may be demonstrated in lateral or frontal projection. Reference H, p. 250."}, {"letter": "B", "text": "Falx cerebri.", "answer": "TRUE", "explanation": "This occurs in about 7% of adults. Reference H, p. 249."}, {"letter": "C", "text": "Anterior commissure.", "answer": "FALSE", "explanation": ""}, {"letter": "D", "text": "Temporal lobes.", "answer": "FALSE", "explanation": ""}, {"letter": "E", "text": "Basal ganglia.", "answer": "TRUE", "explanation": "This may be visible on the plain film (Reference H, p. 251; Fig. 6-34E). It is quite commonly seen on a CT scan."}]}, {"qid": "83", "stem": "The following structures pass through the foramen magnum:", "options": [{"letter": "A", "text": "The spinal accessory nerve.", "answer": "TRUE", "explanation": "Reference H, p. 242."}, {"letter": "B", "text": "The lesser petrosal nerve.", "answer": "FALSE", "explanation": "This goes through the foramen ovale (Reference G, p. 348). It conveys parasympathetic fibres from the otic ganglion to the parotid gland. Reference G, p. 375."}, {"letter": "C", "text": "The spinal arteries.", "answer": "TRUE", "explanation": "Reference H, p. 242."}, {"letter": "D", "text": "The vertebral arteries.", "answer": "TRUE", "explanation": "Reference H, p. 242."}, {"letter": "E", "text": "The glossopharyngeal nerve.", "answer": "FALSE", "explanation": "This passes through the jugular foramen. Reference H, p. 240."}]}, {"qid": "84", "stem": "The following are directly related to the lateral ventricles:", "options": [{"letter": "A", "text": "The septum pellucidum.", "answer": "TRUE", "explanation": "It forms the medial wall of the body and anterior horn. Reference H, p. 379."}, {"letter": "B", "text": "The hippocampus.", "answer": "TRUE", "explanation": "It forms the floor of the inferior horn. Reference H, p. 379."}, {"letter": "C", "text": "The claustrum.", "answer": "FALSE", "explanation": "The claustrum is a thin sheet of grey matter lying deep to the insula. It is not related to the lateral ventricles. Reference G, p. 390 (Fig. 32-5)."}, {"letter": "D", "text": "The corpus callosum.", "answer": "TRUE", "explanation": "It forms the roof of the body and anterior horn, and one of the walls of the occipital horn and trigone. Reference H, p. 379."}, {"letter": "E", "text": "The trochlear nerve nucleus.", "answer": "FALSE", "explanation": "This lies in the peri-aqueductal grey matter. Reference G, p. 350."}]}, {"qid": "85", "stem": "The third ventricle:", "options": [{"letter": "A", "text": "Lies between the thalami.", "answer": "TRUE", "explanation": "They form the lateral walls of the ventricle. Reference H, p. 382."}, {"letter": "B", "text": "Communicates with the lateral ventricles through the interventricular foramina.", "answer": "TRUE", "explanation": "The foramina are located anterosuperiorly. Reference H, p. 381."}, {"letter": "C", "text": "Is related to the infundibulum of the pituitary.", "answer": "TRUE", "explanation": "The infundibular recess forms part of the floor of the ventricle. Reference H, p. 382."}, {"letter": "D", "text": "Has the facial colliculus in its floor.", "answer": "FALSE", "explanation": "This lies on the floor of the fourth ventricle, above the striae medullares. Reference G, p. 412."}, {"letter": "E", "text": "Has the optic chiasm in its floor.", "answer": "TRUE", "explanation": "Reference H, p. 382."}]}, {"qid": "86", "stem": "The following are direct relations of the third ventricle:", "options": [{"letter": "A", "text": "The massa intermedia (interthalamic connection).", "answer": "TRUE", "explanation": "This structure bridges the third ventricle between the thalami. Reference H, p. 373 (Fig. 8-19A)."}, {"letter": "B", "text": "The superior medullary velum.", "answer": "FALSE", "explanation": "This is a glial sheet in the roof of the fourth ventricle which stretches between the superior cerebellar peduncles (brachium conjunctivi). Reference H, p. 373 (Fig. 8-19A)."}, {"letter": "C", "text": "The globus pallidus.", "answer": "FALSE", "explanation": "This is the medial part of the lentiform nucleus and is separated from the third ventricle by the genu of the internal capsule, to which it is directly related, and by the thalamus. Reference G, p. 390 (Fig. 32-5)."}, {"letter": "D", "text": "The posterior commissure.", "answer": "TRUE", "explanation": "This structure lies in its posterior wall. Reference H, p. 373 (Fig. 8-19A)."}, {"letter": "E", "text": "The column of the fornix.", "answer": "TRUE", "explanation": "This forms a ridge in the anterolateral wall of the ventricle and lies immediately anterior to, and partly hides, the interventricular foramen. Reference H, p. 373 (Fig. 8-19A)."}]}, {"qid": "87", "stem": "The cerebral aqueduct of Sylvius is directly related to:", "options": [{"letter": "A", "text": "The tectum of the midbrain (the quadrigeminal plate).", "answer": "TRUE", "explanation": "A posterior relation. Reference H, p. 373 (Fig. 8-19A)."}, {"letter": "B", "text": "The lamina terminalis.", "answer": "FALSE", "explanation": "This forms the main anterior boundary to the third ventricle. Reference H, p. 373 (Fig. 8-19A)."}, {"letter": "C", "text": "The tegmentum of the midbrain.", "answer": "TRUE", "explanation": "This lies anteriorly. Reference G, p. 401."}, {"letter": "D", "text": "The oculomotor nucleus.", "answer": "TRUE", "explanation": "Reference G, p. 401."}, {"letter": "E", "text": "The mammillary bodies.", "answer": "FALSE", "explanation": "Part of the floor of the third ventricle is formed by the mammillary bodies. Reference H, p. 373 (Fig. 8-19A)."}]}, {"qid": "88", "stem": "In the fourth ventricle:", "options": [{"letter": "A", "text": "The angle between the superior and inferior medullary vela is known as the iter.", "answer": "FALSE", "explanation": "The iter is the opening of the aqueduct into the third ventricle. The angle between the vela is known as the fastigium. Reference H, p. 387."}, {"letter": "B", "text": "There is a foramen in each lateral recess which communicates with the subarachnoid space.", "answer": "TRUE", "explanation": "Reference G, p. 411. These are known as the foramina of Luschka."}, {"letter": "C", "text": "The pineal is a direct anterior relation.", "answer": "FALSE", "explanation": "The pineal is a posterior relation of the third ventricle. Reference H, p. 373 (Fig. 8- 19A)."}, {"letter": "D", "text": "The vagal triangle is situated to either side of the median sulcus in the ventricular floor.", "answer": "TRUE", "explanation": "Below the striae medullares. Reference G, p. 400 (Fig. 33-1)."}, {"letter": "E", "text": "The pulvinar forms a ridge in the floor.", "answer": "FALSE", "explanation": "The pulvinar is the wide posterior part of the thalamus. Reference G, p. 392."}]}]}, {"title": "Section 8 · Cisterns, Cranial Vasculature, Sutures & Spinal Canal", "questions": [{"qid": "89", "stem": "The ambient cistern:", "options": [{"letter": "A", "text": "Connects the interpeduncular and quadrigeminal cisterns.", "answer": "TRUE", "explanation": "Reference H, p. 356 (Fig. 8-6)."}, {"letter": "B", "text": "Contains the anterior cerebral artery.", "answer": "FALSE", "explanation": "The artery passes towards the midline and superiorly over the anterior part of the corpus callosum. Reference G, p. 429."}, {"letter": "C", "text": "Contains the anterior and posterior choroidal arteries.", "answer": "TRUE", "explanation": "Reference H, p. 365 (Table 8-4)."}, {"letter": "D", "text": "Contains the posterior cerebral artery.", "answer": "TRUE", "explanation": "The basal vein and superior cerebellar artery are also contained within the cistern. Reference H, p. 365 (Table 8-4)."}, {"letter": "E", "text": "Cannot be identified at computed tomography (CT).", "answer": "FALSE", "explanation": "It is readily identifiable. Reference H, (Appendix A, p. xii)."}]}, {"qid": "90", "stem": "The quadrigeminal cistern contains:", "options": [{"letter": "A", "text": "The inferior sagittal sinus.", "answer": "FALSE", "explanation": "This is contained within the free inferior edge of the falx cerebri. Reference H, p. 350."}, {"letter": "B", "text": "The great vein of Galen.", "answer": "TRUE", "explanation": "Reference H, p. 365 (Table 8-4)."}, {"letter": "C", "text": "The posterior cerebral arteries.", "answer": "FALSE", "explanation": "These arteries encircle the brain stem within the ambient cistern. In the distal part of their course, they approach the quadrigeminal cistern without entering it. Reference H, p. 458."}, {"letter": "D", "text": "The distal portion of the medial posterior choroidal artery.", "answer": "TRUE", "explanation": "Reference H, p. 365 (Table 8-4)."}, {"letter": "E", "text": "The bifurcation of the basilar artery.", "answer": "FALSE", "explanation": "This usually occurs at the level of the dorsum sellae in the interpeduncular cistern. Reference H, p. 455."}]}, {"qid": "91", "stem": "Concerning vascular impressions on the bony cranium:", "options": [{"letter": "A", "text": "Arteries cannot be distinguished from veins.", "answer": "FALSE", "explanation": "It may be possible to distinguish them apart by the tendency of arteries to taper progressively as they ascend and of veins to maintain a constant width. Reference H, p. 222."}, {"letter": "B", "text": "They tend to be more angular than fractures.", "answer": "FALSE", "explanation": "Vascular impressions are usually more smooth and undulating in their course than the generally angular fractures. Reference H, p. 222."}, {"letter": "C", "text": "Their tendency to occur in characteristic locations is an important feature in distinguishing them from fractures.", "answer": "TRUE", "explanation": "Reference H, p. 222."}, {"letter": "D", "text": "There is an anastomosis between the middle meningeal artery and a meningeal branch of the ophthalmic artery.", "answer": "TRUE", "explanation": "This is an anastomosis between branches of the internal and external carotid arteries. Reference H, p. 224 (Fig. 6-11C)."}, {"letter": "E", "text": "The groove due to the middle meningeal vessels normally measures 5 mm in width.", "answer": "FALSE", "explanation": "The average width is 1.5 mm with a maximum normal width of 2 mm. Reference H, p. 226."}]}, {"qid": "92", "stem": "Concerning the sutures of the skull:", "options": [{"letter": "A", "text": "The sagittal and coronal sutures meet at the pterion.", "answer": "FALSE", "explanation": "This is the bregma. Reference H, p. 227."}, {"letter": "B", "text": "The lambda marks the point where the coronal suture meets the sphenoid bone.", "answer": "FALSE", "explanation": "This is the pterion. Reference H, p. 227."}, {"letter": "C", "text": "The lambdoid and squamosal sutures meet at the asterion.", "answer": "TRUE", "explanation": "Reference H, p. 227."}, {"letter": "D", "text": "A wormian bone is a sutural bone existing within a suture.", "answer": "TRUE", "explanation": "Named after Olaus Worms, a Dane. Reference H, p. 231."}, {"letter": "E", "text": "Sutural sclerosis is a normal process.", "answer": "TRUE", "explanation": "The sclerosis occurs as the result of a bridging process across the suture. It becomes more apparent with advancing age. Reference H, p. 232."}]}, {"qid": "93", "stem": "The hypoglossal canal:", "options": [{"letter": "A", "text": "Transmits the occipital artery.", "answer": "FALSE", "explanation": "The occipital artery, which arises opposite the facial artery, passes backwards medial to the mastoid process and upwards over the posterior aspect of the skull. Reference G, p. 369."}, {"letter": "B", "text": "Transmits a meningeal branch of the ascending pharyngeal artery.", "answer": "TRUE", "explanation": "Reference H, p. 339. This branch may anastomose with the posterior branch of the middle meningeal artery. Reference H, p. 224 (Fig. 6-11C)."}, {"letter": "C", "text": "May be seen on a submentovertical projection.", "answer": "FALSE", "explanation": "Reference H, p. 339."}, {"letter": "D", "text": "Is seen on the Stenver's view.", "answer": "TRUE", "explanation": "The hypoglossal canals lie on or very near a line joining the external auditory canals, and are therefore seen on oblique views of the skull which place their axis perpendicular to the beam, e.g. the Stenver's. The canal is seen as a ring. Reference H, p. 339."}, {"letter": "E", "text": "May normally measure up to 11 mm in diameter.", "answer": "TRUE", "explanation": "Reference H, p. 343."}]}, {"qid": "94", "stem": "The following produce vascular impressions which may be seen normally on a lateral film of the skull:", "options": [{"letter": "A", "text": "The superficial temporal artery.", "answer": "TRUE", "explanation": "The middle temporal branch forms a vertically orientated line on the outer table of the squamous temporal bone anterior to and extending above the external auditory meatus. Reference H, p. 222."}, {"letter": "B", "text": "The posterior division of the middle meningeal vessels.", "answer": "TRUE", "explanation": "These anastomose with the branches of the ascending pharyngeal vessels. Reference H, p. 224 (Fig. 6-11E)."}, {"letter": "C", "text": "The posterior auricular artery.", "answer": "FALSE", "explanation": "It does not form a visible impression. This branch of the external carotid runs over the mastoid process supplying the parotid gland."}, {"letter": "D", "text": "The lateral (sigmoid) sinus.", "answer": "TRUE", "explanation": "Reference H, p. 224 (Fig. 6-11E)."}, {"letter": "E", "text": "The supra-orbital artery.", "answer": "TRUE", "explanation": "Reference H, p. 224 (Fig. 6-11E)."}]}, {"qid": "95", "stem": "Relating to cerebral veins and venous sinuses:", "options": [{"letter": "A", "text": "The superior sagittal sinus usually drains into the right transverse sinus.", "answer": "TRUE", "explanation": "Reference H, p. 350. Hence, the right sinus is usually larger than the left."}, {"letter": "B", "text": "The superior petrosal sinus passes through the jugular foramen.", "answer": "FALSE", "explanation": "This sinus is situated along the superior border of the petrous bone in the attachment of the tentorium cerebelli, and drains into the transverse sinus (Reference H, p. 352). The inferior petrosal sinus passes through the jugular foramen. Reference H, p. 240."}, {"letter": "C", "text": "The confluence of sinuses usually lies about 5 cm above the internal occipital protuberance.", "answer": "FALSE", "explanation": "The confluence occurs opposite to the protuberance. Reference H, p. 352."}, {"letter": "D", "text": "The basal vein usually drains into the occipital sinus.", "answer": "FALSE", "explanation": "It usually drains into the great cerebral vein of Galen. Reference H, p. 475."}, {"letter": "E", "text": "The internal cerebral veins form at the confluence of septal and thalamostriate veins.", "answer": "TRUE", "explanation": "Reference H, p. 470."}]}, {"qid": "96", "stem": "There are direct communications between:", "options": [{"letter": "A", "text": "The mastoid emissary veins and the sigmoid sinuses.", "answer": "TRUE", "explanation": "Reference H, p. 227."}, {"letter": "B", "text": "The inferior sagittal and straight sinuses.", "answer": "TRUE", "explanation": "The inferior sagittal sinus lies in the free inferior edge of the falx and ends in the straight sinus. Reference H, p. 352."}, {"letter": "C", "text": "The great vein of Galen and the superior sagittal sinus.", "answer": "FALSE", "explanation": "The internal cerebral veins unite to form the great vein, which then enters the inferior sagittal sinus. Reference H, p. 474."}, {"letter": "D", "text": "The occipital and superior petrosal sinuses.", "answer": "FALSE", "explanation": "The occipital sinus drains into the sinus confluens. The superior petrosal sinus joins the cavernous and transverse sinuses. Reference H, p. 352."}, {"letter": "E", "text": "The sphenoparietal and cavernous sinuses.", "answer": "TRUE", "explanation": "The sphenoparietal sinus begins just posterior to the coronal suture and courses along the lesser wing of the sphenoid to enter the cavernous sinus. Reference H, p. 227."}]}, {"qid": "97", "stem": "In the vertebral column:", "options": [{"letter": "A", "text": "The nucleus pulposus represents a persistence of the notochord into adulthood.", "answer": "TRUE", "explanation": "Reference H, p. 514."}, {"letter": "B", "text": "Secondary ossification centres appear in the second year of life.", "answer": "FALSE", "explanation": "They appear at puberty. Reference H, p. 517."}, {"letter": "C", "text": "The secondary ossification centres are situated in the laminae.", "answer": "FALSE", "explanation": "They appear at the tips of the spinous and transverse processes and at the upper and lower surfaces of the vertebral body. Reference H, p. 517."}, {"letter": "D", "text": "A narrow L5-S1 joint space may be normal.", "answer": "TRUE", "explanation": "At this point there is the junction of the lumbar and sacral curves. When narrowing occurs in the absence of other changes, it should be considered a normal finding. Reference H, p. 517."}, {"letter": "E", "text": "A sagittal diameter of 15 mm or less in the cervical spinal canal is abnormal.", "answer": "FALSE", "explanation": "A measurement of 10 mm or less is likely to be associated with cord compression. Reference H, p. 534."}]}, {"qid": "98", "stem": "In the spinal canal:", "options": [{"letter": "A", "text": "The cord is suspended by the anterior and posterior longitudinal ligaments.", "answer": "FALSE", "explanation": "The lateral ligaments of the cord, the denticulate ligaments, do this. Reference H, p. 565."}, {"letter": "B", "text": "The cord has its widest diameter at C3.", "answer": "FALSE", "explanation": "It is widest at C5 where the diameter is normally 12-14 mm. It is also enlarged at the level of T12 where it normally measures 11-13 mm in diameter. Reference H, p. 565."}, {"letter": "C", "text": "The artery of Adamkiewicz (arterioradicularis magna) is derived directly from the vertebral artery.", "answer": "FALSE", "explanation": "It is derived from the anterior radicular branch of one of the larger segmental arteries in the region of T8 to L4. In about 60% of people, it is left sided. It is the major segmental arterial supply to the dorsolumbar spine and anastomoses with the anterior spinal artery. Reference H, p. 575."}, {"letter": "D", "text": "The anterior spinal artery may be seen normally at myelography.", "answer": "TRUE", "explanation": "It produces a vertical, linear, midline filling-defect. This should not be confused with the tortuous, dilated vessels of a spinal angioma. Reference E, p. 1120."}, {"letter": "E", "text": "The cord usually ends at the level of the third lumbar vertebra.", "answer": "FALSE", "explanation": "It usually ends at the L1-2 interspace. Reference H, p. 565."}]}]}, {"title": "Section 9 · Vertebral Column, Shoulder, Limb Vessels & Lymphatics", "questions": [{"qid": "99", "stem": "In the vertebral column:", "options": [{"letter": "A", "text": "The bony union of the neural arch begins in the sacral region.", "answer": "FALSE", "explanation": "It begins in the neck at about the age of 3, and proceeds caudally to the sacrum which starts to ossify at 6-7 years. Reference H, p. 521."}, {"letter": "B", "text": "The anterior margin of C5 may normally be narrowed compared with the posterior margin.", "answer": "TRUE", "explanation": "And, less commonly, this infantile configuration may also persist in C6. It should not be interpreted as compression. Reference H, p. 538."}, {"letter": "C", "text": "'Schmorl's nodes' are central notches in the surfaces of bodies of thoracic vertebrae.", "answer": "TRUE", "explanation": "Their frequent occurrence in adults (about 40%) has made their significance debatable. Reference H, p. 544."}, {"letter": "D", "text": "Extra apophyses occur along the postero-superior surface of the bodies of lumbar vertebrae.", "answer": "FALSE", "explanation": "They occur along the antero-superior surface. Reference H, p. 518 (Fig. 9-12)."}, {"letter": "E", "text": "The ligamentum flavum is part of the anterior boundary of the spinal canal.", "answer": "FALSE", "explanation": "It lies posteriorly, uniting the laminae of adjacent vertebrae. Reference H, p. 562."}]}, {"qid": "100", "stem": "The shoulder joint:", "options": [{"letter": "A", "text": "Has a dependent pouch in the axillary part of the joint capsule.", "answer": "TRUE", "explanation": "Reference H, p. 80 (Fig. 4-15B and C). This is because the capsule is lax and because it extends inferiorly onto the surgical neck of the humerus."}, {"letter": "B", "text": "Usually communicates with the subscapular bursa.", "answer": "TRUE", "explanation": "Reference G, p. 195. The bursa lies deep to the subscapularis muscle, anterior to the joint and inferior to the coracoid process."}, {"letter": "C", "text": "Usually communicates with the subacromial bursa.", "answer": "FALSE", "explanation": "Although it may rarely do so. Reference P1, p. 78."}, {"letter": "D", "text": "Encloses the short head of biceps.", "answer": "FALSE", "explanation": "The long head passes in a tubular sheath of synovium through the joint. This sheath is prolonged under the transverse humeral ligament into the intertubercular groove. The long head is attached to the supraglenoid tubercle. Reference G, p. 204."}, {"letter": "E", "text": "Is related to the axillary nerve.", "answer": "TRUE", "explanation": "It is related inferiorly to the axillary nerve. Reference G, p. 195."}]}, {"qid": "101", "stem": "The axillary artery:", "options": [{"letter": "A", "text": "Gives off the suprascapular artery.", "answer": "FALSE", "explanation": "This is derived from the thyrocervical trunk. Reference G, p. 367."}, {"letter": "B", "text": "Supplies the female breast via the medial thoracic artery.", "answer": "FALSE", "explanation": "The main branch of the axillary artery supplying the breast is the lateral thoracic. Reference G, p. 202."}, {"letter": "C", "text": "Gives off the posterior humeral circumflex artery.", "answer": "TRUE", "explanation": "This is the larger of the humeral circumflex arteries. Reference P1, p. 29."}, {"letter": "D", "text": "Lies lateral to the axillary vein.", "answer": "TRUE", "explanation": "The vein lies medially and overlaps the artery anteriorly. As the arm is abducted, the vein comes to lie more and more anteriorly. Reference P1, p. 29."}, {"letter": "E", "text": "Is surrounded by the cords and branches of the brachial plexus.", "answer": "TRUE", "explanation": "Reference G, p. 201. The nerves may be compressed by haematoma when the artery is punctured at angiography."}]}, {"qid": "102", "stem": "Concerning the arteries in the upper limb:", "options": [{"letter": "A", "text": "The axillary artery becomes the brachial artery at the outer border of pectoralis minor.", "answer": "FALSE", "explanation": "This occurs at the outer border of teres major. The anterior wall of the axilla, consisting of the pectoral muscles, extends less distally than the posterior wall, formed laterally by teres major. This leaves the artery covered in its lower third by skin and fascia only (Reference P1, p. 27). Hence, one can gain access to the artery for arteriography."}, {"letter": "B", "text": "The nutrient artery to the humerus is directed proximally towards the shoulder.", "answer": "FALSE", "explanation": "It is directed towards the elbow and runs a course of at least 5 cm on the anteromedial border of the humerus. It must not be confused with a fracture. Reference H, p. 83."}, {"letter": "C", "text": "The brachial artery accompanies the radial nerve in the radial groove.", "answer": "FALSE", "explanation": "The profunda brachii artery does this. Reference G, p. 205."}, {"letter": "D", "text": "The brachial artery may divide into radial and ulnar branches opposite the mid-humerus.", "answer": "TRUE", "explanation": "Reference H, p. 85."}, {"letter": "E", "text": "The deep palmar arch is given off distal to the superficial arch.", "answer": "FALSE", "explanation": "The opposite occurs. Reference H, p. 117 (Fig. 4-45)."}]}, {"qid": "103", "stem": "Concerning normal variation:", "options": [{"letter": "A", "text": "The paraglenoid fossa is an indentation in the neck of the scapula.", "answer": "FALSE", "explanation": "It is a notch in the ilium immediately lateral to the inferior margin of the sacroiliac joint caused by the superior gluteal artery as it leaves the pelvis. Reference H, p. 127 (Fig. 5-7)."}, {"letter": "B", "text": "An articulation may occur between the coracoid process of the scapula and the conoid tubercle of the clavicle.", "answer": "TRUE", "explanation": "Forming a coracoclavicular joint. Reference H, p. 65 (Fig. 4-1B)."}, {"letter": "C", "text": "There may be lucency of the greater tuberosity.", "answer": "TRUE", "explanation": "It may be interpreted as a lytic lesion. Reference H, p. 83 (Fig. 4-16D)."}, {"letter": "D", "text": "A posterior 'fat pad' on the lateral view of the elbow may be seen.", "answer": "FALSE", "explanation": "The visibility of a fat plane behind the olecranon fossa is indicative of a joint effusion and a pathological entity such as a fracture or infection. Reference H, p. 93."}, {"letter": "E", "text": "Fat lines above and below the neck of the femur may be seen.", "answer": "TRUE", "explanation": "These are often referred to incorrectly as the joint capsule, but are caused by fat related to muscles. Reference H, p. 137 (Fig. 5-17F)."}]}, {"qid": "104", "stem": "In the wrist:", "options": [{"letter": "A", "text": "The arteries supplying the scaphoid bone enter in the distal portion.", "answer": "TRUE", "explanation": "Hence, when a fracture occurs, there is a risk of avascular necrosis because the proximal portion may become separated from its blood supply. Reference H, p. 104."}, {"letter": "B", "text": "The capitate articulates with the scaphoid.", "answer": "TRUE", "explanation": "Reference H, p. 106 (Fig. 4-33)."}, {"letter": "C", "text": "The capitate articulates with the second, third and fourth metacarpals.", "answer": "TRUE", "explanation": "Reference H, p. 106 (Fig. 4-33)."}, {"letter": "D", "text": "The lunate articulates with the trapezoid.", "answer": "FALSE", "explanation": "Reference H, p. 106 (Fig. 4-33)."}, {"letter": "E", "text": "The pisiform articulates with the hamate.", "answer": "FALSE", "explanation": "The pisiform articulates with the triquetral. Reference G, p. 223."}]}, {"qid": "105", "stem": "In the wrist, the proximal row of carpal bones includes:", "options": [{"letter": "A", "text": "The scaphoid.", "answer": "TRUE", "explanation": "Reference G, p. 223."}, {"letter": "B", "text": "The trapezoid.", "answer": "FALSE", "explanation": "Reference G, p. 223."}, {"letter": "C", "text": "The capitate.", "answer": "FALSE", "explanation": "Reference G, p. 223."}, {"letter": "D", "text": "The lunate.", "answer": "TRUE", "explanation": "Reference G, p. 223."}, {"letter": "E", "text": "The triquetral.", "answer": "TRUE", "explanation": "From lateral to medial, the bones in the proximal row are the scaphoid, lunate and triquetral. Reference G, p. 223."}]}, {"qid": "106", "stem": "The femoral artery:", "options": [{"letter": "A", "text": "Is directly related to the hip joint.", "answer": "FALSE", "explanation": "It is separated from the joint by the tendon of psoas. Reference G, p. 246."}, {"letter": "B", "text": "Supplies the skin in the pudendal region.", "answer": "TRUE", "explanation": "Through the external pudendal artery. Reference H, p. 193 (Fig. 5-83)."}, {"letter": "C", "text": "Is lateral to the femoral vein in its passage through the adductor canal.", "answer": "FALSE", "explanation": "It comes to lie anterior to the vein. Reference G, p. 255."}, {"letter": "D", "text": "Gives off the descending genicular artery in the adductor canal.", "answer": "TRUE", "explanation": "This branch springs from the femoral artery a short distance above the opening in the adductor magnus. Reference P1, p. 148."}, {"letter": "E", "text": "Becomes the popliteal artery after piercing adductor longus.", "answer": "FALSE", "explanation": "It becomes the popliteal artery after piercing adductor magnus, about 10 cm above the knee joint. Reference G, p. 253."}]}, {"qid": "107", "stem": "In the leg:", "options": [{"letter": "A", "text": "The deep femoral (profunda femoris) artery descends medial to the superficial femoral.", "answer": "FALSE", "explanation": "It descends lateral to the superficial femoral. Reference H, p. 192 (Fig. 5-82). It arises in the femoral triangle about 4-5 cm below the inguinal ligament."}, {"letter": "B", "text": "The deep femoral artery terminates by dividing into lateral and medial circumflex femoral arteries.", "answer": "FALSE", "explanation": "Although these are branches of the deep femoral artery, it terminates by perforating the adductor magnus muscle and dividing into muscular branches. Reference H, p. 192."}, {"letter": "C", "text": "The popliteal artery divides at the lower border of the popliteus muscle.", "answer": "TRUE", "explanation": "It divides into anterior and posterior tibial arteries. Reference H, p. 192."}, {"letter": "D", "text": "The anterior tibial artery supplies the tibial nutrient artery.", "answer": "FALSE", "explanation": "This arises from the posterior tibial artery (Reference H, p. 195). The nutrient foramina in the leg lie on the posterior surfaces and are directed away from the knee. Reference H, p. 42 (Fig. 3-6)."}, {"letter": "E", "text": "The peroneal artery is a branch of the posterior tibial.", "answer": "TRUE", "explanation": "It arises about 2.5 cm below the distal border of popliteus. Reference H, p. 194."}]}, {"qid": "108", "stem": "Concerning the anatomy of the lymphatics seen at lymphography:", "options": [{"letter": "A", "text": "The lymphatics do not have valves.", "answer": "FALSE", "explanation": "The abundant valves confer a beaded appearance to the lymphatics, and prevent backflow. Reference H, p. 200."}, {"letter": "B", "text": "The superficial inguinal nodes usually number five or less.", "answer": "FALSE", "explanation": "They usually number 10-20. Reference H, p. 202."}, {"letter": "C", "text": "The popliteal nodes drain directly to the deep inguinal nodes.", "answer": "TRUE", "explanation": "Reference H, p. 202."}, {"letter": "D", "text": "The superficial inguinal nodes drain into the deep inguinal group.", "answer": "TRUE", "explanation": "As well as to the lower external iliac nodes. Reference H, p. 202."}, {"letter": "E", "text": "The superficial inguinal nodes receive lymph from the abdominal wall up to the level of the umbilicus.", "answer": "TRUE", "explanation": "They receive lymph from a large area which also includes the gluteal region, the superficial structures of the legs and the external genitalia. Reference H, p. 202."}]}]}, {"title": "Section 10 · Hip, Knee, Ankle, Foot, Lower Limb Veins & Ossification", "questions": [{"qid": "109", "stem": "In the hip joint:", "options": [{"letter": "A", "text": "The capsule is attached to the intertrochanteric line.", "answer": "TRUE", "explanation": "Reference H, p. 141 (Fig. 5-23)."}, {"letter": "B", "text": "The capsule is attached to the intertrochanteric crest.", "answer": "FALSE", "explanation": "Reference H, p. 141 (Fig. 5-23)."}, {"letter": "C", "text": "The ischio-femoral ligament is one of the strongest in the body.", "answer": "FALSE", "explanation": "It is a weak ligament. The Y-shaped ilio-femoral ligament, however, is one of the strongest, rivalled only by the interosseous ligament of the sacroiliac joint. Reference P3, pp. 182-3."}, {"letter": "D", "text": "The ilio-femoral ligament is attached to the anterior superior iliac spine.", "answer": "FALSE", "explanation": "It is attached to the anterior inferior iliac spine. Reference G, p. 245."}, {"letter": "E", "text": "The angle between the axes of the neck and shaft of the femur is normally 100 degrees.", "answer": "FALSE", "explanation": "It varies between 110 and 140 degrees in the adult, with a mean of 127. The normal angle is greater than this at birth. Reference H, p. 134."}]}, {"qid": "110", "stem": "Relating to the hips and pelvis:", "options": [{"letter": "A", "text": "The obturator internis muscle may be seen on films of the pelvis.", "answer": "TRUE", "explanation": "Reference X, p. 843 (Fig. 12-2)."}, {"letter": "B", "text": "Adductor magnus is attached to the superior ramus of the pubic bone.", "answer": "FALSE", "explanation": "It is attached to the inferior ramus and the ischial tuberosity (Reference P1, p. 153 (Fig. 105)). The attachment of the adductor magnus muscle may be the site for an avulsion fracture."}, {"letter": "C", "text": "The lesser trochanter is well shown in the standard AP view of the hip.", "answer": "FALSE", "explanation": "The lesser trochanter is shown in maximum detail, and the neck of the femur is foreshortened, if the foot is everted. In the positioning for the AP view, the foot is inverted approximately 15 degrees. Reference H, p. 148 (Fig. 5-31)."}, {"letter": "D", "text": "In the AP projection, a line drawn along the outer margin of the femoral neck should intersect the femoral head.", "answer": "TRUE", "explanation": "In both AP and lateral projections (Reference H, p. 137). The femoral head may not be crossed by such a line when a slipped epiphysis is present."}, {"letter": "E", "text": "A double ossification centre for the femoral head is an indication of disease.", "answer": "FALSE", "explanation": "It is a normal variant. Reference X, p. 444 (Fig. 7-5)."}]}, {"qid": "111", "stem": "Concerning the hip joint:", "options": [{"letter": "A", "text": "The psoas bursa may communicate with the joint cavity.", "answer": "TRUE", "explanation": "This separates the iliopsoas muscle from the superior ramus of the pubic bone. It may communicate with the joint cavity between the iliofemoral and pubofemoral ligaments. Reference G, p. 246."}, {"letter": "B", "text": "Shenton's line joins the inferior margin of the obturator foramen to the inferior aspect of the femoral neck.", "answer": "FALSE", "explanation": "The line passes along the superior and medial margins of the obturator foramen, not the inferior margin (Reference H, p. 143). This line is used in the evaluation of the joint in cases of trauma."}, {"letter": "C", "text": "Piriformis is an anterior relation.", "answer": "FALSE", "explanation": "It lies posteriorly with the quadratus femoris, obturator internis, the gemelli, and the inferior gluteal nerve and vessels. Reference G, p. 246 (Fig. 21-3)."}, {"letter": "D", "text": "The ligament of the femoral head (ligamentum teres) carries a small branch of the obturator artery.", "answer": "TRUE", "explanation": "Reference H, p. 138."}, {"letter": "E", "text": "Gluteus medius lies superiorly.", "answer": "TRUE", "explanation": "With the reflected head of rectus femoris and the superior gluteal nerve and vessels. Reference G, p. 246 (Fig. 21-3)."}]}, {"qid": "112", "stem": "In the knee:", "options": [{"letter": "A", "text": "The anterior margin of the normal patella is often irregular.", "answer": "TRUE", "explanation": "An appearance caused by tendinous insertions and nutrient arteries. It should not be considered pathological. Reference H, p. 166."}, {"letter": "B", "text": "The lateral articular surface of the patella is smaller than the medial articular surface.", "answer": "FALSE", "explanation": "The lateral is the larger. Reference G, p. 257."}, {"letter": "C", "text": "The oblique popliteal ligament is an extension of the semitendinosus muscle.", "answer": "FALSE", "explanation": "It is an extension of semimembranosus. Reference G, p. 260."}, {"letter": "D", "text": "The thickenings of the joint capsule which bind the menisci to the outer margins of the tibia are the triangular ligaments.", "answer": "FALSE", "explanation": "They are the coronary ligaments. Reference G, p. 260."}, {"letter": "E", "text": "Part of the blood supply is derived from the descending branch of the lateral femoral circumflex artery.", "answer": "TRUE", "explanation": "Reference H, p. 193."}]}, {"qid": "113", "stem": "In the knee:", "options": [{"letter": "A", "text": "A popliteal bursa is usually present.", "answer": "FALSE", "explanation": "A bursa in the popliteal space is found in about 13% of knees. When it becomes inflamed, it is frequently referred to as a 'Baker's cyst'. Reference H, p. 154."}, {"letter": "B", "text": "The gastrocnemius bursa opens into the joint capsule.", "answer": "TRUE", "explanation": "The bursa is situated in the medial head of the muscle. Reference G, p. 265."}, {"letter": "C", "text": "The fabella lies in the lateral head of gastrocnemius.", "answer": "TRUE", "explanation": "Reference H, p. 138."}, {"letter": "D", "text": "The anterior cruciate ligament is attached to the anterior tibial spine.", "answer": "FALSE", "explanation": "It is attached to the anterior part of the intercondylar area. It passes superiorly, posteriorly and laterally to the medial aspect of the lateral femoral condyle. Reference G, p. 260."}, {"letter": "E", "text": "The lateral meniscus is intimately attached to the fibular collateral ligament.", "answer": "FALSE", "explanation": "The lateral meniscus is separate from the collateral ligament. The medial meniscus, however, is firmly connected to the tibial collateral ligament. Reference H, p. 152."}]}, {"qid": "114", "stem": "In the ankle and foot:", "options": [{"letter": "A", "text": "There is overlapping of the tibia and fibula on the standard AP view of the ankle.", "answer": "TRUE", "explanation": "However, a clear view of the talotibial joint space is obtained by this projection. A view of the distal tibia and fibula where there is no overlap may be obtained by pointing the foot further medially. Reference H, p. 177 (Fig. 5-63)."}, {"letter": "B", "text": "The epiphyseal line at the base of the 5th metatarsal is transversely orientated.", "answer": "FALSE", "explanation": "It is obliquely orientated. This contrasts with fractures in this region which tend to be transversely orientated. Reference H, p. 180."}, {"letter": "C", "text": "The first metatarsal is the longest of the metatarsals.", "answer": "FALSE", "explanation": "It is the shortest and thickest. The second metatarsal is the longest. Reference H, p. 180."}, {"letter": "D", "text": "The midline of the adult foot passes through the centre of the talus and the head of the 3rd metatarsal.", "answer": "FALSE", "explanation": "The midline passes through the centre of the calcaneus and the head of the 3rd metatarsal. Reference H, p. 186."}, {"letter": "E", "text": "The long axis of the first metatarsal is parallel to the midline of the foot.", "answer": "FALSE", "explanation": "It forms an angle of 15 degrees to the midline of the foot. A line drawn through the long axis of the first metatarsal also passes through the mid-axis of the talus. Reference H, p. 186."}]}, {"qid": "115", "stem": "In the ankle:", "options": [{"letter": "A", "text": "Part of the medial (deltoid) ligament is attached to the navicular bone.", "answer": "TRUE", "explanation": "This extremely strong ligament is attached proximally to the medial malleolus and distally to the body of the talus, the sustentaculum tali, the plantar calcaneonavicular ligament, the neck of the talus and the navicular. Reference G, p. 277."}, {"letter": "B", "text": "The calcaneus usually articulates with the navicular.", "answer": "FALSE", "explanation": "However, the plantar calcaneonavicular (spring) ligament passes between them, from the sustentaculum tali to the navicular tuberosity. Reference G, p. 279."}, {"letter": "C", "text": "The os vesalianum lies adjacent to the navicular.", "answer": "FALSE", "explanation": "The os tibiale externum lies adjacent to the navicular. The os vesalianum lies immediately proximal to the base of the 5th metatarsal. Reference H, p. 173 (Fig. 5-59)."}, {"letter": "D", "text": "The lower epiphysis of the fibula unites with the shaft at about the 20th year.", "answer": "TRUE", "explanation": "Reference H, p. 170."}, {"letter": "E", "text": "A secondary ossification centre appears in the calcaneus in the second year.", "answer": "FALSE", "explanation": "It appears at 8-10 years of age (Reference H, p. 176). Sclerosis and fragmentation of this secondary ossification centre may be seen frequently and should not be misinterpreted as abnormal. Reference X, p. 571 (Fig. 7-250)."}]}, {"qid": "116", "stem": "In the foot and ankle:", "options": [{"letter": "A", "text": "The great saphenous vein ascends anterior to the medial malleolus.", "answer": "TRUE", "explanation": "Having originated from the medial end of the dorsal venous arch. Reference G, p. 285."}, {"letter": "B", "text": "The small saphenous vein passes anterior to the lateral malleolus.", "answer": "FALSE", "explanation": "It passes posterior to it. Reference G, p. 286."}, {"letter": "C", "text": "The anterior tibial artery becomes the dorsal pedis artery.", "answer": "TRUE", "explanation": "Reference H, p. 195."}, {"letter": "D", "text": "The posterior tibial artery passes posterior to the lateral malleolus.", "answer": "FALSE", "explanation": "It passes posterior to the medial malleolus. Reference H, p. 195."}, {"letter": "E", "text": "The middle cuneiform is the largest of the cuneiform bones.", "answer": "FALSE", "explanation": "It is the smallest. Reference G, p. 275."}]}, {"qid": "117", "stem": "Concerning the veins of the lower limb:", "options": [{"letter": "A", "text": "The great saphenous vein joins the femoral vein in the femoral triangle.", "answer": "TRUE", "explanation": "The great saphenous vein passes through the saphenous opening which is an oval deficiency in the fascia lata. The fascia lata forms the roof of the femoral triangle. The opening is situated about 3 cm inferior and lateral to the pubic tubercle. Reference G, p. 253."}, {"letter": "B", "text": "The small saphenous vein joins the femoral vein in the adductor canal.", "answer": "FALSE", "explanation": "The small saphenous joins the popliteal vein after piercing the fascial roof of the popliteal fossa. Reference G, p. 286."}, {"letter": "C", "text": "There is normally no flow of blood from superficial to deep veins.", "answer": "FALSE", "explanation": "There are communicating branches allowing flow from the superficial to the deep systems (Reference H, p. 198). Valves prevent flow in the opposite direction."}, {"letter": "D", "text": "There are numerous valves in the deep veins.", "answer": "TRUE", "explanation": "They are more numerous than in the superficial veins. Reference H, p. 199."}, {"letter": "E", "text": "The intra-osseous veins of lower tibia and fibula drain into the superficial veins.", "answer": "FALSE", "explanation": "The contrast from an intra-osseous injection preferentially fills the deep system. The medullary cavity of the medial malleolus is the larger and is the better site for injection. Reference E, p. 47."}]}, {"qid": "118", "stem": "The following bones have usually begun to ossify at birth:", "options": [{"letter": "A", "text": "The glenoid cavity of the scapula.", "answer": "FALSE", "explanation": "Although much of the scapula is ossified at birth, the glenoid cavity, the acromion, the coracoid process, the vertebral border and the inferior angle are cartilaginous. Ossification of the glenoid begins at about the age of 10 years. Reference H, pp. 66-7."}, {"letter": "B", "text": "The calcaneus.", "answer": "TRUE", "explanation": "This bone is invariably ossified. The ossification centre appears at about 7 months in utero. Reference G, p. 273 (Fig. 23-1)."}, {"letter": "C", "text": "The scaphoid.", "answer": "FALSE", "explanation": "The ossification centre for the scaphoid appears at about 4-7 years of age. Reference H, p. 59 (Table 3-2)."}, {"letter": "D", "text": "The talus.", "answer": "TRUE", "explanation": "The ossification centre of the talus appears about 1 month after that of the calcaneus. Reference G, p. 273 (Fig. 23-1)."}, {"letter": "E", "text": "The head of the humerus.", "answer": "TRUE", "explanation": "Reference H, p. 59 (Table 3-2)."}]}, {"qid": "119", "stem": "The following have usually begun to ossify at birth:", "options": [{"letter": "A", "text": "The head of the femur.", "answer": "FALSE", "explanation": "This usually begins to ossify in the first 8 months of postnatal life. Reference H, p. 59 (Table 3-2)."}, {"letter": "B", "text": "The lower femoral ossification centre.", "answer": "TRUE", "explanation": "This appears at 8-9 months in utero. Reference G, p. 243 (Fig. 21-1)."}, {"letter": "C", "text": "The lower tibial ossification centre.", "answer": "FALSE", "explanation": "This appears at about 1 year of age. Reference G, p. 259 (Fig. 22-2)."}, {"letter": "D", "text": "The navicular bone.", "answer": "FALSE", "explanation": "This is usually the last of the tarsal bones to ossify. This generally happens between 2 and 5 years of age. Reference H, p. 59 (Table 3-2)."}, {"letter": "E", "text": "The greater tuberosity of the humerus.", "answer": "FALSE", "explanation": "This begins to ossify in the first year of life. Reference H, p. 59 (Table 3-2)."}]}, {"qid": "120", "stem": "The following bones have not usually begun to ossify in a 6-year-old child:", "options": [{"letter": "A", "text": "The patella.", "answer": "FALSE", "explanation": "Ossification will normally have occurred by the sixth year. Reference H, p. 59 (Table 3-2)."}, {"letter": "B", "text": "The tibial tuberosity.", "answer": "TRUE", "explanation": "Not usually ossified before the tenth to twelfth years. Reference H, p. 59 (Table 3- 2)."}, {"letter": "C", "text": "The lateral epicondyle of the elbow.", "answer": "TRUE", "explanation": "Ossifies at about 9-11 years of age. Reference H, p. 59 (Table 3-2)."}, {"letter": "D", "text": "The capitulum of the humerus.", "answer": "FALSE", "explanation": "Usually ossified by the age of 2. Reference H, p. 59 (Table 3-2)."}, {"letter": "E", "text": "The iliac crest.", "answer": "TRUE", "explanation": "The ossification centre for the iliac crest appears at puberty. Reference H, p. 59 (Table 3-2)."}]}]}]}, {"title": "PART III - RADIOLOGICAL TECHNIQUES AND RADIOGRAPHY", "sections": [{"title": "Section 1 - Water-Soluble Contrast Media and Urographic Reactions", "questions": [{"qid": "T1", "stem": "Concerning the water-soluble contrast media:", "options": [{"letter": "A", "text": "The conventional monomers (e.g. iothalamate) have an osmolality about twice that of plasma.", "answer": "FALSE", "explanation": "Their osmolality is 5-8 times that of plasma. Many significant adverse effects such as pain and hot flushing are directly attributable to the high osmolality. Reference: Dawson, P., et al. The new low osmolal contrast media: a simple guide. Clinical Radiology; 34:221-6 (1984)."}, {"letter": "B", "text": "Sudden collapse after the injection is invariably due to the high osmolality.", "answer": "FALSE", "explanation": "Sudden collapse is frequently an idiosyncratic reaction. Reference: Clinical Radiology; 34:221-6 (1984)."}, {"letter": "C", "text": "Ioxoglate is a monomer.", "answer": "FALSE", "explanation": "It is a monoacidic dimer. Reference: Clinical Radiology; 34:221-6 (1984)."}, {"letter": "D", "text": "Ioxoglate is twice as viscous at 20°C than at 37°C.", "answer": "TRUE", "explanation": "15.7 cP compared with 7.5 cP. The use of a water bath is helpful in keeping the contrast warm prior to injection. Reference: Clinical Radiology; 34:221-6 (1984)."}, {"letter": "E", "text": "The non-ionic contrast media have a greater mass of iodine per unit volume.", "answer": "FALSE", "explanation": "Their advantage lies in their low osmolality. Hopefully, their use will reduce the number of deaths due to reactions to intravenous contrast media. Reference: Clinical Radiology; 34:221-6 (1984)."}]}, {"qid": "T2", "stem": "Severe reactions to urographic contrast media:", "options": [{"letter": "A", "text": "Cause more deaths in patients over 50 years of age.", "answer": "TRUE", "explanation": "Severe reactions are defined as those where there is fear for the patient's life. They appear to be more frequent in the older age groups and have been shown to cause more deaths in people over 50 years of age. Reference U, p. 6."}, {"letter": "B", "text": "Occur in 90% of injections where there is a history of a previous reaction.", "answer": "FALSE", "explanation": "The risk of recurrence appears to be about 35%. Reference U, p. 18."}, {"letter": "C", "text": "May produce a prolonged nephrogram.", "answer": "TRUE", "explanation": "A persistently dense nephrogram and poor pelvicaliceal opacification will be found if the patient is profoundly hypotensive, which may occur as part of a severe reaction to contrast. Reference S, p. 223."}, {"letter": "D", "text": "Are invariably preceded by a rash or vomiting.", "answer": "FALSE", "explanation": "Although severe reactions may be presaged by nausea, vomiting or a skin rash, this is not invariable. Reference U, p. 8."}, {"letter": "E", "text": "Are an indication for the use of intravenous chlorpheniramine.", "answer": "FALSE", "explanation": "Antihistamines may be of value in the treatment of urticaria, e.g. chlorpheniramine maleate 10 mg intravenously. They are of no value either in the prophylaxis or treatment of severe reactions. Reference S, pp. 222-3."}]}, {"qid": "T3", "stem": "Concerning reactions to urographic contrast media:", "options": [{"letter": "A", "text": "Bronchospasm is more likely with a sodium than with a meglumine salt.", "answer": "FALSE", "explanation": "The incidence of bronchospasm is four times greater with meglumine media. Reference U, p. 19."}, {"letter": "B", "text": "They may occur when only 1 ml has been injected.", "answer": "TRUE", "explanation": "The use of such small amounts as a 'test injection' serves no useful function because it may itself cause a severe reaction or even death. Conversely, a severe reaction may occur with a large injection following an uneventful test dose. Reference U, p. 29."}, {"letter": "C", "text": "Rigors are seen in patients given large doses.", "answer": "TRUE", "explanation": "And more commonly with meglumine salts. They may rarely occur after a small injection. Reference U, p. 11."}, {"letter": "D", "text": "A perivenous injection will invariably be detected by the swelling it causes at the injection site.", "answer": "FALSE", "explanation": "A perivenous injection may not be clinically apparent. It may cause severe, persistent arm pain. This pain is most severe when the contrast medium has a high sodium content, e.g. Conray 420. Reference U, p. 12."}, {"letter": "E", "text": "They may be delayed in onset.", "answer": "TRUE", "explanation": "Although reactions usually occur during or a few minutes after the injection, they may rarely be delayed in onset. Reference U, p. 6."}]}, {"qid": "T4", "stem": "Sodium Iothalamate:", "options": [{"letter": "A", "text": "Does not cross the normal blood-brain barrier.", "answer": "FALSE", "explanation": "The normal blood-brain barrier is deficient at a number of sites. This is the central fact in Lalli's theory that reactions to contrast agents are mediated via the nervous system. Reference: Contrast media reactions: data analysis and hypothesis. Radiology; 134:1-12 (1980)."}, {"letter": "B", "text": "Is isomeric with sodium diatrizoate.", "answer": "TRUE", "explanation": "Reference S, p. 339."}, {"letter": "C", "text": "Is preferred to meglumine iothalamate in arthrography.", "answer": "FALSE", "explanation": "The sodium salt may cause severe pain if extra-articular injections occur. Reference K, p. 57."}, {"letter": "D", "text": "Causes haemolysis.", "answer": "TRUE", "explanation": "Reference S, p. 340."}, {"letter": "E", "text": "Is suitable for myelography.", "answer": "FALSE", "explanation": "A non-ionic contrast agent is indicated. Reference S, p. 265."}]}, {"qid": "T5", "stem": "The sodium salt of diatrizoic acid:", "options": [{"letter": "A", "text": "Is more viscous than the meglumine salt.", "answer": "FALSE", "explanation": "The meglumine salt is more viscous. Reference E, p. 599 (Table 29.1)."}, {"letter": "B", "text": "Causes less of a diuresis than the meglumine salt.", "answer": "TRUE", "explanation": "Which is the reason why sodium salts are preferred for urography. Reference S, p. 217."}, {"letter": "C", "text": "May rarely cause a peripheral neuropathy.", "answer": "FALSE", "explanation": ""}, {"letter": "D", "text": "May rarely cause salivary gland enlargement.", "answer": "TRUE", "explanation": "This usually occurs 2-4 days after the injection. Reference U, p. 15."}, {"letter": "E", "text": "Is predominantly bound to plasma protein.", "answer": "FALSE", "explanation": "Less than 1% is plasma-protein bound. Reference: Lasser, E. C., et al. The significance of protein binding of contrast media in Roentgen diagnosis. Am. J. Roentg; 87:338-60 (1962)."}]}, {"qid": "T6", "stem": "In intravenous urography:", "options": [{"letter": "A", "text": "Contrast is freely filtered at the glomerulus.", "answer": "TRUE", "explanation": "Reference S, p. 216."}, {"letter": "B", "text": "Water deprivation results in a denser nephrogram.", "answer": "FALSE", "explanation": "The 'tubular' nephrogram seen after an intravenous injection of contrast is the result of that freely filtered contrast in the renal tubules. It is independent of the degree of hydration. Reference S, p. 217."}, {"letter": "C", "text": "A rapid injection of a dose of contrast gives a denser nephrogram than a slower one.", "answer": "TRUE", "explanation": "The concentration of contrast in the glomerular filtrate, and the density of the nephrogram, depends on the peak plasma concentration and the renal blood flow. The former will depend upon the dose and rate of injection. Reference S, p. 216."}, {"letter": "D", "text": "A standard dose of contrast supplies 40 g of iodine in a 70 kg man.", "answer": "FALSE", "explanation": "The standard dose is 300 mg iodine per kg, which is 21 g in a man of 70 kg. Reference S, p. 217."}, {"letter": "E", "text": "The kidneys in infants are better demonstrated when the stomach is distended with air.", "answer": "TRUE", "explanation": "This supplies a 'window' through which the kidneys are seen. This can be achieved in infants who are being bottle fed by feeding them in the supine position immediately before and after the injection. More air is swallowed by tilting the bottle the wrong way. In older children, a carbonated drink or air introduced down a nasogastric tube can be used. Films should be taken AP and oblique (left side raised). This latter is more likely to project the gastric 'window' over the right kidney. Reference J, p. 43."}]}]}, {"title": "Section 2 · Urographic and Genitourinary Contrast Procedures", "questions": [{"qid": "T7", "stem": "In intravenous urography:", "options": [{"letter": "A", "text": "Iohexol causes an electrocardiographic change less often than sodium iothalamate.", "answer": "TRUE", "explanation": "Iohexol was shown to cause very few ECG changes. Reference: Heron, C. W., Underwood, S. R. and Dawson, P. Electrocardiographic changes during intravenous urography: a study with sodium iothalamate and iohexol. Clinical Radiology; 35:137–41 (1984)."}, {"letter": "B", "text": "Prone films are of no value.", "answer": "FALSE", "explanation": "They are often useful for demonstrating the ureters. Reference S, p. 220."}, {"letter": "C", "text": "Elevating the arm helps to alleviate pain extending proximally from the injection site.", "answer": "TRUE", "explanation": "This phenomenon, which results from stasis of contrast, is more likely to occur with sodium salts of high concentration, e.g. Conray 420. Reference S, p. 222."}, {"letter": "D", "text": "Opacification of the gut occurs if there is renal failure.", "answer": "TRUE", "explanation": "Hepatic excretion of the contrast occurs. Reference E, p. 826."}, {"letter": "E", "text": "Precipitation of renal failure in diabetics is a known risk of the procedure.", "answer": "TRUE", "explanation": "It is best to avoid urography in diabetics with renal impairment. Reference S, p. 215."}]}, {"qid": "T8", "stem": "An empty bladder is required before:", "options": [{"letter": "A", "text": "Lymphography.", "answer": "TRUE", "explanation": "Because the procedure may take a long time to complete, it is best to have the patient empty their bladder at the beginning. Reference S, p. 184."}, {"letter": "B", "text": "Pelvic ultrasound.", "answer": "FALSE", "explanation": "A full bladder is essential in pelvic ultrasound. If the bladder is empty, small bowel will fill the space and cause difficulties. Furthermore, the full bladder acts as an acoustic window. Reference F, p. 23."}, {"letter": "C", "text": "Intravenous urography.", "answer": "TRUE", "explanation": "Urine will dilute the contrast and prevent good mucosal coating on the after-micturition film. Reference S, p. 216."}, {"letter": "D", "text": "CT of the pelvis.", "answer": "FALSE", "explanation": "As with pelvic ultrasound, the distended bladder displaces small bowel out of the pelvis and facilitates identification of other structures. Reference Q, p. 393."}, {"letter": "E", "text": "Hysterosalpingography.", "answer": "TRUE", "explanation": "Because a full bladder displaces the uterus and interferes with its delineation by contrast. Reference J, p. 85."}]}, {"qid": "T9", "stem": "In retrograde urography in an undistended system:", "options": [{"letter": "A", "text": "Ureteric perforation may occur.", "answer": "TRUE", "explanation": "This is more likely with a rigid catheter. Reference S, p. 227."}, {"letter": "B", "text": "Acute renal failure is a complication of the procedure.", "answer": "TRUE", "explanation": "Rarely. Reference S, p. 227."}, {"letter": "C", "text": "Contrast with 300 mg iodine per 100 ml is used.", "answer": "FALSE", "explanation": "A contrast medium with a low concentration of iodine, such as Urografin 150, is used so that non-opaque calculi are not obscured. Reference S, p. 227."}, {"letter": "D", "text": "Filling of the pelvicaliceal system is best performed with a head-down tilt.", "answer": "TRUE", "explanation": "Reference S, p. 225."}, {"letter": "E", "text": "50 ml of contrast is usually needed to fill the pelvicaliceal system adequately.", "answer": "FALSE", "explanation": "5–10 ml is adequate. The injection should not be fast or made with more than minimal pressure. Reference S, p. 227."}]}, {"qid": "T10", "stem": "In urethrography of the male:", "options": [{"letter": "A", "text": "The Knutsson clamp should be used when there is a phimosis.", "answer": "FALSE", "explanation": "The clamp cannot be used in this situation, because the correct application of the clamp demands retraction of the prepuce. A Foley catheter with its balloon lying in the navicular fossa is indicated for this problem. Reference S, p. 241."}, {"letter": "B", "text": "A viscous contrast medium gives good distension of the urethra.", "answer": "TRUE", "explanation": "Which is a major advantage over simple water-soluble contrast. Reference S, p. 242."}, {"letter": "C", "text": "The bulbo-urethral glands are usually demonstrated.", "answer": "FALSE", "explanation": ""}, {"letter": "D", "text": "The verumontanum is seen in the normal patient.", "answer": "TRUE", "explanation": "This is a longitudinal ridge in the prostatic urethra."}, {"letter": "E", "text": "The procedure should be stopped if intravasation occurs.", "answer": "TRUE", "explanation": "Recent instrumentation predisposes to this complication. Bleeding may accompany it. Reference S, p. 243."}]}]}, {"title": "Section 3 · Barium Studies of the Alimentary Tract", "questions": [{"qid": "T11", "stem": "Gastrografin is preferred to barium in the examination of the alimentary tract:", "options": [{"letter": "A", "text": "In neonates.", "answer": "FALSE", "explanation": "The high osmolality of the conventional water-soluble contrast media causes problems when used in the very young because of the fluid t
