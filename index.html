achnoid sac is distended in the erect position which makes the successful puncture easier to achieve. Reference S, p. 266."}, {"letter": "C", "text": "Iohexol causes a significant change in electroencephalogram (EEG) activity in 50% of patients.", "answer": "FALSE", "explanation": "No significant change is seen in EEG activity in patients undergoing iohexol myelography. Reference: Kendall, B. and Stevens, J. Cervical myelography with iohexol. British Journal of Radiology; 57:785-7 (1984)."}, {"letter": "D", "text": "The neck is flexed to prevent dispersal of contrast when examining the cervical region.", "answer": "FALSE", "explanation": "Extension of the neck is of prime importance if dispersal of the bolus of contrast is to be avoided. This is because the cervical lordosis acts to pool the contrast. Reference S, p. 273."}, {"letter": "E", "text": "The incidence of side-effects is not reduced by 24 hours bed rest following the procedure.", "answer": "TRUE", "explanation": "Reference: MacPherson, P. and Teasdale, E. Radiculography with non-ionic contrast medium: routine bedrest is unnecessary. Clinical Radiology; 35:287-8 (1984)."}]}, {"qid": "69", "stem": "In cerebral angiography:", "options": [{"letter": "A", "text": "Only the anterior wall of the common carotid artery is punctured in the direct technique of carotid angiography.", "answer": "FALSE", "explanation": "The artery is transfixed by puncture of its anterior and posterior walls. The needle is then withdrawn into the lumen. Reference S, p. 286."}, {"letter": "B", "text": "6 ml iopamidol 300 at 4 ml/s is suitable for vertebral angiography.", "answer": "TRUE", "explanation": "Reference S, p. 108."}, {"letter": "C", "text": "Direct vertebral puncture is best performed with a short bevel needle.", "answer": "FALSE", "explanation": "A needle with a blocked tip and side hole is preferred because of the small lumen of the vertebral arteries. Reference S, p. 288."}, {"letter": "D", "text": "Direct puncture of the vertebral artery is performed with the patient's head extended and the carotid artery displaced laterally.", "answer": "TRUE", "explanation": "The artery is punctured in the mid-cervical region as it passes between the transverse foramina. Reference S, p. 288."}, {"letter": "E", "text": "Cortical blindness is a complication of carotid angiography.", "answer": "FALSE", "explanation": "It complicates vertebral angiography, is usually transient, and is thought to be a toxic effect. Reference S, p. 290. Radiological Techniques and Radiography Questions 70–75 (CT Scanning) — Extracted from uploaded pages"}]}, {"qid": "70", "stem": "The window level of a CT scan:", "options": [{"letter": "A", "text": "Refers to the range of attenuation values on the grey scale.", "answer": "FALSE", "explanation": "The range of values is the window width. The midpoint on the grey scale is the window level. Reference Q, p. 13."}, {"letter": "B", "text": "Should be at, or near to, the attenuation value of the tissue being displayed.", "answer": "TRUE", "explanation": "Reference Q, p. 13."}, {"letter": "C", "text": "Should be 100 for scans of the mediastinum.", "answer": "FALSE", "explanation": "It should be at zero. Reference Q, p. 14."}, {"letter": "D", "text": "Should be at the end of the negative scale for images of the lung fields.", "answer": "TRUE", "explanation": "Reference Q, p. 15."}, {"letter": "E", "text": "Has no effect on the measured size of a lesion.", "answer": "FALSE", "explanation": "It has some effect because of partial volume averaging. This is minimized by setting the window level halfway between the lesion density and the density of the background. Reference Q, p. 15."}]}, {"qid": "71", "stem": "In the use of contrast in CT:", "options": [{"letter": "A", "text": "Bowel need not be opacified when scanning the pancreas.", "answer": "FALSE", "explanation": "Bowel opacification is essential. Bowel that has not been opacified frequently simulates a mass. Reference Q, p. 16."}, {"letter": "B", "text": "Barium is contra-indicated.", "answer": "FALSE", "explanation": "Low-density barium (1.5% weight by volume) is available for CT scanning and is probably the contrast of choice in the alimentary tract. Reference Q, p. 16."}, {"letter": "C", "text": "An infusion of intravenous contrast is required for maximal enhancement of vascular structures.", "answer": "FALSE", "explanation": "A bolus is needed to give maximal vascular enhancement. Reference Q, p. 17."}, {"letter": "D", "text": "Oral doses given at two separate times are needed to opacify the gut on abdominal scans.", "answer": "TRUE", "explanation": "Contrast given 1 hour before will opacify the more distal bowel whereas the proximal bowel will be well opacified by contrast given 15 minutes before scanning. Reference Q, p. 17."}, {"letter": "E", "text": "The cephalic vein is preferred for the rapid injection of a bolus of contrast in the arm.", "answer": "FALSE", "explanation": "The median cubital or basilic vein is chosen because of the more direct route to the superior vena cava and because it is not obstructed by the over-the-head position adopted by the arm during a scan. Reference Q, p. 18."}]}, {"qid": "72", "stem": "In a CT scan of the brain using a CT number scale of 2000:", "options": [{"letter": "A", "text": "White matter has a higher CT number than grey matter.", "answer": "FALSE", "explanation": "Grey matter has a density of 35-40 units, and white matter a density about 10 less than this. Reference B, p. 341 (Fig. 24-21)."}, {"letter": "B", "text": "Clotted blood has a density of 50-80 units.", "answer": "TRUE", "explanation": "Reference B, p. 341 (Fig. 24-21)."}, {"letter": "C", "text": "Scans are generally made parallel to the canthomeatal line.", "answer": "TRUE", "explanation": ""}, {"letter": "D", "text": "The skin dose to the patient is about 5 rad for a completed scan.", "answer": "FALSE", "explanation": "It is about 1 rad, with a maximum of 1.6 rad. Reference B, p. 346."}, {"letter": "E", "text": "Intravenous contrast is given in cases of suspected cerebral infarction.", "answer": "FALSE", "explanation": "It may result in a deterioration of the patient's condition."}]}, {"qid": "73", "stem": "In CT of the larynx:", "options": [{"letter": "A", "text": "Scans are made during suspended inspiration.", "answer": "FALSE", "explanation": "They are made during a slow inspiratory effort. They are occasionally made during phonation ('e'). Reference Q, p. 37."}, {"letter": "B", "text": "The piriform sinuses are filled out by the Valsalva manoeuvre.", "answer": "TRUE", "explanation": "Reference Q, p. 40."}, {"letter": "C", "text": "10 mm thick slices are usually obtained.", "answer": "FALSE", "explanation": "Contiguous slices 5 mm thick are obtained. Reference Q, p. 37."}, {"letter": "D", "text": "The canthomeatal line is at 90 degrees to the horizontal.", "answer": "FALSE", "explanation": "The neck is extended 25-30 degrees to make the larynx as parallel to, and the vocal cords as perpendicular to, the table top as possible. Reference Q, p. 37."}, {"letter": "E", "text": "Asymmetry of the valleculae is abnormal.", "answer": "FALSE", "explanation": "This is a normal variant. Reference Q, p. 39."}]}, {"qid": "74", "stem": "In CT scans of the larynx:", "options": [{"letter": "A", "text": "The vocal processes of the arytenoid cartilages cannot be defined.", "answer": "FALSE", "explanation": "They are seen in 50% of patients. They define the level of the true cords. Reference Q, p. 42."}, {"letter": "B", "text": "Soft-tissue density is normally recorded within the lumen of the cricoid ring.", "answer": "FALSE", "explanation": "This would indicate tumour. Normally, no intraluminal soft-tissue density is appreciable at the level of the cricoid because the mucosa is adherent to the cartilage. Reference Q, p. 41."}, {"letter": "C", "text": "The laryngeal ventricle can be usually seen separating the true and false cords.", "answer": "FALSE", "explanation": "The laryngeal ventricle is seen in this way in only 10% of scans. This is a weakness of CT and it may be difficult to ascertain the spread of tumour from false to true cords or vice versa. Reference Q, p. 49."}, {"letter": "D", "text": "The cricoid lamina has a medullary centre.", "answer": "TRUE", "explanation": "Situated within a dense cortical rim. Reference Q, p. 41."}, {"letter": "E", "text": "Fat usually fills the space anterior and lateral to the epiglottis.", "answer": "TRUE", "explanation": "The fat in the so-called pre-epiglottic and paralaryngeal spaces is well demonstrated by CT. The spaces become obliterated by deeply infiltrating neoplasm which has a much higher density. Reference Q, p. 43."}]}, {"qid": "75", "stem": "In CT:", "options": [{"letter": "A", "text": "An intravenous or intraductal injection of contrast is required to demonstrate the parotid gland.", "answer": "FALSE", "explanation": "The parotid has a relatively low density because of contained fat. Masses associated with it are usually seen on an unenhanced scan. Contrast enhancement is sometimes helpful. Reference N, 22.1, p. 147."}, {"letter": "B", "text": "Iothalamate 320 is a suitable contrast agent for intraductal use in the parotid.", "answer": "FALSE", "explanation": "It is too dense and liable to produce artefacts. A medium with a low iodine concentration (5-7%) is required. Reference N, 22.1, p. 147."}, {"letter": "C", "text": "The infraorbital-meatal line is aligned parallel to the slice plane in scanning of the paranasal sinuses.", "answer": "TRUE", "explanation": "Additional scans may be performed in the coronal plane. Reference N, 22.1, p. 107."}, {"letter": "D", "text": "Dental amalgam creates artefacts that preclude the examination of facial structures.", "answer": "FALSE", "explanation": "However, it will require that the plane of cut be changed. Reference N, 22.1, p. 111."}, {"letter": "E", "text": "The thyroid gland appears dense because of its contained iodine.", "answer": "TRUE", "explanation": "It also enhances strongly after administration of intravenous contrast. Reference Q, p. 74. Radiological Techniques and Radiography Questions 76–79 — Extracted from uploaded pages"}]}, {"qid": "76", "stem": "In CT of the thorax:", "options": [{"letter": "A", "text": "Air is rarely demonstrated in the oesophagus.", "answer": "FALSE", "explanation": "Air is seen in the oesophagus in about 80% of normal patients. Reference Q, p. 59."}, {"letter": "B", "text": "Scans are made during suspended inspiration.", "answer": "TRUE", "explanation": "Variations in the phase of respiration may have a marked influence on CT appearances. Reference Q, p. 68."}, {"letter": "C", "text": "Short scanning times are important.", "answer": "TRUE", "explanation": "In order to reduce artefacts from respiratory and cardiac motion. Reference Q, p. 68."}, {"letter": "D", "text": "The oblique fissures are not visible.", "answer": "FALSE", "explanation": "They may be seen. Reference Q, p. 66 (Fig. 16)."}, {"letter": "E", "text": "Filling defects in the superior vena cava are seen in the normal patient during contrast enhancement.", "answer": "TRUE", "explanation": "They result from the incomplete mixing of opacified and unopacified blood. They are more likely to be seen in the later scans of a dynamic series. Reference Q, p. 70."}]}, {"qid": "77", "stem": "In paediatric radiology:", "options": [{"letter": "A", "text": "Cold barium should be used for filling the oesophagus in suspected tracheo-oesophageal fistula.", "answer": "FALSE", "explanation": "Cardiac arrest may occur if the contrast is not warmed first to body temperature. Reference S, p. 325."}, {"letter": "B", "text": "Enema reduction of an intussusception may be performed in the presence of plain film evidence of small-bowel obstruction.", "answer": "FALSE", "explanation": "It is contra-indicated in this situation, and in the presence of shock or peritonitis. Reference S, p. 328."}, {"letter": "C", "text": "Enema reduction of an intussusception is performed with a hydrostatic pressure of 4-5 ft (1.22-1.53 m).", "answer": "FALSE", "explanation": "The reduction should be attempted with the barium column no more than 1 m above the table. Reference S, p. 329."}, {"letter": "D", "text": "Leakage of contrast around the catheter should be avoided when filling the bladder at cystography.", "answer": "FALSE", "explanation": "This is a useful sign that adequate filling has occurred such that the child is likely to continue to micturate. Flexing of the toes is a similarly useful sign. Reference S, p. 334."}, {"letter": "E", "text": "The prone position is preferred for lumbar puncture in infants aged under 2 years.", "answer": "TRUE", "explanation": "With the lumbar spine flexed over a pad. Reference S, p. 331."}]}, {"qid": "78", "stem": "In a perfusion lung scan:", "options": [{"letter": "A", "text": "The scintillation detectors consist of pure sodium iodide.", "answer": "FALSE", "explanation": "A controlled amount of thallium is added to the crystal. Reference D, p. 1."}, {"letter": "B", "text": "Scans are performed with particles 10-50 µm in size.", "answer": "TRUE", "explanation": "99mTc-albumin macroaggregates or microspheres. Reference D, p. 17."}, {"letter": "C", "text": "Counting is performed with the patient erect.", "answer": "FALSE", "explanation": "The patient should be supine because the pulmonary blood flow to the bases is increased in the erect position. Reference D, p. 85."}, {"letter": "D", "text": "40 000 counts are collected per image.", "answer": "FALSE", "explanation": "400 000 counts are collected. Reference D, p. 85."}, {"letter": "E", "text": "1-3 mCi of activity is injected.", "answer": "TRUE", "explanation": "Reference D, p. 85."}]}, {"qid": "79", "stem": "In scanning of the brain with radiopharmaceuticals:", "options": [{"letter": "A", "text": "No patient preparation is necessary when using sodium pertechnetate.", "answer": "FALSE", "explanation": "400 mg sodium or potassium perchlorate is given a half-hour before the injection to prevent uptake by the choroid plexuses and salivary glands. Reference D, p. 26."}, {"letter": "B", "text": "99mTc-DTPA can be used.", "answer": "TRUE", "explanation": "The advantages being that no patient preparation is required and that there is a reduced radiation exposure (because of rapid renal elimination). Reference D, p. 25."}, {"letter": "C", "text": "Labelled glucoheptonate can be used.", "answer": "TRUE", "explanation": "Reference D, p. 25."}, {"letter": "D", "text": "The venous sinuses are not generally visible on a dynamic scan.", "answer": "FALSE", "explanation": "The venous sinuses are seen after the arterial phase. The superior sagittal sinus is particularly prominent. Reference D, p. 28."}, {"letter": "E", "text": "Delayed images should be obtained if a chronic subdural collection is suspected.", "answer": "TRUE", "explanation": "Late scans (at 4 hours) provide a diagnostic sensitivity of greater than 90% in the detection of chronic subdural haematoma. Reference D, p. 34. Radiological Techniques and Radiography Questions 80–83 — Extracted from uploaded pages"}]}, {"qid": "80", "stem": "In a technetium brain scan:", "options": [{"letter": "A", "text": "2-3 mCi of pertechnetate is used.", "answer": "FALSE", "explanation": "The dose is in the region of 15 mCi. Reference D, p. 27."}, {"letter": "B", "text": "Recent surgery or skin trauma may give false-positive results.", "answer": "TRUE", "explanation": "It is important to examine the patient in this situation. Reference D, p. 35."}, {"letter": "C", "text": "Cerebral secondaries are seen as areas of increased uptake on a dynamic scan.", "answer": "FALSE", "explanation": "They are usually silent at this stage. They produce areas of increased uptake on a static scan at a later stage. Reference D, p. 31."}, {"letter": "D", "text": "Steroids reduce tracer uptake by neoplasms.", "answer": "TRUE", "explanation": "So that it is desirable to perform the test before steroid therapy has been started. Reference D, p. 26."}, {"letter": "E", "text": "The ventricles are normally seen.", "answer": "FALSE", "explanation": "Unless perchlorate has been omitted from the patient's preparation. Reference D, p. 26."}]}, {"qid": "81", "stem": "The following tracers are taken up by infarcted heart muscle:", "options": [{"letter": "A", "text": "[123I]-hexadecanoic acid.", "answer": "FALSE", "explanation": "It concentrates in normal muscle so that infarcted muscle produces a 'cold spot'. Reference D, p. 59."}, {"letter": "B", "text": "Potassium-43.", "answer": "FALSE", "explanation": "It produces a cold spot. Reference D, p. 59."}, {"letter": "C", "text": "[99mTc]-glucoheptonate.", "answer": "TRUE", "explanation": "Forming a 'hot spot'. Reference D, p. 59."}, {"letter": "D", "text": "Thallium-201.", "answer": "FALSE", "explanation": "It produces a cold spot. Reference D, p. 59."}, {"letter": "E", "text": "[99mTc]-pyrophosphate.", "answer": "TRUE", "explanation": "It is widely used. Reference D, p. 60."}]}, {"qid": "82", "stem": "In scanning of the liver and spleen with radiopharmaceuticals:", "options": [{"letter": "A", "text": "Sulphur colloid is taken up by hepatocytes.", "answer": "FALSE", "explanation": "It is taken up by the reticuloendothelial system. HIDA is taken up by hepatocytes. Reference D, p. 104."}, {"letter": "B", "text": "The spleen cannot be selectively imaged.", "answer": "FALSE", "explanation": "Labelled, heat-damaged red blood cells can be used to image the spleen alone. Reference D, p. 117."}, {"letter": "C", "text": "HIDA is seen in the gut at 20 minutes.", "answer": "TRUE", "explanation": "Reference D, p. 115."}, {"letter": "D", "text": "The gall bladder may normally be 'silent' in a HIDA scan in the fasting subject.", "answer": "FALSE", "explanation": "A silent gall bladder is virtually diagnostic of acute cholecystitis. Reference D, p. 115."}, {"letter": "E", "text": "The total body radiation dose from a sulphur colloid scan is in the order of 1-2 rad (0.01-0.02 Gy).", "answer": "FALSE", "explanation": "It is 0.03-0.06 rad. Reference Z6, p. 97 (Table 7-7)."}]}, {"qid": "83", "stem": "In isotope renography:", "options": [{"letter": "A", "text": "[131I]-hippuran is excreted largely by glomerular filtration.", "answer": "FALSE", "explanation": "80% of the dose is eliminated by tubular secretion; the remainder is accounted for by filtration. Reference D, p. 137."}, {"letter": "B", "text": "DMSA is largely excreted by tubular secretion.", "answer": "TRUE", "explanation": "Reference D, p. 137."}, {"letter": "C", "text": "DTPA is excreted by glomerular filtration.", "answer": "TRUE", "explanation": "Reference D, p. 137."}, {"letter": "D", "text": "Sulphur colloid is used for blood-background subtraction.", "answer": "FALSE", "explanation": "Human serum albumin, which is a blood-pool marker, is used. Reference D, p. 122."}, {"letter": "E", "text": "The peak of the renogram curve is normally reached in 2-4 minutes.", "answer": "TRUE", "explanation": "A difference of greater than 1 minute between the kidneys in reaching the peak is considered to be indicative of unilateral disease. Reference D, p. 123. Radiological Techniques and Radiography"}]}, {"qid": "84", "stem": "In scintigraphy:", "options": [{"letter": "A", "text": "Anatomic markers are used in liver scans.", "answer": "TRUE", "explanation": "To mark the lower costal margin and the site of palpable abdominal masses. Markers are also important in thyroid scans. Reference D, p. 104."}, {"letter": "B", "text": "99mTc-pyrophosphate is used to detect infarcted heart muscle within 6 hours of the infarction.", "answer": "FALSE", "explanation": "This demonstrates infarcted muscle usually between 12 and 36 hours after the event. Thallium will show an infarct within the first 6 hours. Reference D, p. 60."}, {"letter": "C", "text": "Cerebrospinal studies may be performed with 111I-DTPA.", "answer": "TRUE", "explanation": "This is commonly used. Reference D, p. 38."}, {"letter": "D", "text": "Markedly raised pulmonary end-diastolic pressures are a contra-indication to the performance of a perfusion scan.", "answer": "FALSE", "explanation": "Perfusion scans are safe, although care should be taken in carrying out the study in the markedly compromised patient. Reference D, p. 84."}, {"letter": "E", "text": "The liver and spleen are seen on the normal bone scan.", "answer": "FALSE", "explanation": "This may happen in the presence of reduced Tc-tin oxide impurity. Reference D, p. 21."}]}, {"qid": "85", "stem": "81mKrypton:", "options": [{"letter": "A", "text": "Is used in cerebral blood flow studies.", "answer": "TRUE", "explanation": "It is also used in lung ventilation scans. Reference D, p. 39."}, {"letter": "B", "text": "Has a half-life of 5.5 days.", "answer": "FALSE", "explanation": "It has a half-life of 13 seconds. Xenon-133 has a half-life of 5.5 days. Reference D, p. 39."}, {"letter": "C", "text": "Emits radiation with energy of 191 keV.", "answer": "TRUE", "explanation": "Reference D, p. 86."}, {"letter": "D", "text": "Is taken up by the normal liver.", "answer": "FALSE", "explanation": ""}, {"letter": "E", "text": "Is derived from thallium.", "answer": "FALSE", "explanation": "It is obtained from rubidium-81. This has a short half-life (4.7 hours) which creates difficulties in obtaining a krypton generator. Reference Z7, p. 418."}]}, {"qid": "86", "stem": "The Valsalva manoeuvre:", "options": [{"letter": "A", "text": "Is used to demonstrate a swallowed foreign body lodged in the neck.", "answer": "TRUE", "explanation": "It is frequently difficult to separate ossification in the thyroid cartilage from that of an impacted fish bone. This problem is usually resolved by taking a lateral film of the neck before and during the Valsalva manoeuvre. The thyroid cartilage moves anteriorly, whilst a radio-opaque foreign body will be unchanged in position. Reference: Hadley, M.D.M. Letter to the editor. British Medical Journal; 289:762 (1984)."}, {"letter": "B", "text": "Is helpful when examining the oesophagus for varices.", "answer": "TRUE", "explanation": "Reference S, p. 15."}, {"letter": "C", "text": "Is used in myelography.", "answer": "FALSE", "explanation": ""}, {"letter": "D", "text": "Improves the demonstration of superficial veins in lower limb venography.", "answer": "FALSE", "explanation": "The manoeuvre helps to show the valves and improves the filling of deep veins such as the deep femoral and internal iliac veins. Incompetent communicating veins, particularly in the subsartorial canal, may be demonstrated during the performance of the manoeuvre. Reference L, p. 31."}, {"letter": "E", "text": "Increases the subglottic angle in the larynx.", "answer": "FALSE", "explanation": "It squares the angle. Reference K, p. 104."}]}, {"qid": "87", "stem": "Lignocaine:", "options": [{"letter": "A", "text": "Is excreted unchanged by the kidneys.", "answer": "FALSE", "explanation": "It is broken down by the liver (Reference V, p. 380). In theory, adverse effects are more likely to occur with lignocaine when it is used in patients with severe liver disease."}, {"letter": "B", "text": "Causes perioral paraesthesia and muscle tremor when an overdose is given.", "answer": "TRUE", "explanation": "Reference Z8, p. 781."}, {"letter": "C", "text": "Can cause convulsions.", "answer": "TRUE", "explanation": "Reference Z8, p. 781."}, {"letter": "D", "text": "Should not be given to patients on propranolol.", "answer": "FALSE", "explanation": "No adverse interaction occurs."}, {"letter": "E", "text": "Interacts adversely with tricyclic antidepressants.", "answer": "FALSE", "explanation": ""}]}, {"qid": "88", "stem": "A person who is taking monoamine oxidase inhibitors (MAOI):", "options": [{"letter": "A", "text": "Should not have arch aortography.", "answer": "FALSE", "explanation": "Angiography is not contra-indicated in patients taking MAOI."}, {"letter": "B", "text": "Should not receive intravenous glucose during angiography.", "answer": "FALSE", "explanation": ""}, {"letter": "C", "text": "Should not be given adrenaline.", "answer": "FALSE", "explanation": "Adrenaline can be given to patients on MAOI without its effects being potentiated. This is because it is chiefly destroyed by catechol-O- methyl transferase, and not by MAO. MAOI potentiate the indirect sympathomimetics, i.e. those that have their effect through the release of noradrenaline from nerve endings. Tyramine is the most noted example of such a drug. Reference V, p. 526."}, {"letter": "D", "text": "Can be given pethidine safely.", "answer": "FALSE", "explanation": "Although pethidine is not metabolized by MAO, its effects on the central nervous system are potentiated by the inhibitors. Respiratory depression, restlessness and coma may result. Reference V, p. 528."}, {"letter": "E", "text": "Should not be given barbiturates.", "answer": "TRUE", "explanation": "Because they potentiate the effects of barbiturates. Reference V, p. 528."}]}]}]}]</script>
<script>
  const DECK = JSON.parse(document.getElementById('deck-data').textContent);

  // Flatten into a global list of {chapterIdx, chapterTitle, sectionIdx, sectionTitle, question}
  const cards = [];
  DECK.forEach((chapter, ci) => {
    chapter.sections.forEach((section, si) => {
      section.questions.forEach((q) => {
        cards.push({
          chapterIdx: ci,
          chapterTitle: chapter.title,
          sectionIdx: si,
          sectionTitle: section.title,
          question: q
        });
      });
    });
  });

  let current = 0;

  const chapterSelect = document.getElementById('chapterSelect');
  const sectionSelect = document.getElementById('sectionSelect');
  const counterEl = document.getElementById('counter');
  const progressBar = document.getElementById('progressBar');
  const chapterLabel = document.getElementById('chapterLabel');
  const qnumLabel = document.getElementById('qnumLabel');
  const stemEl = document.getElementById('stem');
  const optionsEl = document.getElementById('options');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const jumpLabel = document.getElementById('jumpLabel');
  const revealAllBtn = document.getElementById('revealAllBtn');

  function shortChapterName(title){
    return title.replace(/^PART\s+[IVX]+\s*-\s*/i, '').trim();
  }

  function buildChapterSelect(){
    chapterSelect.innerHTML = '';
    DECK.forEach((chapter, ci) => {
      const opt = document.createElement('option');
      opt.value = ci;
      opt.textContent = shortChapterName(chapter.title);
      chapterSelect.appendChild(opt);
    });
  }

  function buildSectionSelect(chapterIdx){
    sectionSelect.innerHTML = '';
    DECK[chapterIdx].sections.forEach((section, si) => {
      const opt = document.createElement('option');
      opt.value = si;
      opt.textContent = section.title;
      sectionSelect.appendChild(opt);
    });
  }

  function findFirstCardIndex(chapterIdx, sectionIdx){
    return cards.findIndex(c => c.chapterIdx === chapterIdx && c.sectionIdx === sectionIdx);
  }

  function renderCard(){
    const c = cards[current];
    chapterLabel.textContent = shortChapterName(c.chapterTitle) + ' · ' + c.sectionTitle;
    qnumLabel.textContent = 'Q' + c.question.qid;
    stemEl.textContent = c.question.stem;

    optionsEl.innerHTML = '';
    c.question.options.forEach((opt) => {
      const wrap = document.createElement('div');
      wrap.className = 'option';

      const textRow = document.createElement('div');
      textRow.className = 'opt-text';
      const letter = document.createElement('span');
      letter.className = 'opt-letter';
      letter.textContent = opt.letter + '.';
      const txt = document.createElement('span');
      txt.textContent = opt.text;
      textRow.appendChild(letter);
      textRow.appendChild(txt);
      wrap.appendChild(textRow);

      const btn = document.createElement('button');
      btn.className = 'reveal-btn';
      btn.textContent = 'Tap to Reveal Answer';

      const ans = document.createElement('div');
      ans.className = 'answer';
      const verdict = document.createElement('span');
      verdict.className = 'verdict ' + (opt.answer === 'TRUE' ? 'true' : 'false');
      verdict.textContent = opt.answer;
      ans.appendChild(verdict);
      if (opt.explanation && opt.explanation.trim().length > 0){
        const expl = document.createElement('div');
        expl.className = 'explanation';
        expl.textContent = opt.explanation;
        ans.appendChild(expl);
      }

      btn.addEventListener('click', () => {
        const isShown = ans.classList.toggle('show');
        btn.textContent = isShown ? 'Hide Answer' : 'Tap to Reveal Answer';
        wrap.classList.toggle('answered', isShown);
        wrap.classList.toggle('opt-true', isShown && opt.answer === 'TRUE');
        wrap.classList.toggle('opt-false', isShown && opt.answer === 'FALSE');
      });

      wrap.appendChild(btn);
      wrap.appendChild(ans);
      optionsEl.appendChild(wrap);
    });

    counterEl.textContent = (current + 1) + ' / ' + cards.length;
    jumpLabel.textContent = 'Card ' + (current + 1) + ' of ' + cards.length;
    progressBar.style.width = (((current + 1) / cards.length) * 100).toFixed(1) + '%';
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === cards.length - 1;

    chapterSelect.value = c.chapterIdx;
    buildSectionSelect(c.chapterIdx);
    sectionSelect.value = c.sectionIdx;
  }

  revealAllBtn.addEventListener('click', () => {
    document.querySelectorAll('#options .reveal-btn').forEach(btn => {
      if (btn.textContent === 'Tap to Reveal Answer') btn.click();
    });
  });

  prevBtn.addEventListener('click', () => {
    if (current > 0){ current--; renderCard(); }
  });
  nextBtn.addEventListener('click', () => {
    if (current < cards.length - 1){ current++; renderCard(); }
  });

  chapterSelect.addEventListener('change', () => {
    const ci = parseInt(chapterSelect.value, 10);
    buildSectionSelect(ci);
    const idx = findFirstCardIndex(ci, 0);
    current = idx >= 0 ? idx : current;
    renderCard();
  });

  sectionSelect.addEventListener('change', () => {
    const ci = parseInt(chapterSelect.value, 10);
    const si = parseInt(sectionSelect.value, 10);
    const idx = findFirstCardIndex(ci, si);
    if (idx >= 0){ current = idx; renderCard(); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextBtn.click();
    if (e.key === 'ArrowLeft') prevBtn.click();
  });

  buildChapterSelect();
  renderCard();
</script>
</body>
</html>
