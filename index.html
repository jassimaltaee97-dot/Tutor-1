<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Manal — TUTOR 1</title>
<style>
  :root{
    --bg: #0b1620;
    --panel: #101f2e;
    --panel-2: #132433;
    --line: #223649;
    --ink: #eaf2f8;
    --ink-dim: #9db4c4;
    --accent: #4fb0c6;
    --accent-2: #2f7f96;
    --true: #34c77b;
    --true-bg: rgba(52,199,123,0.12);
    --false: #ef6a6a;
    --false-bg: rgba(239,106,106,0.12);
    --gold: #d8a84f;
    --radius: 14px;
    --serif: "Iowan Old Style", "Georgia", "Palatino Linotype", serif;
    --sans: "Inter", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 85% -10%, rgba(79,176,198,0.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(216,168,79,0.07), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:920px;
    margin:0 auto;
    padding:22px 18px 70px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:14px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  header.top .brand{
    font-family:var(--serif);
    font-size:1.5rem;
    letter-spacing:0.2px;
  }
  header.top .brand small{
    display:block;
    font-family:var(--mono);
    font-size:0.65rem;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:4px;
  }
  header.top .counter{
    font-family:var(--mono);
    font-size:0.8rem;
    color:var(--ink-dim);
    text-align:right;
    white-space:nowrap;
  }

  .selectors{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .selectors select{
    flex:1;
    min-width:220px;
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    font-family:var(--sans);
    font-size:0.85rem;
  }

  .progress-wrap{
    height:5px;
    background:var(--panel);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .progress-bar{
    height:100%;
    background:linear-gradient(90deg, var(--accent-2), var(--accent));
    width:0%;
    transition:width .25s ease;
  }

  .stage{
    flex:1;
    display:flex;
    align-items:stretch;
  }

  .card{
    width:100%;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:30px 28px 26px;
    box-shadow:0 20px 50px -25px rgba(0,0,0,0.6);
    position:relative;
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:24px;right:24px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity:0.5;
  }
  .tag-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:var(--mono);
    font-size:0.72rem;
    color:var(--ink-dim);
    letter-spacing:0.5px;
  }
  .tag-row .qnum{
    color:var(--gold);
    font-weight:600;
  }
  .stem{
    font-family:var(--serif);
    font-size:1.28rem;
    line-height:1.5;
    color:var(--ink);
    padding-bottom:6px;
    border-bottom:1px dashed var(--line);
  }

  .options{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .option{
    border:1px solid var(--line);
    border-radius:10px;
    background:rgba(255,255,255,0.015);
    overflow:hidden;
  }
  .option .opt-text{
    display:flex;
    gap:12px;
    padding:13px 14px;
    font-size:0.97rem;
    line-height:1.45;
  }
  .option .opt-letter{
    font-family:var(--mono);
    font-weight:700;
    color:var(--accent);
    flex:0 0 auto;
  }
  .reveal-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--panel);
    border:none;
    border-top:1px solid var(--line);
    color:var(--accent);
    font-family:var(--sans);
    font-size:0.78rem;
    letter-spacing:0.6px;
    text-transform:uppercase;
    padding:10px 8px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .reveal-btn:hover{ background:var(--accent-2); color:#fff; }

  .answer{
    display:none;
    padding:13px 14px 15px;
    border-top:1px solid var(--line);
    font-size:0.9rem;
    line-height:1.5;
  }
  .answer.show{ display:block; }
  .verdict{
    font-family:var(--mono);
    font-weight:700;
    letter-spacing:1px;
    font-size:0.8rem;
    padding:2px 9px;
    border-radius:5px;
    display:inline-block;
    margin-bottom:8px;
  }
  .verdict.true{ color:var(--true); background:var(--true-bg); border:1px solid rgba(52,199,123,0.35);}
  .verdict.false{ color:var(--false); background:var(--false-bg); border:1px solid rgba(239,106,106,0.35);}
  .explanation{ color:var(--ink-dim); }

  .option.answered.opt-true{ border-color:rgba(52,199,123,0.4); }
  .option.answered.opt-false{ border-color:rgba(239,106,106,0.4); }

  .card-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-top:6px;
  }
  .reveal-all{
    font-family:var(--sans);
    font-size:0.78rem;
    color:var(--ink-dim);
    background:transparent;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    cursor:pointer;
  }
  .reveal-all:hover{ color:var(--ink); border-color:var(--accent); }

  nav.pager{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-top:20px;
  }
  nav.pager button{
    font-family:var(--sans);
    font-size:0.85rem;
    font-weight:600;
    background:var(--panel-2);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 20px;
    cursor:pointer;
    flex:1;
    transition:background .15s ease, border-color .15s ease;
  }
  nav.pager button:hover:not(:disabled){ border-color:var(--accent); }
  nav.pager button:disabled{ opacity:0.35; cursor:not-allowed; }
  nav.pager .jump{
    font-family:var(--mono);
    font-size:0.78rem;
    color:var(--ink-dim);
    flex:0 0 auto;
    text-align:center;
    min-width:70px;
  }

  footer.hint{
    text-align:center;
    color:var(--ink-dim);
    font-size:0.72rem;
    margin-top:22px;
    font-family:var(--mono);
    letter-spacing:0.4px;
  }

  @media (max-width:560px){
    .app{padding:16px 12px 60px;}
    .card{padding:22px 18px 20px;}
    .stem{font-size:1.12rem;}
  }
</style>

een the crura.", "answer": "TRUE", "explanation": "Along with the aorta and the azygos vein. Reference G, p. 56."}]}, {"qid": "3", "stem": "Concerning accessory lobes and fissures in the lung:", "options": [{"letter": "A", "text": "The inferior accessory fissure is the commonest accessory fissure.", "answer": "TRUE", "explanation": "This separates the medial basal segment of the lower lobe. It is seen in approximately 8% of frontal chest films and 45% of post-mortem specimens. Reference H, p. 611."}, {"letter": "B", "text": "The inferior accessory fissure occurs more frequently on the left.", "answer": "FALSE", "explanation": "It occurs more often on the right. Reference W, p. 78."}, {"letter": "C", "text": "The posterior basal segment may exist as a separate lobe.", "answer": "FALSE", "explanation": ""}, {"letter": "D", "text": "A middle lobe on the left occurs in about 2% of normal chests.", "answer": "FALSE", "explanation": "It practically never occurs. Reference H, p. 611."}, {"letter": "E", "text": "The superior accessory fissure divides off the apical segment of the lower lobe from the remainder of the lobe.", "answer": "TRUE", "explanation": "It occurs less frequently than the inferior accessory fissure and more commonly than the azygos fissure. It may be easily mistaken for the minor septum. Reference W, p. 77."}]}, {"qid": "4", "stem": "The thoracic duct:", "options": [{"letter": "A", "text": "Is closely related to the oesophagus.", "answer": "TRUE", "explanation": "It is a posterior relation of the oesophagus. Reference H, p. 672."}, {"letter": "B", "text": "Lies to the right of the azygos vein.", "answer": "FALSE", "explanation": "It lies to the left of the vein. Reference G, p. 92."}, {"letter": "C", "text": "Crosses in front of the carotid sheath.", "answer": "FALSE", "explanation": "It crosses behind the sheath. Reference H, p. 672."}, {"letter": "D", "text": "Crosses to the left of the median plane at the level of T5.", "answer": "TRUE", "explanation": "Reference H, p. 672."}, {"letter": "E", "text": "Has no valves.", "answer": "FALSE", "explanation": "Valves can usually be visualized in the thoracic duct at lymphangiography. They are highly variable in size and number. Reference H, p. 689."}]}, {"qid": "5", "stem": "At the level of the third thoracic vertebra in the chest, the trachea is immediately related to:", "options": [{"letter": "A", "text": "The thymus.", "answer": "FALSE", "explanation": "The remains of the thymus in the adult are situated in the anterior mediastinum away from the trachea. Reference H, p. 663 (Fig. 11-6)."}, {"letter": "B", "text": "The right phrenic nerve.", "answer": "FALSE", "explanation": "This lies lateral to the superior vena cava. Reference H, p. 663 (Fig. 11-6)."}, {"letter": "C", "text": "The right pleura.", "answer": "TRUE", "explanation": "Reference H, p. 663 (Fig. 11-6)."}, {"letter": "D", "text": "The brachiocephalic artery.", "answer": "TRUE", "explanation": "Reference H, p. 663 (Fig. 11-6)."}, {"letter": "E", "text": "The superior vena cava.", "answer": "TRUE", "explanation": "The superior vena cava is formed at this level by the union of the brachiocephalic veins. Reference H, p. 663 (Fig. 11-6)."}]}, {"qid": "6", "stem": "In the chest:", "options": [{"letter": "A", "text": "The left main bronchus is narrower than the right main bronchus.", "answer": "TRUE", "explanation": "Because the right main bronchus is wider and more vertically orientated than the left, foreign bodies tend to enter it more frequently. Reference G, p. 79."}, {"letter": "B", "text": "The carinal angle is normally about 60 degrees in adults.", "answer": "TRUE", "explanation": "The angle is normally greater in children and gradually diminishes with growth. An enlarged left atrium increases the angle. Reference H, p. 594."}, {"letter": "C", "text": "There are usually three segments in the left upper lobe.", "answer": "FALSE", "explanation": "The usual arrangement (75% of cases) is a bifurcation into a superior division, supplying the apicoposterior and anterior segments, and a lingular division, supplying a superior and an inferior segment. Reference W, p. 156."}, {"letter": "D", "text": "The right pulmonary artery lies above the right main bronchus.", "answer": "FALSE", "explanation": "The artery lies anterior to the bronchus. It is the left pulmonary artery that arches over the left main bronchus. Reference H, p. 624 (Fig. 10-40)."}, {"letter": "E", "text": "The right main bronchus may normally indent the oesophagus.", "answer": "FALSE", "explanation": "The left main bronchus is one of four points of narrowness in the oesophagus, the others being at the level of the cricoid, at the level of the aortic knob, and during passage through the diaphragm. Reference H, p. 771."}]}, {"qid": "7", "stem": "In the right lung:", "options": [{"letter": "A", "text": "The upper lobe usually has four segmental divisions.", "answer": "FALSE", "explanation": "It usually has three: apical, posterior and anterior. In about 15% of individuals will be found the so-called axillary segment. Reference W, p. 151."}, {"letter": "B", "text": "The apical segmental bronchus of the upper lobe may arise directly from the trachea.", "answer": "TRUE", "explanation": "It is known as a 'displaced bronchus', i.e. a bronchus in an abnormal position which supplies a normally located pulmonary segment. Reference W, p. 151."}, {"letter": "C", "text": "A subsuperior segment in the lower lobe is present in 50% of individuals.", "answer": "TRUE", "explanation": "And it is present in about 30% of individuals on the left. Reference W, pp. 155-7."}, {"letter": "D", "text": "The minor fissure is seen in 80% of frontal radiographs.", "answer": "FALSE", "explanation": "Although present in 80% of dissections, it is seen in about 50% of frontal films. Reference W, p. 73."}, {"letter": "E", "text": "The azygos lobe is seen in 5% of frontal radiographs.", "answer": "FALSE", "explanation": "It is seen in 1% of anatomic dissections and 0.4% of frontal chest films. Reference W, p. 74."}]}, {"qid": "8", "stem": "In the chest:", "options": [{"letter": "A", "text": "The right oblique fissure is more vertically orientated than the left.", "answer": "FALSE", "explanation": "The left tends to be the more vertically orientated and to join the diaphragmatic pleura more posteriorly. The approximate angles to the horizontal are 60 degrees for the left and 50 degrees for the right. Reference H, p. 609."}, {"letter": "B", "text": "The interlobar septa consist of visceral and parietal pleura.", "answer": "FALSE", "explanation": "They consist of two layers of visceral pleura. Reference H, p. 638."}, {"letter": "C", "text": "The pores of Kohn permit transfer of air between the lobes.", "answer": "FALSE", "explanation": "The pores are openings in the alveoli which permit collateral air drift between segments of the lung only. The canals of Lambert are broncho-alveolar connections. Reference H, p. 608."}, {"letter": "D", "text": "The anterior basal branch of the right lower lobe bronchus is usually given off before the medial basal branch.", "answer": "FALSE", "explanation": "The medial basal branch is given off first at the level of the apical segmental bronchus. Reference W, p. 144 (Fig. 4-1)."}, {"letter": "E", "text": "Of an infant, the trachea may normally deviate to the right.", "answer": "TRUE", "explanation": "This is thought to be due either to thymic enlargement or to tracheal redundancy. Reference H, p. 593."}]}, {"qid": "9", "stem": "The azygos vein:", "options": [{"letter": "A", "text": "Is usually formed anterior to the transverse process of L3.", "answer": "FALSE", "explanation": "This is too low. The azygos and hemiazygos veins are formed at the level of the renal veins, which is L2. Reference G, p. 75."}, {"letter": "B", "text": "Lies immediately anterior to the oesophagus at the level of D8.", "answer": "FALSE", "explanation": "It lies posteriorly and to the right of the oesophagus at this level. Reference H, p. 770 (Fig. 13-7)."}, {"letter": "C", "text": "Receives the oesophageal veins.", "answer": "TRUE", "explanation": "These veins may enlarge in chronic superior vena cava obstruction. Reference W, p. 236."}, {"letter": "D", "text": "Receives the inferior thyroid vein.", "answer": "FALSE", "explanation": "This vein unites with its fellow prior to joining the left brachiocephalic vein. Reference G, p. 362."}, {"letter": "E", "text": "Receives the right lymph trunk.", "answer": "FALSE", "explanation": "This structure drains into the right brachiocephalic vein. Reference G, p. 92."}]}, {"qid": "10", "stem": "The azygos 'knob' (i.e. that part of the azygos vein that is seen on the frontal view of the chest):", "options": [{"letter": "A", "text": "Lies between the right upper lobe and intermediate bronchi.", "answer": "FALSE", "explanation": "It lies between the origin of the right upper lobe bronchus and the right tracheal border. Reference W, p. 232."}, {"letter": "B", "text": "Is enlarged if greater than 10 mm in diameter on an erect film.", "answer": "TRUE", "explanation": "According to Felson, who looked at a large series of normal chest films. Reference W, p. 236."}, {"letter": "C", "text": "Is normally larger in pregnancy.", "answer": "TRUE", "explanation": "Reference H, p. 669."}, {"letter": "D", "text": "Is larger in the erect than in the supine position.", "answer": "FALSE", "explanation": "It is larger in the supine position. Reference H, p. 669."}, {"letter": "E", "text": "Is smaller on inspiration.", "answer": "TRUE", "explanation": "The fact that the azygos shrinks on standing, on inspiration and during the Valsalva manoeuvre permits its differentiation from an enlarged azygos node. Reference W, p. 258."}]}, {"qid": "11", "stem": "The bronchial arteries:", "options": [{"letter": "A", "text": "Usually arise from the aorta.", "answer": "TRUE", "explanation": "In 90% of cases. Reference H, p. 615."}, {"letter": "B", "text": "May arise from the internal mammary arteries.", "answer": "TRUE", "explanation": "They may also arise from the subclavian or first three intercostal arteries. Reference H, p. 615."}, {"letter": "C", "text": "Usually arise at the level of D7-8.", "answer": "FALSE", "explanation": "In 80% of cases they arise at the level of D5-6. Reference H, p. 615."}, {"letter": "D", "text": "Do not normally communicate with the pulmonary circulation.", "answer": "FALSE", "explanation": "The bronchial arteries form capillary plexuses which drain via both bronchial and pulmonary veins. Reference H, p. 615."}, {"letter": "E", "text": "May be seen on a normal chest radiograph.", "answer": "FALSE", "explanation": "They become enlarged and may be visualized in conditions such as Fallot's tetralogy where pulmonary arterial flow is reduced. Reference W, p. 230."}]}, {"qid": "12", "stem": "Concerning the normal right descending pulmonary artery:", "options": [{"letter": "A", "text": "The maximum normal width in men is 20 mm.", "answer": "FALSE", "explanation": "According to Chang, the maximum normal width in men is 16 mm and in women 15 mm. Above these measurements, the pulmonary artery is abnormal and pulmonary hypertension should be considered. Reference: Am. J. Roentgenol. 87:929-35 (1962)."}, {"letter": "B", "text": "Width measurements are greater in expiration.", "answer": "FALSE", "explanation": "It usually measures 1-2 mm more in inspiration. This is thought to occur because of the fall in intra-alveolar pressure. It may measure more in expiration when pulmonary hypertension is present. Reference: Am. J. Roentgenol. 87:929-35 (1962)."}, {"letter": "C", "text": "Forms an angle with the inferior pulmonary vein which is known as the hilar angle.", "answer": "FALSE", "explanation": "The hilar angle is that between the descending pulmonary artery and the superior pulmonary vein. Reference H, p. 615."}, {"letter": "D", "text": "The hilar angle normally measures 160 degrees.", "answer": "FALSE", "explanation": "It usually measures 120 degrees. Reference H, p. 615."}, {"letter": "E", "text": "The hilar angle changes with rise in left atrial pressure.", "answer": "TRUE", "explanation": "It tends to become obliterated in this situation. Reference H, p. 615."}]}, {"qid": "13", "stem": "The oesophagus:", "options": [{"letter": "A", "text": "Begins at the level of the fourth cervical vertebra.", "answer": "FALSE", "explanation": "It begins behind the cricoid cartilage at the level of C6. Reference G, p. 364."}, {"letter": "B", "text": "Is related to the left common carotid artery.", "answer": "TRUE", "explanation": "It is related in the neck to the lateral lobes of the thyroid and the common carotid arteries. Reference G, p. 364."}, {"letter": "C", "text": "Is related to the left recurrent laryngeal nerve.", "answer": "TRUE", "explanation": "The nerves lie between the trachea and the oesophagus. Reference G, p. 364."}, {"letter": "D", "text": "Is related to the right pulmonary artery.", "answer": "FALSE", "explanation": "It is separated from the artery by the right main bronchus. Reference H, p. 770 (Fig. 13-7)."}, {"letter": "E", "text": "Is related to the external jugular vein.", "answer": "FALSE", "explanation": "The vein lies anteriorly in the neck and is not related. Reference G, p. 372."}]}, {"qid": "14", "stem": "Concerning the oesophagus:", "options": [{"letter": "A", "text": "An aberrant right subclavian artery produces an anterior impression on the oesophagus.", "answer": "FALSE", "explanation": "This anomaly, which is associated with persistence of a right aortic arch, produces a posterior impression on the oesophagus. Reference H, p. 697."}, {"letter": "B", "text": "It is directly related to the arch of the aorta.", "answer": "TRUE", "explanation": "As the aorta arches backwards towards the vertebral column, it passes to the left side of the oesophagus and causes it to be deviated to the right. Reference H, p. 768."}, {"letter": "C", "text": "Cricopharyngeus may produce an anterior impression in its upper part.", "answer": "FALSE", "explanation": "The cricopharyngeus produces its impression posteriorly. Reference H, p. 784 (Fig. 13-24)."}, {"letter": "D", "text": "Schatzki's ring marks the junction between gastric and oesophageal mucosa.", "answer": "TRUE", "explanation": "Also known as a Wolf B ring, it represents the true mucosal junction when a portion of the stomach has herniated through the diaphragmatic hiatus. Reference H, pp. 773-8."}, {"letter": "E", "text": "The right atrium is an immediate anterior relation.", "answer": "FALSE", "explanation": "In the lower thorax, it is separated from the left atrium by pericardium. Reference G, p. 77."}]}, {"qid": "15", "stem": "The anterior descending branch of the left coronary artery:", "options": [{"letter": "A", "text": "Is accompanied by the middle cardiac vein.", "answer": "FALSE", "explanation": "It is accompanied by the great cardiac vein in the anterior interventricular groove. The middle cardiac vein is situated in the posterior interventricular groove. Reference H, p. 750."}, {"letter": "B", "text": "Supplies the interventricular septum.", "answer": "TRUE", "explanation": "It supplies the anterior two-thirds of the apical portion of the septum. Reference H, p. 746."}, {"letter": "C", "text": "Usually gives a branch to the sino-atrial node.", "answer": "FALSE", "explanation": "Although it may do so, it is usual for the node to be supplied from the right coronary artery. Reference H, p. 750."}, {"letter": "D", "text": "Supplies the anteroapical portion of the left ventricle.", "answer": "TRUE", "explanation": "Reference H, p. 746."}, {"letter": "E", "text": "Anastomoses with the posterior descending artery over the apex of the heart.", "answer": "TRUE", "explanation": "And also via septal anastomoses. Reference H, p. 758 (Fig. 12-58)."}]}, {"qid": "16", "stem": "In the heart:", "options": [{"letter": "A", "text": "The right coronary artery arises from the right posterior aortic sinus.", "answer": "FALSE", "explanation": "It arises from the anterior sinus. The left coronary arises from the left posterior sinus. Reference G, p. 62."}, {"letter": "B", "text": "The superomedial part of the right atrium is directly related to the root of the aorta.", "answer": "TRUE", "explanation": "This is the right auricular appendage. Reference G, p. 60."}, {"letter": "C", "text": "The mitral valve lies anterior to the aortic valve.", "answer": "FALSE", "explanation": "It lies posteriorly and inferiorly. Reference H, p. 702 (Fig. 12-13); and p. 698 (Fig. 12-11)."}, {"letter": "D", "text": "The tricuspid valve lies posteroinferiorly in the right ventricle.", "answer": "TRUE", "explanation": "Reference G, p. 61."}, {"letter": "E", "text": "The aortic valve lies posteromedially in relation to the pulmonary valve.", "answer": "TRUE", "explanation": "Reference H, p. 702 (Fig. 12-13); and p. 698 (Fig. 12-11)."}]}, {"qid": "17", "stem": "Veins opening directly into the right atrium include:", "options": [{"letter": "A", "text": "The coronary sinus.", "answer": "TRUE", "explanation": "This is formed at the left border of the heart and enters the right atrium near to the orifice of the inferior vena cava. Reference G, p. 65."}, {"letter": "B", "text": "The great cardiac vein.", "answer": "FALSE", "explanation": "It joins the left marginal vein to form the coronary sinus. Reference G, p. 65."}, {"letter": "C", "text": "The anterior cardiac veins.", "answer": "TRUE", "explanation": "These several veins drain the anterior wall of the right ventricle directly into the atrium. Reference G, p. 65."}, {"letter": "D", "text": "The oblique vein.", "answer": "FALSE", "explanation": "It drains into the coronary sinus. Reference G, p. 65."}, {"letter": "E", "text": "The small cardiac vein.", "answer": "FALSE", "explanation": "It drains into the sinus. Reference G, p. 65."}]}, {"qid": "18", "stem": "The superior vena cava:", "options": [{"letter": "A", "text": "Is formed at the middle of the right manubrial border.", "answer": "TRUE", "explanation": "Reference G, pp. 74-5."}, {"letter": "B", "text": "Enters the right atrium at the level of the fourth costal cartilage.", "answer": "FALSE", "explanation": "It does so at the level of the third costal cartilage. Reference G, pp. 74-5."}, {"letter": "C", "text": "Is directly related to the pleura covering the mediastinal surface of the right lung.", "answer": "TRUE", "explanation": "Reference G, pp. 74-5."}, {"letter": "D", "text": "Is partly covered by pericardium.", "answer": "TRUE", "explanation": "In its lower half it is covered by serous and fibrous pericardium. Reference G, pp. 74-5."}, {"letter": "E", "text": "Receives the bronchial veins.", "answer": "FALSE", "explanation": "The superior vena cava receives a single tributary, the azygos vein. The bronchial veins drain into the azygos system. Reference G, pp. 74-5."}]}, {"qid": "19", "stem": "Concerning the paraspinal lines:", "options": [{"letter": "A", "text": "The right paraspinal line is seen more frequently than the left.", "answer": "FALSE", "explanation": "According to Lien and Kolbenstvedt, the right line is seen in one third, and the left in nearly all cases. Reference: Clinical Radiology 33:31-5 (1982)."}, {"letter": "B", "text": "The right line usually extends above T6.", "answer": "FALSE", "explanation": "It is seen at levels below this. Reference: Clinical Radiology 33:31-5 (1982)."}, {"letter": "C", "text": "They are associated with wider paraspinal soft tissues in the elderly.", "answer": "TRUE", "explanation": "This is related in some way to aortic unfolding. Reference: Clinical Radiology 33:31-5 (1982)."}, {"letter": "D", "text": "The left paraspinal soft tissues tend to be wider than those on the right.", "answer": "TRUE", "explanation": "There is a considerable normal range at each level. Depending on which level measurement is made, the mean width on the right varies from 4 to 6 mm and on the left from 5 to 10 mm. Reference: Clinical Radiology 33:31-5 (1982)."}, {"letter": "E", "text": "They represent the interface of mediastinal soft tissues and contiguous lung.", "answer": "TRUE", "explanation": "Although the lines may represent layers of parietal and visceral pleura, it seems likely that they are due to the Mach effect, a form of edge enhancement occurring at boundaries marking a sudden change in tissue densities. Reference: Clinical Radiology 33:31-5 (1982)."}]}, {"qid": "20", "stem": "The aorta:", "options": [{"letter": "A", "text": "Enters the abdomen at the level of the lower end of T12.", "answer": "TRUE", "explanation": "It enters the abdomen through the aortic hiatus in the diaphragm between the crura. Reference H, p. 958."}, {"letter": "B", "text": "Normally divides at the level of L5.", "answer": "FALSE", "explanation": "It generally ends opposite L4. Reference H, p. 958."}, {"letter": "C", "text": "Is directly related on its right side to the cisterna chyli.", "answer": "TRUE", "explanation": "Reference G, p. 146."}, {"letter": "D", "text": "Gives off four unpaired branches.", "answer": "TRUE", "explanation": "These are the coeliac artery, the superior and inferior mesenteric arteries and the median sacral artery. The last branch is given off from the posterior aspect of the aorta at the bifurcation. Reference G, p. 147."}, {"letter": "E", "text": "Gives off the gonadal arteries opposite the lower end of L1.", "answer": "FALSE", "explanation": "These are given off at the level of L3. Reference G, p. 147."}]}]}, {"title": "Section 2 · Abdomen, GI Tract & Retroperitoneum", "questions": [{"qid": "21", "stem": "The stomach may receive its blood supply from:", "options": [{"letter": "A", "text": "The common hepatic artery.", "answer": "TRUE", "explanation": "Via the right gastric and the gastroduodenal arteries. The former may arise from the left or, uncommonly, the right hepatic arteries. Reference H, p. 834."}, {"letter": "B", "text": "The splenic artery.", "answer": "TRUE", "explanation": "This is the largest branch of the coeliac axis and supplies the stomach via the left gastro-epiploic and the short gastric arteries. Reference H, p. 837."}, {"letter": "C", "text": "The middle colic artery.", "answer": "FALSE", "explanation": "This supplies the transverse colon. Reference G, p. 123."}, {"letter": "D", "text": "The superior mesenteric artery.", "answer": "TRUE", "explanation": "This artery may give rise to the splenic or right gastroepiploic arteries. Reference H, p. 878."}, {"letter": "E", "text": "The inferior mesenteric artery.", "answer": "FALSE", "explanation": "It supplies the left colon, the sigmoid and rectum. Reference H, p. 881."}]}, {"qid": "22", "stem": "The superior mesenteric artery:", "options": [{"letter": "A", "text": "Usually arises at the level of L2.", "answer": "FALSE", "explanation": "It usually arises between 1 and 6 mm below the origin of the coeliac trunk, opposite the mid or lower third of the body of the first lumbar vertebra. However, it may arise at lower levels in a minority of cases. Reference H, p. 878."}, {"letter": "B", "text": "Gives off the superior pancreaticoduodenal artery.", "answer": "FALSE", "explanation": "It gives the inferior pancreaticoduodenal, which forms an arterial arcade along the head of the pancreas by anastomosing with the superior artery, derived from the gastroduodenal. Reference H, p. 808 (Fig. 13-51B and C)."}, {"letter": "C", "text": "Lies to the right of the vein.", "answer": "FALSE", "explanation": "It lies to the left. Reference H, p. 883."}, {"letter": "D", "text": "Crosses the right gonadal vein.", "answer": "TRUE", "explanation": "The superior mesenteric artery lies within the mesentery of the small bowel and crosses the inferior vena cava, the right ureter and the right gonadal vessels. Reference G, p. 123."}, {"letter": "E", "text": "May supply the right lobe of the liver.", "answer": "TRUE", "explanation": "The right hepatic artery arises from the superior mesenteric in 14% of cases. Reference H, p. 878."}]}, {"qid": "23", "stem": "Concerning arteries to retroperitoneal organs:", "options": [{"letter": "A", "text": "The adrenal glands may be supplied directly by branches of the aorta.", "answer": "TRUE", "explanation": "These are known as the middle adrenal arteries. They may be single or multiple on each side. They may also be absent. Reference H, p. 990."}, {"letter": "B", "text": "The adrenal glands receive branches from the dorsal pancreatic artery.", "answer": "FALSE", "explanation": ""}, {"letter": "C", "text": "The adrenal glands are supplied by the inferior phrenic arteries.", "answer": "TRUE", "explanation": "In addition to the middle adrenal and inferior phrenic arteries, the adrenal glands are supplied by branches of the renal arteries. Reference H, p. 990."}, {"letter": "D", "text": "Multiple renal arteries are seen in less than 2.5% of the population.", "answer": "FALSE", "explanation": "These are a common normal variation, occurring in about 25% of the population. Reference H, p. 1010."}, {"letter": "E", "text": "Renal arteries may normally produce extrinsic filling defects in the calices.", "answer": "TRUE", "explanation": "And occasionally, an accessory renal artery arising from a low position may compress the ureter or pelvis. Reference H, p. 1022."}]}, {"qid": "24", "stem": "The inferior vena cava:", "options": [{"letter": "A", "text": "Begins anterior to the body of L5.", "answer": "TRUE", "explanation": "Reference H, p. 960."}, {"letter": "B", "text": "Lies anterior to the right adrenal gland.", "answer": "TRUE", "explanation": "Reference G, p. 148."}, {"letter": "C", "text": "Pierces the diaphragm at the level of T10.", "answer": "FALSE", "explanation": "It pierces the diaphragm at the level of T8. Reference H, p. 960."}, {"letter": "D", "text": "May be seen on a normal lateral chest film.", "answer": "TRUE", "explanation": "The inferior vena cava may produce confusing appearances on the lateral film. For example, it may mimic atelectasis. Identifying it helps to distinguish the right leaf of the diaphragm, which is related to it, from the left, which is not. Reference X, p. 729 (Fig. 9-172)."}, {"letter": "E", "text": "Has no functioning valves.", "answer": "TRUE", "explanation": ""}]}, {"qid": "25", "stem": "The following are tributaries of the inferior vena cava:", "options": [{"letter": "A", "text": "The azygos vein.", "answer": "FALSE", "explanation": "The azygos vein is formed either as a branch of the inferior vena cava or by the union of right ascending lumbar and subcostal veins. It is the tributary of the superior vena cava. Reference G, p. 75."}, {"letter": "B", "text": "The third and fourth lumbar veins.", "answer": "TRUE", "explanation": "The vessels from the left side pass posterior to the aorta. The first and second lumbar veins drain into the ascending lumbar vein, while the fifth drains via the iliolumbar vein into the common iliac. Reference P2, p. 197."}, {"letter": "C", "text": "The right adrenal vein.", "answer": "TRUE", "explanation": "Reference G, p. 148."}, {"letter": "D", "text": "The left testicular vein.", "answer": "FALSE", "explanation": "The left testicular and adrenal veins drain into the left renal vein. The corresponding veins on the right drain into the vena cava. Reference G, p. 148."}, {"letter": "E", "text": "The pancreatic veins.", "answer": "FALSE", "explanation": "These drain into the splenic vein. Reference G, p. 883."}]}, {"qid": "26", "stem": "In the normal abdomen, the following structures may be seen on the plain radiograph:", "options": [{"letter": "A", "text": "The ligamentum teres.", "answer": "TRUE", "explanation": "Because it may contain fat. By recognizing its characteristic shape and position, it will not be confused with air either in the biliary tree or free in the peritoneum. Reference: Haswell, Berne and Schneider. Radiology 114:263-7 (1975)."}, {"letter": "B", "text": "The right crus of the diaphragm.", "answer": "TRUE", "explanation": "However, the left is more commonly visible. Reference X, p. 771 (Fig. 11-37)."}, {"letter": "C", "text": "The antrum of the stomach simulating a soft-tissue mass.", "answer": "TRUE", "explanation": "Reference X, p. 764 (Fig. 11-24)."}, {"letter": "D", "text": "The transversus abdominis muscle.", "answer": "TRUE", "explanation": "As may the external and internal oblique muscles. This is more often possible in patients with a large amount of body fat. Reference H, p. 941 (Fig. 15-19)."}, {"letter": "E", "text": "The gall bladder.", "answer": "FALSE", "explanation": "This is because the visibility of abdominal organs depends on whether they indent the extraperitoneal perivisceral fat or not. The gall bladder does not indent the fat and is therefore not normally visible. It may be detected by its impression on the adjacent transverse colon. Reference: Whalen and Berne. Radiology 92:466-72 (1969)."}]}, {"qid": "27", "stem": "In the normal abdomen:", "options": [{"letter": "A", "text": "Unilateral absence of the psoas shadow on a plain film is not seen.", "answer": "FALSE", "explanation": "Elkin and Cohen found it to be absent on the right in 9%, and on the left in 5.5%, of plain films of normal patients taken prior to intravenous urography. They did not find it to be a reliable indicator of disease. Reference: Clinical Radiology 13:210-17 (1962)."}, {"letter": "B", "text": "The ileocaecal valve may simulate a polypoid mass at barium enema.", "answer": "TRUE", "explanation": "In these cases, it is important to take films demonstrating the relationship to the terminal ileum. Reference X, p. 811 (Fig. 11-122)."}, {"letter": "C", "text": "The spleen does not indent the stomach at a barium meal.", "answer": "FALSE", "explanation": "It may mimic a mass. Reference X, p. 785 (Fig. 11-66)."}, {"letter": "D", "text": "Jejunum has an average diameter of 4-4.5 cm.", "answer": "FALSE", "explanation": "The normal diameter of jejunum is 3-3.5 cm. Ileum is smaller with an average diameter of 2.5 cm or less. Reference H, p. 844."}, {"letter": "E", "text": "The left lobe of the liver may produce a soft-tissue shadow in the stomach.", "answer": "TRUE", "explanation": "It may mimic a gastric tumour. Reference X, p. 782 (Fig. 11-62)."}]}, {"qid": "28", "stem": "In the large intestine:", "options": [{"letter": "A", "text": "The plicae semilunares consist of mucosa only.", "answer": "FALSE", "explanation": "They consist of submucosa and mucosa. This differs from the valvulae conniventes of the duodenum and jejunum, which consist of mucosa only. Reference H, p. 855."}, {"letter": "B", "text": "The absence of haustral pattern in the descending colon signifies a diseased colon.", "answer": "FALSE", "explanation": "Although this is an associated feature of ulcerative colitis, it is not infrequently seen in the normal person. Reference H, p. 855."}, {"letter": "C", "text": "A spiculated appearance in the wall of the sigmoid colon may be due to the normal filling of the mucosal glands of Lieberkühn.", "answer": "TRUE", "explanation": "An appearance which is not to be confused with ulcerative colitis. Reference H, p. 860."}, {"letter": "D", "text": "The transverse mesocolon is attached to the pancreas.", "answer": "TRUE", "explanation": "The long mesentery of the transverse colon allows for great variability in its position. However, the first few centimetres are usually firmly attached to the duodenum and pancreatic head, so that enlargement of these structures may cause a secondary displacement of this part of the colon. Reference H, p. 849."}, {"letter": "E", "text": "The splenic flexure is highly variable in position.", "answer": "FALSE", "explanation": "It tends to hold a constant position because of its attachment to the diaphragm via the phrenicocolic ligament. Reference H, p. 849."}]}, {"qid": "29", "stem": "The rectum:", "options": [{"letter": "A", "text": "Begins anterior to the lumbosacral articulation.", "answer": "FALSE", "explanation": "It begins in front of the third sacral segment. Reference G, p. 157."}, {"letter": "B", "text": "Is related posteriorly to the median sacral artery.", "answer": "TRUE", "explanation": "It is also related posteriorly to the lateral sacral vessels, the 3rd, 4th and 5th sacral nerves, the sympathetic trunk and the superior rectal artery. Reference G, p. 157."}, {"letter": "C", "text": "Usually has 3-5 crescentic folds known as the valves of Houston.", "answer": "TRUE", "explanation": "Also known as the plicae transversales, these folds are variable in position. They may be poorly developed or absent in an individual patient. Reference H, pp. 850-1."}, {"letter": "D", "text": "May be separated from the lowermost sacral segment by a presacral width of 2 cm in the normal patient with a barium-filled rectum.", "answer": "FALSE", "explanation": "When Crispin and Fry measured the presacral space at this level in 100 patients, they found a normal range of 0.2-1.6 cm. Over 1.5 cm was thought suspicious. Over 2 cm was thought definitely abnormal. Reference: British Journal of Radiology 36:319-22 (1963)."}, {"letter": "E", "text": "Is not related to peritoneum.", "answer": "FALSE", "explanation": "The upper third is covered by peritoneum on its front and sides. The middle third is related to peritoneum on its front only. The pouch of peritoneum so formed is the rectovesical in the male and the recto-uterine in the female. Reference G, p. 157."}]}, {"qid": "30", "stem": "The portal vein:", "options": [{"letter": "A", "text": "Is usually formed by the union of inferior mesenteric and splenic veins.", "answer": "FALSE", "explanation": "It begins at the union of superior mesenteric and splenic veins. Reference G, p. 125."}, {"letter": "B", "text": "Lies posterior to the common hepatic artery.", "answer": "TRUE", "explanation": "Anterior to the portal vein in the free edge of the lesser omentum lie the bile duct to the right and the hepatic artery to the left. Reference G, p. 125."}, {"letter": "C", "text": "Receives into its left branch the para-umbilical veins.", "answer": "TRUE", "explanation": "The para-umbilical veins are a route by which blood can bypass an obstructed intrahepatic portal system. Reference H, p. 884."}, {"letter": "D", "text": "Receives the right gastroepiploic vein.", "answer": "FALSE", "explanation": "This drains into the superior mesenteric vein before the formation of the portal vein. Reference H, p. 883."}, {"letter": "E", "text": "Receives the left gastric (coronary) vein.", "answer": "TRUE", "explanation": "The communication of the left gastric vein with the oesophageal veins and the azygos system provides a route of bypass of the intrahepatic portal system. Reference H, p. 884."}]}, {"qid": "31", "stem": "The common bile duct:", "options": [{"letter": "A", "text": "Lies posterior to the portal vein.", "answer": "FALSE", "explanation": "The vein lies posterior to the duct in the free edge of the lesser omentum. Reference G, p. 133."}, {"letter": "B", "text": "Is closely related to the superior mesenteric artery.", "answer": "FALSE", "explanation": "The duct lies along the left margin of the second part of the duodenum. The artery lies further to the left. Reference H, p. 795 (Fig. 13-35B)."}, {"letter": "C", "text": "Is related to the left hepatic vein.", "answer": "FALSE", "explanation": "The hepatic veins are entirely intrahepatic and do not parallel the course of the bile duct within the liver. Reference H, p. 883."}, {"letter": "D", "text": "Lies to the right of the gastroduodenal artery.", "answer": "TRUE", "explanation": "Reference G, p. 133."}, {"letter": "E", "text": "May normally produce a smooth indentation in the barium-filled duodenal cap.", "answer": "TRUE", "explanation": "The bile duct lies posteriorly so that this effect will occur in the supine position. Reference X, p. 799 (Fig. 11-98)."}]}, {"qid": "32", "stem": "The pancreas:", "options": [{"letter": "A", "text": "Originates from a ventral and a dorsal bud.", "answer": "TRUE", "explanation": "The ventral bud arises in common with the liver. The dorsal bud arises proximal to it. The major duct is derived from both elements, whereas the minor duct derives from the dorsal bud only. Reference G, p. 137."}, {"letter": "B", "text": "Is retroperitoneal.", "answer": "TRUE", "explanation": "Reference G, p. 104 (Fig. 9.4A)."}, {"letter": "C", "text": "Lies immediately anterior to the coeliac artery.", "answer": "FALSE", "explanation": "This is usually at a higher level than the pancreas. Reference G, p. 136."}, {"letter": "D", "text": "Normally has a main duct which measures between 5 and 6 mm in diameter.", "answer": "FALSE", "explanation": "This is too wide. The maximum diameter of the duct in the head of the normal gland is 3.9 mm. It narrows as it extends towards the tail. Reference H, pp. 830-1."}, {"letter": "E", "text": "Lies anterior to the portal vein.", "answer": "TRUE", "explanation": "The neck of the gland is related anteriorly. Reference G, p. 136."}]}, {"qid": "33", "stem": "The head of the pancreas:", "options": [{"letter": "A", "text": "Has an uncinate process which is crossed by the superior mesenteric artery.", "answer": "TRUE", "explanation": "So does the superior mesenteric vein. Reference H, p. 823."}, {"letter": "B", "text": "Receives its main blood supply from the left gastric artery.", "answer": "FALSE", "explanation": "It is supplied in a variable manner by branches of the splenic, gastroduodenal and pancreaticoduodenal arteries. Reference H, p. 825."}, {"letter": "C", "text": "Lies directly anterior to the right renal vein.", "answer": "TRUE", "explanation": "Reference G, p. 136."}, {"letter": "D", "text": "Lies anterior to the inferior vena cava.", "answer": "TRUE", "explanation": "Reference H, p. 823."}, {"letter": "E", "text": "Has a minor or accessory duct which opens into the duodenum 3 cm distal to the main duct.", "answer": "FALSE", "explanation": "It opens proximal to the main duct. Reference G, p. 136."}]}, {"qid": "34", "stem": "The right ureter:", "options": [{"letter": "A", "text": "Passes posterior to the right common iliac artery.", "answer": "FALSE", "explanation": "It passes anterior to the artery. Reference H, p. 1011."}, {"letter": "B", "text": "Is crossed anteriorly by the right colic and ileocolic arteries.", "answer": "TRUE", "explanation": "Reference H, p. 1011."}, {"letter": "C", "text": "Is related to the lateral aspect of psoas major.", "answer": "FALSE", "explanation": "It is embedded on the medial aspect of the muscle. Hypertrophy of the muscle in young males may displace the normal ureter medially and mimic retroperitoneal fibrosis. Reference X, p. 878 (Fig. 13-48); and p. 879 (Fig. 13-50)."}, {"letter": "D", "text": "Is related to the root of the sigmoid mesocolon.", "answer": "FALSE", "explanation": "This applies to the left ureter. Reference G, p. 141."}, {"letter": "E", "text": "Becomes intraperitoneal in the pelvis.", "answer": "FALSE", "explanation": "It is an extraperitoneal structure."}]}, {"qid": "35", "stem": "In the normal duodenum:", "options": [{"letter": "A", "text": "The major papilla opening into the second part may produce a filling defect.", "answer": "TRUE", "explanation": "It may be confused with a tumour. Reference H, p. 803 (Fig. 13-46)."}, {"letter": "B", "text": "The second part is suspended from the diaphragm by the ligament of Treitz.", "answer": "FALSE", "explanation": "This attaches the duodenojejunal flexure to the right crus of the diaphragm. Reference H, p. 794."}, {"letter": "C", "text": "The cap may be indented by the gall bladder.", "answer": "TRUE", "explanation": "This tends to occur in the prone position. Reference H, p. 792."}, {"letter": "D", "text": "The second part may be displaced medially by the right kidney.", "answer": "TRUE", "explanation": "Reference X, p. 801 (Fig. 11-101)."}, {"letter": "E", "text": "The fourth part ascends medial to the inferior mesenteric vein.", "answer": "TRUE", "explanation": "Reference G, p. 115."}]}, {"qid": "36", "stem": "The horizontal (third) part of the duodenum:", "options": [{"letter": "A", "text": "Lies anterior to the superior mesenteric vessels.", "answer": "FALSE", "explanation": "It lies posteriorly to the vessels; the pancreas lies anteriorly. This helps in identifying the pancreas at CT. Reference G, p. 115."}, {"letter": "B", "text": "Lies anterior to the right ureter.", "answer": "TRUE", "explanation": "Reference G, p. 115."}, {"letter": "C", "text": "Lies anterior to the inferior vena cava and aorta.", "answer": "TRUE", "explanation": "The gonadal arteries also lie posteriorly. Reference G, p. 115."}, {"letter": "D", "text": "Is an intraperitoneal structure.", "answer": "FALSE", "explanation": "It is retroperitoneal. It is crossed by the root of the small bowel mesentery. Reference H, p. 794."}, {"letter": "E", "text": "Has no circular mucosal folds (valvulae conniventes).", "answer": "FALSE", "explanation": "These begin in the second part of the duodenum and gradually become more prominent. They are distinctly seen from the duodenal papilla onwards. They usually project about 8 mm into the lumen. Reference H, p. 794."}]}, {"qid": "37", "stem": "Concerning the peritoneal reflections and spaces:", "options": [{"letter": "A", "text": "The right subhepatic space communicates directly with the right subphrenic space.", "answer": "TRUE", "explanation": "They communicate over the right lobe of the liver. The former space is also referred to as Morisson's pouch. Reference H, p. 948 (Fig. 15-31)."}, {"letter": "B", "text": "There is no communication between the right paracolic gutter and the right subhepatic space.", "answer": "FALSE", "explanation": "Hence an abscess may spread from the right upper abdomen to the pelvis and vice versa. Reference H, p. 946."}, {"letter": "C", "text": "The lesser sac communicates directly with the left infracolic space via the epiploic foramen.", "answer": "FALSE", "explanation": "The lesser sac, which may be thought of as part of the left subhepatic space, passes into the area of Morisson's pouch through the epiploic foramen. The left infracolic space results from the division of the inferior mesocolic space by the root of the mesentery of small bowel. Reference H, p. 948."}, {"letter": "D", "text": "The lesser sac is related posteriorly to the left kidney.", "answer": "TRUE", "explanation": "Reference H, p. 932."}, {"letter": "E", "text": "The lesser sac is related posteriorly to the right adrenal.", "answer": "FALSE", "explanation": "It is related to the left adrenal. It is also related posteriorly to the pancreas and diaphragm. Reference H, p. 932."}]}, {"qid": "38", "stem": "In the liver:", "options": [{"letter": "A", "text": "The ligamentum teres is the remnant of the umbilical artery.", "answer": "FALSE", "explanation": "It is the remnant of the obliterated umbilical vein. Reference G, p. 128."}, {"letter": "B", "text": "The falciform ligament separates the right and left subhepatic spaces.", "answer": "FALSE", "explanation": "It separates the subphrenic spaces. Reference G, p. 129."}, {"letter": "C", "text": "The caudate lobe is directly related to the first part of the duodenum.", "answer": "FALSE", "explanation": "The quadrate lobe is related to the first part of the duodenum. Reference G, p. 131."}, {"letter": "D", "text": "The quadrate lobe is separated from the caudate process by the inferior vena cava.", "answer": "FALSE", "explanation": "It is the porta hepatis which intervenes between them. Reference G, p. 128 (Fig. 11.1)."}, {"letter": "E", "text": "The lesser omentum is attached to the interlobar fissure.", "answer": "TRUE", "explanation": "Reference G, p. 129."}]}, {"qid": "39", "stem": "The epiploic foramen is bounded by:", "options": [{"letter": "A", "text": "The duodenum.", "answer": "TRUE", "explanation": "The first part. Reference G, p. 104."}, {"letter": "B", "text": "The aorta.", "answer": "FALSE", "explanation": "Reference G, p. 104 (Fig. 9.4B)."}, {"letter": "C", "text": "The caudate process of the liver.", "answer": "TRUE", "explanation": "Reference G, p. 131."}, {"letter": "D", "text": "The inferior vena cava.", "answer": "TRUE", "explanation": "Reference G, p. 104."}, {"letter": "E", "text": "The transverse mesocolon.", "answer": "FALSE", "explanation": "Reference G, p. 104 (Fig. 9.4A)."}]}, {"qid": "40", "stem": "The spleen:", "options": [{"letter": "A", "text": "May normally be identified on a plain abdominal film.", "answer": "TRUE", "explanation": "It forms a tongue-like shadow along the left upper lateral aspect of the stomach. Reference H, p. 986."}, {"letter": "B", "text": "Is invested in peritoneum.", "answer": "TRUE", "explanation": "Reference G, p. 134."}, {"letter": "C", "text": "Is related to the tail of the pancreas.", "answer": "TRUE", "explanation": "This lies in the lienorenal (phrenicosplenic) ligament. Reference G, p. 134."}, {"letter": "D", "text": "Lies on the phrenicocolic ligament.", "answer": "TRUE", "explanation": "This is one of three supporting ligaments. Reference H, p. 982."}, {"letter": "E", "text": "Receives its blood supply via the gastrosplenic ligament.", "answer": "FALSE", "explanation": "The splenic artery and vein run in the lienorenal ligament to the hilum of the spleen. Reference H, p. 982."}]}, {"qid": "41", "stem": "The anterior relations of the right kidney include:", "options": [{"letter": "A", "text": "The descending part of the duodenum.", "answer": "TRUE", "explanation": "Reference G, p. 138."}, {"letter": "B", "text": "The pylorus of the stomach.", "answer": "FALSE", "explanation": "The left kidney, but not the right, forms part of the stomach bed. Reference G, p. 112."}, {"letter": "C", "text": "The liver.", "answer": "TRUE", "explanation": "The visceral surface of the liver forms the major anterior relation of the right kidney. Reference G, p. 138."}, {"letter": "D", "text": "The superior mesenteric artery.", "answer": "FALSE", "explanation": "Reference G, p. 123."}, {"letter": "E", "text": "The hepatic flexure.", "answer": "TRUE", "explanation": "The lateral aspect of the lower pole is related to colon. Reference H, p. 1009 (Fig. 16-13C)."}]}, {"qid": "42", "stem": "The left kidney:", "options": [{"letter": "A", "text": "Usually lies lower than the right.", "answer": "FALSE", "explanation": "The right usually lies lower because of the presence of the liver. Reference G, p. 138."}, {"letter": "B", "text": "Is usually larger than the right.", "answer": "TRUE", "explanation": "However, the difference is normally less than 1 cm. Reference H, p. 998."}, {"letter": "C", "text": "Is related to the tail of the pancreas.", "answer": "TRUE", "explanation": "Reference G, p. 138."}, {"letter": "D", "text": "Is related anteriorly to jejunum.", "answer": "TRUE", "explanation": "Reference G, p. 138."}, {"letter": "E", "text": "Is drained by the main left renal vein which crosses the aorta above the origin of the superior mesenteric artery.", "answer": "FALSE", "explanation": "The vein usually passes anterior to the aorta below the level of the superior mesenteric artery. Reference H, p. 1006."}]}, {"qid": "43", "stem": "The urinary bladder:", "options": [{"letter": "A", "text": "Is supplied by the vesical branches of the external iliac artery.", "answer": "FALSE", "explanation": "The superior and inferior vesical arteries are branches of the internal iliac. Reference G, p. 161."}, {"letter": "B", "text": "Is attached to the umbilicus by the median umbilical ligament.", "answer": "TRUE", "explanation": "The ligament is attached to the bladder apex. Reference G, p. 160."}, {"letter": "C", "text": "Is related superiorly to the uterus in the female.", "answer": "TRUE", "explanation": "The uterus commonly makes an impression on the contrast-filled bladder in the normal patient. Reference G, p. 161."}, {"letter": "D", "text": "Is surrounded by fat.", "answer": "TRUE", "explanation": "This may permit the visualization of the bladder on a plain film and of the bladder wall when the bladder is contrast filled. Reference H, p. 1012."}, {"letter": "E", "text": "Has a ridge on its internal surface between the ureteric orifices.", "answer": "TRUE", "explanation": "The interureteric ridge marks the base of the triangular area of smooth mucous membrane known as the trigone. Reference H, p. 1014."}]}, {"qid": "44", "stem": "Concerning the uterus:", "options": [{"letter": "A", "text": "It is supplied solely by the uterine artery.", "answer": "FALSE", "explanation": "The uterine artery arises from the internal iliac and anastomoses with the ovarian artery, which arises from the aorta at the level of L3. Reference G, p. 163."}, {"letter": "B", "text": "Lymph drainage is partly to superficial inguinal nodes.", "answer": "TRUE", "explanation": "Via the round ligament. The principal route of drainage is to iliac nodes, however. Reference G, p. 163."}, {"letter": "C", "text": "It is supported and stabilized by the round ligament.", "answer": "FALSE", "explanation": "This is done by the parametrial ligaments (uterosacral, cardinal, and pubocervical). The round ligaments help to maintain anteversion. Reference G, p. 163."}, {"letter": "D", "text": "The vaginal fornix lies between the cervix lying medially and the ureters lying laterally.", "answer": "TRUE", "explanation": "Reference G, p. 163."}, {"letter": "E", "text": "Peritoneum is reflected from it to form the round ligament.", "answer": "FALSE", "explanation": "It forms the broad ligament. The round ligament is derived from the gubernaculum. Reference G, p. 162."}]}]}, {"title": "Section 3 · Larynx, Neck & Thyroid", "questions": [{"qid": "45", "stem": "In the larynx:", "options": [{"letter": "A", "text": "The rima glottidis is the area between the vestibular folds.", "answer": "FALSE", "explanation": "It is the elongated slit-like opening between the vocal folds (true vocal cords). It is the narrowest part of the laryngeal cavity. Reference H, p. 587."}, {"letter": "B", "text": "There is a synovial joint between the arytenoid and cricoid cartilages.", "answer": "TRUE", "explanation": "Reference G, p. 340."}, {"letter": "C", "text": "The vocal ligaments are attached to the thyroid cartilage.", "answer": "TRUE", "explanation": "The vocal ligament is the thickened free edge of the conus elasticus. Reference P1, p. 173."}, {"letter": "D", "text": "The hyaline cartilages tend to calcify.", "answer": "TRUE", "explanation": "The thyroid, cricoid and greater part of the arytenoid cartilages are hyaline, which tends to calcify. This calcification is frequently irregular, in which case the uncalcified areas should not be misinterpreted as areas of erosion. Also, they should not be confused with foreign bodies. This distinction may be made at barium swallow. Reference H, p. 584."}, {"letter": "E", "text": "The ventricle forms a part of the subglottic area.", "answer": "FALSE", "explanation": "The ventricle of the larynx (also known as the sinus) is formed by lateral outpouchings beneath the false cords. It is immediately above the vocal folds, and therefore supraglottic. Reference H, p. 587."}]}, {"qid": "46", "stem": "Relating to the larynx:", "options": [{"letter": "A", "text": "It has a high position in the neonate.", "answer": "TRUE", "explanation": "In a fetus of 6 months, the larynx is situated in a position two vertebrae higher than in an adult. It gradually descends as age increases. Reference H, p. 587."}, {"letter": "B", "text": "The epiglottis produces a central ovoid filling defect in a barium swallow in frontal projection.", "answer": "TRUE", "explanation": "Reference H, p. 587."}, {"letter": "C", "text": "It is related to the carotid sheath.", "answer": "TRUE", "explanation": "The sheath lies laterally. Reference G, p. 338."}, {"letter": "D", "text": "The vestibule lies between the false and the true cords.", "answer": "FALSE", "explanation": "The vestibule lies between the false cords (vestibular folds) inferiorly and the laryngeal aditus superiorly. Reference H, p. 586."}, {"letter": "E", "text": "It is developed from foregut.", "answer": "TRUE", "explanation": "It arises from the 6th pharyngeal arch on the walls of the primitive foregut. Reference G, p. 337."}]}, {"qid": "47", "stem": "The pyriform fossa:", "options": [{"letter": "A", "text": "Lies between the tongue and the epiglottis.", "answer": "FALSE", "explanation": "The valleculae are hollow pockets which lie to each side of the median plane between the dorsum of the tongue and the epiglottis. Reference H, p. 582."}, {"letter": "B", "text": "Is related medially to the arytenoid cartilage.", "answer": "TRUE", "explanation": "The fossa lies between the lamina of the thyroid cartilage laterally and the aryepiglottic fold medially. Reference G, p. 335."}, {"letter": "C", "text": "Is bounded partly by the thyrohyoid membrane.", "answer": "TRUE", "explanation": "The part of the fossa which lies above the lamina of the thyroid is so bounded. Reference P1, p. 169."}, {"letter": "D", "text": "Is innervated by the recurrent laryngeal nerve.", "answer": "FALSE", "explanation": "It is innervated by the internal branch of the superior laryngeal nerve. Reference P1, p. 177."}, {"letter": "E", "text": "Communicates with the ventricle of the larynx.", "answer": "FALSE", "explanation": ""}]}, {"qid": "48", "stem": "The thyroid gland:", "options": [{"letter": "A", "text": "Derives its blood supply from the internal carotid artery.", "answer": "FALSE", "explanation": "The internal carotid artery has no branches in the neck. The gland is supplied by the superior and inferior thyroid arteries which are branches of the external carotid and thyrocervical arteries respectively. Reference G, p. 362."}, {"letter": "B", "text": "Has a single large vein draining into the internal jugular vein.", "answer": "FALSE", "explanation": "The venous drainage is via the superior and middle thyroid veins, which are tributaries of the internal jugular, and via the inferior thyroid vein which drains into the left brachiocephalic vein. Reference G, p. 362."}, {"letter": "C", "text": "Is related to the sternohyoid muscle.", "answer": "TRUE", "explanation": "This is an anterior relation. Reference G, p. 362."}, {"letter": "D", "text": "Is closely related to the recurrent laryngeal nerve.", "answer": "TRUE", "explanation": "The nerve lies between the trachea and oesophagus and is a medial relation of the thyroid. Reference G, p. 362."}, {"letter": "E", "text": "Is enclosed in pretracheal fascia.", "answer": "TRUE", "explanation": "Reference G, p. 362."}]}, {"qid": "49", "stem": "In the neck:", "options": [{"letter": "A", "text": "The posterior atlanto-occipital membrane is the continuation of the posterior longitudinal ligament.", "answer": "FALSE", "explanation": "The posterior atlanto-occipital membrane is the continuation of the ligamentum flavum. The continuation of the posterior longitudinal ligament between the axis and the occipital bone is the membrana tectoria. Reference P3, pp. 141-2."}, {"letter": "B", "text": "The anterior atlanto-occipital membrane is the continuation of the anterior longitudinal ligament.", "answer": "TRUE", "explanation": "The anterior ligament is attached to the vertebral bodies and intervertebral discs. It tapers superiorly to be attached to the anterior tubercle of the atlas, and then continues to the base of the skull anterior to the foramen magnum as the anterior atlanto-occipital membrane. Reference P3, p. 141."}, {"letter": "C", "text": "The distance between the anterior margin of the dens and the posterior margin of the anterior arch of the atlas (the atlantodental interval) is usually about 1 mm.", "answer": "TRUE", "explanation": "The mean (±SD) value in adults is 0.93 ± 0.36 mm. Reference H, p. 537. The normal range may be considered to be 0.5-3 mm in adults."}, {"letter": "D", "text": "The atlantodental interval does not change with flexion in the normal patient.", "answer": "FALSE", "explanation": "Flexion tends to increase the interval. Reference H, p. 537."}, {"letter": "E", "text": "The atlanto-axial joints are the joints of Luschka.", "answer": "FALSE", "explanation": "The joints of Luschka are synovial joints between the posterolateral margins of the bodies of the lower five cervical vertebrae. Reference H, p. 511. They are seen on the PA view of the cervical spine. Reference H, p. 540 (Fig. 9-32)."}]}, {"qid": "50", "stem": "In the neck:", "options": [{"letter": "A", "text": "The retropharyngeal space at C2 normally measures 5-8 mm.", "answer": "FALSE", "explanation": "It should not normally measure more than 4.5 mm. Reference H, p. 588 (Fig. 10-7)."}, {"letter": "B", "text": "The spinous process of C7 is usually bifid.", "answer": "FALSE", "explanation": "However, the spinous processes of C2 to C6 tend to be bifid to some degree. Reference H, p. 534."}, {"letter": "C", "text": "The ligamentum nuchae is attached to the spinous processes and occipital bone.", "answer": "TRUE", "explanation": "Calcification of the ligament may be seen on a lateral radiograph of the neck, and may be mistaken for a fractured spinous process. Reference G, p. 361; Reference X, p. 214 (Fig. 3- 114)."}, {"letter": "D", "text": "A midline anastomosis may occur between the superior thyroid arteries.", "answer": "TRUE", "explanation": "Connecting the external carotid arteries. Reference H, p. 360 (Fig. 8-9)."}, {"letter": "E", "text": "Scalenus anterior lies anterior to the subclavian vein.", "answer": "FALSE", "explanation": "It lies posterior to the vein. Reference G, p. 361."}]}]}, {"title": "Section 4 · Skull, Face & Temporal Bone", "questions": [{"qid": "51", "stem": "In the skull of the neonate:", "options": [{"letter": "A", "text": "Overlapping of the bones of the vault is a sign of serious intracranial damage.", "answer": "FALSE", "explanation": "This is seen in a normal situation. Reference E, p. 1085."}, {"letter": "B", "text": "Inner and outer tables cannot be differentiated from each other.", "answer": "TRUE", "explanation": "Reference E, p. 1086."}, {"letter": "C", "text": "The spheno-occipital synchondrosis closes at 18 months.", "answer": "FALSE", "explanation": "This ordinarily closes by the 25th year. Reference H, p. 255."}, {"letter": "D", "text": "A 'J'-shaped pituitary is a normal variation.", "answer": "TRUE", "explanation": "This refers to a shallow anterior convexity in the sella which is thought to be an exaggeration of the normal slight impression due to the chiasmatic sulcus. Reference E, p. 1082."}, {"letter": "E", "text": "The metopic suture is best seen in the lateral projection.", "answer": "FALSE", "explanation": "The frontal bone is normally divided at birth by a midline suture, the frontal suture. It is normally obliterated by the fifth or sixth year of life. It is called the metopic suture when it persists into adulthood. It is seen on the PA view. Reference H, p. 256, p. 253 (Fig. 6-35)."}]}, {"qid": "52", "stem": "In the mandible:", "options": [{"letter": "A", "text": "The symphysis menti is ossified at birth.", "answer": "FALSE", "explanation": "It ossifies during the second year of life. Reference G, p. 301."}, {"letter": "B", "text": "The mental foramen opens opposite the second incisor.", "answer": "FALSE", "explanation": "It opens at the level of the interval between the premolar teeth. It may be mistaken for an apical abscess. Reference G, p. 301; Reference X, p. 153 (Fig. 2-72)."}, {"letter": "C", "text": "The mylohyoid groove (line) crosses perpendicular to the mandibular canal.", "answer": "FALSE", "explanation": "They run a parallel course. The mandibular canal transmits the inferior alveolar nerve and vessels. The canal is frequently visible on plain films of the mandible. Reference H, p. 220."}, {"letter": "D", "text": "The mental spine marks the attachment of geniohyoid.", "answer": "TRUE", "explanation": "Reference G, p. 326."}, {"letter": "E", "text": "The angle decreases from early adulthood to old age.", "answer": "FALSE", "explanation": "The angle increases in association with the changes in the alveolar margin resulting from the loss of teeth. It changes from about 110 degrees in the adult to about 140 degrees in the elderly. Reference G, p. 302."}]}, {"qid": "53", "stem": "The temporomandibular joint:", "options": [{"letter": "A", "text": "Is formed between the coronoid process of the mandible and the mandibular fossa.", "answer": "FALSE", "explanation": "It is formed with the condyle of the mandible. Reference G, p. 331."}, {"letter": "B", "text": "Has a single cavity.", "answer": "FALSE", "explanation": "It is completely divided into superior and inferior compartments by a fibrocartilaginous disc. Each compartment is synovium-lined. Reference G, p. 331."}, {"letter": "C", "text": "Is related to the parotid gland.", "answer": "TRUE", "explanation": "Reference G, p. 332."}, {"letter": "D", "text": "Is related medially to the sphenomandibular ligament.", "answer": "TRUE", "explanation": "This accessory ligament passes from the sphenoid spine to the lingula of the mandible. Reference G, p. 332."}, {"letter": "E", "text": "Is less stable with the mouth open because the condyle lies on the articular tubercle.", "answer": "TRUE", "explanation": "Reference G, p. 332."}]}, {"qid": "54", "stem": "The following structures lie in the medial wall of the (middle) ear:", "options": [{"letter": "A", "text": "The spur or scutum.", "answer": "FALSE", "explanation": "This refers to a bony projection which forms the superior attachment of the tympanic membrane. Reference H, p. 321."}, {"letter": "B", "text": "The chorda tympani.", "answer": "FALSE", "explanation": "It lies between the tympanic membrane and the handle of the malleus laterally and the incus medially. Reference G, p. 344."}, {"letter": "C", "text": "The promontary.", "answer": "TRUE", "explanation": "This is the central bulge in the medial wall caused by the first turn of the cochlea. Reference G, p. 344."}, {"letter": "D", "text": "The fenestra vestibuli (oval window).", "answer": "TRUE", "explanation": "Superiorly and posteriorly to the promontary. It is closed by the footplate of the stapes. Reference G, p. 344."}, {"letter": "E", "text": "The handle of the malleus.", "answer": "FALSE", "explanation": "Reference G, p. 344."}]}, {"qid": "55", "stem": "In the middle ear:", "options": [{"letter": "A", "text": "The arcuate eminence forms the roof.", "answer": "FALSE", "explanation": "The thin bony roof of the middle ear is formed by the tegmen tympani. The arcuate eminence lies more medially and encloses the superior semicircular canal. Reference H, p. 319."}, {"letter": "B", "text": "The stapedius muscle arises from the promontary.", "answer": "FALSE", "explanation": "It passes from the pyramid, a bony projection on the posterior wall. Reference G, p. 344."}, {"letter": "C", "text": "The fenestra vestibuli lies above the fenestra cochleae (round window).", "answer": "TRUE", "explanation": "Reference G, p. 344."}, {"letter": "D", "text": "The aditus is an opening in the superior part of the posterior wall which communicates with the mastoid antrum.", "answer": "TRUE", "explanation": "Reference G, p. 344."}, {"letter": "E", "text": "The head of the malleus is attached to the tympanic membrane.", "answer": "FALSE", "explanation": "The head of the malleus lies in the epitympanic recess; the handle is that part attached to the tympanic membrane. Reference G, p. 344."}]}, {"qid": "56", "stem": "The temporal bone:", "options": [{"letter": "A", "text": "Is entirely situated in the middle cranial fossa.", "answer": "FALSE", "explanation": "It forms part of the floor of the middle and posterior cranial fossae. Reference G, p. 304."}, {"letter": "B", "text": "Forms part of the foramen lacerum.", "answer": "TRUE", "explanation": "The foramen is situated at the junction of the petrous apex, the basilar occipital bone and the sphenoid. Reference H, p. 233."}, {"letter": "C", "text": "Has the falx cerebri attached to it.", "answer": "FALSE", "explanation": "The tentorium cerebelli is attached to the superior border of the petrous temporal bone. Reference G, p. 423."}, {"letter": "D", "text": "Transmits the facial nerve.", "answer": "TRUE", "explanation": "In the internal auditory canal and in a bony canal within the middle ear. The nerve leaves the bone via the stylomastoid foramen. Reference G, p. 354."}, {"letter": "E", "text": "Articulates with the zygomatic bone.", "answer": "TRUE", "explanation": "The zygomatic process of the temporal bone extends forward to contribute to the zygomatic arch. Reference G, p. 303."}]}, {"qid": "57", "stem": "The following structures pass through the parotid gland:", "options": [{"letter": "A", "text": "The retromandibular vein.", "answer": "TRUE", "explanation": "Formed behind the neck of the mandible by the joining of superficial temporal and maxillary veins, the retromandibular vein passes through the gland and divides below it into anterior and posterior divisions. Reference G, p. 371."}, {"letter": "B", "text": "The external carotid artery.", "answer": "TRUE", "explanation": "The artery lies deep within the gland. Reference G, p. 327."}, {"letter": "C", "text": "The internal carotid artery.", "answer": "FALSE", "explanation": "It passes medially to the gland. Reference G, p. 329 (Fig. 26-9)."}, {"letter": "D", "text": "The lingual nerve.", "answer": "FALSE", "explanation": "Reference G, p. 353."}, {"letter": "E", "text": "The facial nerve.", "answer": "TRUE", "explanation": "It divides within the gland. Reference G, p. 354."}]}, {"qid": "58", "stem": "In the nose:", "options": [{"letter": "A", "text": "The nasolacrimal duct opens into the inferior meatus.", "answer": "TRUE", "explanation": "Reference G, p. 317."}, {"letter": "B", "text": "The deep surface of the nasal bones is grooved by the anterior ethmoidal nerves.", "answer": "TRUE", "explanation": "And these may be seen on the lateral view of the nasal bones. Reference H, p. 288; and p. 291 (Fig. 7-4)."}, {"letter": "C", "text": "The maxillary sinus opens into the inferior meatus.", "answer": "FALSE", "explanation": "It opens into the middle meatus. Reference G, p. 318."}, {"letter": "D", "text": "The ethmoid air cells lie between the nose and orbit.", "answer": "TRUE", "explanation": "Reference G, p. 320."}, {"letter": "E", "text": "The frontal sinuses open into the superior meatus.", "answer": "FALSE", "explanation": "The frontal sinuses open into the middle meatus. Reference G, p. 318."}]}, {"qid": "59", "stem": "The ethmoid bone articulates with:", "options": [{"letter": "A", "text": "The nasal bone.", "answer": "FALSE", "explanation": "The nasal bone articulates superiorly with the frontal bone and laterally with the frontal process of the maxilla. Reference H, p. 219 (Fig. 6-5)."}, {"letter": "B", "text": "The palatine bone.", "answer": "TRUE", "explanation": "Reference H, p. 219 (Fig. 6-5)."}, {"letter": "C", "text": "The lacrimal bone.", "answer": "TRUE", "explanation": "Reference H, p. 219 (Fig. 6-5)."}, {"letter": "D", "text": "The maxilla.", "answer": "TRUE", "explanation": "Reference H, p. 219."}, {"letter": "E", "text": "The vomer.", "answer": "TRUE", "explanation": "Reference G, p. 306."}]}, {"qid": "60", "stem": "The ethmoid bone takes part in:", "options": [{"letter": "A", "text": "The septum of the nose.", "answer": "TRUE", "explanation": "The perpendicular plate of the ethmoid participates with the vomer in forming the bony part of the nasal septum. Reference H, p. 289."}, {"letter": "B", "text": "The hard palate.", "answer": "FALSE", "explanation": "This is formed by the palatine processes of the maxillae and the horizontal plates of the palatine bones. Reference H, p. 236 (Fig. 6-26)."}, {"letter": "C", "text": "The attachment of the falx cerebri.", "answer": "TRUE", "explanation": "The crista galli, which forms the anteroinferior attachment of the falx, is the upward extension of the perpendicular plate of the ethmoid bone. Reference G, p. 305."}, {"letter": "D", "text": "The medial wall of the orbit.", "answer": "TRUE", "explanation": "The medial wall of the orbit is formed, from posterior to anterior, by the body of the sphenoid, the orbital plate of the ethmoid, the lacrimal bone and the frontal process of the maxilla. In the orbit, the ethmoid articulates with the maxilla, forming part of the floor, and with the orbital process of the palatine bone. Reference H, p. 219 (Fig. 6-5)."}, {"letter": "E", "text": "The lateral wall of the nose.", "answer": "TRUE", "explanation": "The superior and middle conchae are part of the ethmoid bone and form part of the lateral wall of the nasal cavity. Reference H, p. 289."}]}, {"qid": "61", "stem": "The maxillary antra:", "options": [{"letter": "A", "text": "Are aerated at birth.", "answer": "FALSE", "explanation": "They are small and contain myxomatous tissue at birth. Reference H, p. 292."}, {"letter": "B", "text": "Extend into the zygomatic process of the maxilla.", "answer": "TRUE", "explanation": "Reference G, p. 320."}, {"letter": "C", "text": "May normally have a small fluid level in the erect position.", "answer": "FALSE", "explanation": "This is abnormal and may be seen in sinusitis. Reference H, p. 293."}, {"letter": "D", "text": "Have the molar and second premolar teeth usually embedded in the floor.", "answer": "TRUE", "explanation": "Reference H, p. 292."}, {"letter": "E", "text": "Are best demonstrated on plain radiographs by the PA projection with the base line parallel to the central ray.", "answer": "FALSE", "explanation": "The best projection is that of Water's which is an occipitomental with the base line at 45 degrees to the central ray. The submentovertical provides a supplementary view. Reference H, p. 294."}]}, {"qid": "62", "stem": "In the normal skull:", "options": [{"letter": "A", "text": "The frontal sinuses may extend into the orbital plate of the frontal bone.", "answer": "TRUE", "explanation": "In this situation, a fracture of the frontal bone may lead to air being introduced into the orbital soft tissues. Reference H, p. 294."}, {"letter": "B", "text": "The average basal angle is about 115 degrees.", "answer": "FALSE", "explanation": "The basal angle is that between a line drawn from the root of the nose to the planum sphenoidale and a line drawn along the slope of the clivus. Its average measurement is 137 degrees. Reference H, p. 243."}, {"letter": "C", "text": "Habenular calcification is seen posterior to the pineal.", "answer": "FALSE", "explanation": "It forms a C-shaped area of calcification anterior to the pineal on a lateral radiograph. Reference H, p. 245 (Fig. 6-32B)."}, {"letter": "D", "text": "Habenular calcification occurs in the habenular commissure.", "answer": "FALSE", "explanation": "It occurs in the choroid plexus of the third ventricle. It is separated from the pineal by the commissure. Reference H, p. 249."}, {"letter": "E", "text": "The impressions due to arachnoid granulations are most frequently seen in the squamous temporal bones.", "answer": "FALSE", "explanation": "They are most often seen in the parasagittal region adjoining the superior sagittal sinus. Reference H, p. 221."}]}, {"qid": "63", "stem": "The cavernous sinus is related to the:", "options": [{"letter": "A", "text": "Facial nerve.", "answer": "FALSE", "explanation": "The nerve has a complex path through the petrous temporal bone before leaving the skull through the stylomastoid foramen. It is not related to the sinus. Reference G, p. 354."}, {"letter": "B", "text": "Sphenoidal air sinus.", "answer": "TRUE", "explanation": "Reference H, p. 295."}, {"letter": "C", "text": "Diaphragma sella.", "answer": "TRUE", "explanation": "This is the fold of dura mater which covers the pituitary fossa. It is continuous with the roof of the cavernous sinus. Ref
