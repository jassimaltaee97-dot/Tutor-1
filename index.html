hey draw into the gut lumen (Reference S, p. 19). There may be a place for the low osmolal contrast media in the investigation of the neonatal gut. Reference: Ratcliffe, J. F. The use of ioxoglate in the paediatric gastrointestinal tract: a report of 25 cases. Clinical Radiology; 34:579–83 (1983)."}, {"letter": "B", "text": "In cases of suspected oesophagobronchial fistula.", "answer": "FALSE", "explanation": "It should not be used where there is a risk of it entering the bronchial tree and of causing pulmonary oedema. Reference S, p. 19."}, {"letter": "C", "text": "In perforation of the stomach or duodenum.", "answer": "TRUE", "explanation": "When plain films fail to show free gas. Reference S, p. 19."}, {"letter": "D", "text": "When demonstrating oesophageal varices.", "answer": "FALSE", "explanation": "The oesophagus should be in a relaxed state with a good coating of barium. Reference S, p. 15."}, {"letter": "E", "text": "When looking for an anastomotic leak in the colon.", "answer": "TRUE", "explanation": "Reference S, p. 47."}]}, {"qid": "T12", "stem": "In a double-contrast barium meal:", "options": [{"letter": "A", "text": "A low mA and high kVp should be used ideally.", "answer": "FALSE", "explanation": "The mA should be set as high as possible so as to reduce the exposure time and risk of movement blur. A low kVp is desirable to achieve maximum contrast. Reference I, p. 20."}, {"letter": "B", "text": "The visualization of the areae gastricae indicates good coating.", "answer": "TRUE", "explanation": "When there is good coating, the mucosal surface has a uniform greyness, and the mamillated surface of the stomach mucosa (the areae gastricae) can be seen. Reference I, p. 14."}, {"letter": "C", "text": "A phototimer should be positioned over the barium pool.", "answer": "FALSE", "explanation": "As it is the areas seen in double contrast that interest us, it is important to position the phototimer over such areas and not over the barium pool. Otherwise the film will be over-exposed. Reference N, 20.4, p. 672."}, {"letter": "D", "text": "Rugal folds on the posterior stomach wall appear as radiolucent defects in the supine position.", "answer": "TRUE", "explanation": "They form a linear defect in the barium puddle. Folds on the anterior wall form two thin white lines. The differing appearances permit separation of posterior and anterior wall lesions. Reference I, p. 23."}, {"letter": "E", "text": "Transverse folds are not seen in the normal oesophagus.", "answer": "FALSE", "explanation": "Delicate transverse folds are occasionally seen. They are usually mid-oesophageal in location and are believed to represent the contractions of the muscularis mucosae. Reference I, p. 81."}]}, {"qid": "T13", "stem": "In a barium meal:", "options": [{"letter": "A", "text": "The supine RAO/LPO position is used to show the lesser curve 'en face'.", "answer": "FALSE", "explanation": "The antrum is shown in double contrast by this position. The LAO/RPO position demonstrates the lesser curve en face. Reference I, p. 70 (Fig. 3-11)."}, {"letter": "B", "text": "A prominent longitudinal fold is present in the second part of the duodenum.", "answer": "TRUE", "explanation": "In 90% of individuals. Reference I, p. 339."}, {"letter": "C", "text": "Filling of the cap with barium occurs more reliably with glucagon than with hyoscine N-butyl bromide.", "answer": "FALSE", "explanation": "The opposite is true because one of the effects of Buscopan is relaxation of the pylorus. Reference S, p. 15."}, {"letter": "D", "text": "The oesophagus is seen in double contrast if barium is drunk whilst holding the nose.", "answer": "TRUE", "explanation": "Because the patient has to swallow air. Reference S, p. 15."}, {"letter": "E", "text": "Glucagon is considerably cheaper than hyoscine N-butyl bromide.", "answer": "FALSE", "explanation": "The opposite is true."}]}, {"qid": "T14", "stem": "In the barium infusion technique of examining the small bowel:", "options": [{"letter": "A", "text": "Patient preparation is unnecessary.", "answer": "FALSE", "explanation": "The patient should be fasted overnight. Reference S, p. 22."}, {"letter": "B", "text": "A Malström–Westerman tube is used.", "answer": "FALSE", "explanation": "A Bilbao–Dotter tube or modification is used. Reference S, p. 23."}, {"letter": "C", "text": "Passage of the tube through the pyloric sphincter is best performed with the patient lying on his right side.", "answer": "FALSE", "explanation": "It is better to have the patient lying on his left side. This is because the gastric antrum and duodenal cap fill with air in this position and facilitate the passage of the tube through the sphincter. Reference S, p. 23."}, {"letter": "D", "text": "A hydrometer is used to check that the relative density (specific gravity) of the barium suspension is 1.25–1.32.", "answer": "TRUE", "explanation": "The relative density is considered important. Reference S, p. 27."}, {"letter": "E", "text": "A rate of infusion of 75 ml per minute to a total volume of 1200 ml is suitable.", "answer": "TRUE", "explanation": "Reference S, p. 27."}]}, {"qid": "T15", "stem": "The transit of barium through the small bowel during a follow-through examination is accelerated by:", "options": [{"letter": "A", "text": "Intravenous metoclopramide.", "answer": "TRUE", "explanation": "A significant difference has been shown in the stomach emptying time and in the transit time to the caecum. The trial was double-blind and placebo controlled. Reference: James, W. B. and Hume, R. Action of metoclopramide on gastric emptying and small bowel transit time. Gut; 9:203–5 (1968)."}, {"letter": "B", "text": "Oral metoclopramide.", "answer": "TRUE", "explanation": "In a study of 110 patients, which was not placebo controlled, 20 mg given immediately prior to meal and follow- through led to barium reaching the caecum in 75 minutes in all but 12 patients. Reference: Kreel, L. The use of oral metoclopramide in the barium meal and follow-through examination. British Journal of Radiology; 43:31–5 (1970)."}, {"letter": "C", "text": "Food residue in the ileo-caecal region.", "answer": "FALSE", "explanation": "This can delay transit considerably. A cathartic should be given prior to an examination of the small bowel. Reference S, p. 23."}, {"letter": "D", "text": "Barium that has been warmed to body temperature.", "answer": "FALSE", "explanation": "The motility of the small bowel may be increased by the administration of cold isotonic saline. Reference H, p. 864."}, {"letter": "E", "text": "Hyoscine N-butyl bromide.", "answer": "FALSE", "explanation": "An anticholinergic drug such as this will delay the transit of barium."}]}]}, {"title": "Section 4 · Venography and Interventional Access Techniques", "questions": [{"qid": "T16", "stem": "In adrenal venography:", "options": [{"letter": "A", "text": "The left adrenal vein is more difficult to catheterize than the right.", "answer": "FALSE", "explanation": "The right is the harder to catheterize. This is because it originates from the inferior vena cava and has a variable site. Reference K, p. 50."}, {"letter": "B", "text": "Venous sampling is an integral part of the procedure.", "answer": "TRUE", "explanation": "Adrenocortical hormone assays are important in the diagnosis of adrenal tumours. Reference S, p. 121."}, {"letter": "C", "text": "A loop is formed in the inferior vena cava when using a cobra end-hole catheter to cannulate the left adrenal vein.", "answer": "TRUE", "explanation": "The catheter is advanced along the left renal vein to its more peripheral tributaries. The loop is then formed in the vena cava by advancing the catheter against the resistance of its tip. The direction of the tip changes to point superiorly. Movements are then 'reversed', the tip of the catheter moving out of the renal vein when the catheter is advanced at the groin and vice versa. Reference K, p. 48."}, {"letter": "D", "text": "Approximately 8 ml of contrast are required for the right adrenal vein.", "answer": "FALSE", "explanation": "2 ml is needed for the right and about 8 ml for the left. Reference E, p. 811."}, {"letter": "E", "text": "A rapid injection is given to provoke hormone production.", "answer": "FALSE", "explanation": "The injection is given slowly after a test injection under fluoroscopic control. Rupture of the glands is a complication of rapid injection. Reference K, p. 47."}]}, {"qid": "T17", "stem": "Intraosseous phlebography:", "options": [{"letter": "A", "text": "Requires local anaesthesia.", "answer": "FALSE", "explanation": "It is a painful technique that requires general anaesthesia. Reference L, p. 42."}, {"letter": "B", "text": "Should be avoided in patients with unfused epiphyses.", "answer": "TRUE", "explanation": "Because inadvertent extravasation around the epiphysis may impair its subsequent growth. Reference L, p. 42."}, {"letter": "C", "text": "Should be performed with the patient prone to improve demonstration of the internal iliac vein.", "answer": "FALSE", "explanation": "This position gives a better display of the external and common iliac veins. The patient is placed supine to show the internal iliac vein fully. Reference L, p. 45."}, {"letter": "D", "text": "May cause a fat embolus.", "answer": "TRUE", "explanation": "In which case, the urine, blood and sputum should be examined for globules of fat. Reference L, p. 62."}, {"letter": "E", "text": "Is complicated by bone infarction in 5–10% of cases.", "answer": "FALSE", "explanation": "Lea Thomas has not encountered a case in over 1000 examinations. Reference L, p. 62."}]}, {"qid": "T18", "stem": "In angiography:", "options": [{"letter": "A", "text": "The axillary artery is more prone to spasm than the femoral artery.", "answer": "TRUE", "explanation": "Therefore, catheter manipulation and time of the procedure should be kept to a minimum when using the axillary artery. The femoral route is chosen where possible. Reference S, p. 102."}, {"letter": "B", "text": "The renal arteries are approached from the right axilla rather than the left.", "answer": "FALSE", "explanation": "The right side is used for the ascending aorta and selective studies in the head and neck. The left is used for the descending and abdominal aorta and its branches. Reference S, p. 103."}, {"letter": "C", "text": "Guide wires have a core of three inner wires.", "answer": "FALSE", "explanation": "They have two inner wires and an outer circular wire which binds them tightly. One of the inner wires tapers and terminates a few centimetres from the tip which allows for flexibility. Reference S, p. 99."}, {"letter": "D", "text": "Bonded heparin-coated catheters reduce the incidence of thrombus formation.", "answer": "TRUE", "explanation": "But they are not easily pre-shaped. Guide wires similarly coated also reduce the incidence of thrombotic complications. Reference S, p. 125."}, {"letter": "E", "text": "The puncture site for antegrade femoral studies is distal to that used for retrograde procedures.", "answer": "FALSE", "explanation": "Because the needle is directed towards the feet, the puncture site for an antegrade study should be proximal to that used for conventional retrograde angiograms. If the site of puncture is too distal, the deep or superficial femoral arteries may be entered. Reference K, p. 125."}]}, {"qid": "T19", "stem": "The following are appropriate injections of contrast:", "options": [{"letter": "A", "text": "50–100 ml ioxoglate 320 at 14 ml s⁻¹ for bilateral lower limb arteriography.", "answer": "TRUE", "explanation": "Reference S, p. 107 (Table 8.1)."}, {"letter": "B", "text": "25 ml iopamidol 300 for selective renal arteriography.", "answer": "FALSE", "explanation": "A smaller quantity such as 12 ml is suitable. Reference S, p. 112 (Table 8.3)."}, {"letter": "C", "text": "10 ml meglumine iothalamate 280 into a frontal vein for orbital venography.", "answer": "TRUE", "explanation": "Orbital venography has been largely superseded by computed tomography. Reference S, p. 299."}, {"letter": "D", "text": "50 ml ioxoglate 320 at 20 ml s⁻¹ for superior mesenteric arteriography.", "answer": "FALSE", "explanation": "This is too rapid. A more appropriate rate would be 8 ml s⁻¹. Reference S, p. 112 (Table 8.3)."}, {"letter": "E", "text": "10 ml sodium iothalamate 420 for common carotid arteriography.", "answer": "FALSE", "explanation": "This would be unsuitable because of its sodium content and its high iodine concentration. Meglumine iothalamate 280 may be used, but the new low-osmolal contrast media are the preferred agents. Reference S, p. 286."}]}, {"qid": "T20", "stem": "In translumbar aortography:", "options": [{"letter": "A", "text": "A systolic blood pressure greater than 200 mmHg is a contra-indication to the procedure.", "answer": "TRUE", "explanation": "Reference K, p. 17."}, {"letter": "B", "text": "An aortic aneurysm may be safely punctured.", "answer": "FALSE", "explanation": "This would be dangerous and is contra-indicated. Reference S, p. 105."}, {"letter": "C", "text": "The low approach is often easier than the high approach in patients with severe atheroma.", "answer": "FALSE", "explanation": "The low approach is often more difficult because the inferior part of the lumbar aorta tends to be more variable in site and because its lumen tends to be narrower and more likely to be atheromatous. Reference J, p. 215."}, {"letter": "D", "text": "A high puncture is made opposite the disc at L1/2.", "answer": "FALSE", "explanation": "The level of puncture is T12. The needle is introduced just below the 12th rib (about 2 cm) and 8–10 cm from the midline. Reference K, p. 18."}, {"letter": "E", "text": "Slight caudal angulation of the needle is employed.", "answer": "FALSE", "explanation": "The needle is introduced at right angles or with a cranial angulation. The latter is usual when a high puncture is performed. Reference S, p. 105."}]}, {"qid": "T21", "stem": "In translumbar aortography:", "options": [{"letter": "A", "text": "A test injection of a test dose may be omitted if there is free back-flow of blood.", "answer": "FALSE", "explanation": "It is a crucial part of the procedure and the single most important factor in making it safe. It allows a check to be made that the needle has not entered a branch artery and that it is well positioned in the lumen. Reference J, p. 217."}, {"letter": "B", "text": "Damage to the spinal cord is a complication of the procedure.", "answer": "TRUE", "explanation": "Rarely. Reference U, p. 66."}, {"letter": "C", "text": "Dissection is usually a minor complication.", "answer": "TRUE", "explanation": "Reference U, p. 64."}, {"letter": "D", "text": "A gradual advance of the needle once aortic pulsation is felt is important for the success of the puncture.", "answer": "FALSE", "explanation": "Once the pulsation can be felt, the operator should make short 2–3 mm stabbing thrusts. This will ensure puncture of one wall. If a gradual advance is made, then the nearer wall may be slowly compressed such that the needle will pass through both walls together. Reference J, p. 214."}, {"letter": "E", "text": "A sub-intimal injection of a test dose is usually painful.", "answer": "FALSE", "explanation": "It is usually painless. There will be a dense persistence of contrast at the end of the needle. Pain suggests that a periaortic injection has occurred, in which case the test film will show less-dense persistence of contrast spreading out into the soft tissues. Reference J, p. 217."}]}]}, {"title": "Section 5 · Cardiac and Pulmonary Angiography", "questions": [{"qid": "T22", "stem": "In cardiac angiography:", "options": [{"letter": "A", "text": "A J-guide may help catheter advancement where there is tortuosity of the iliac arteries.", "answer": "TRUE", "explanation": "Atherosclerotic disease predisposes to arterial dissection. A J-guide reduces this risk compared with a straight guide. The guide should be advanced gently and without the use of force when there is tactile recognition of a resistance to its progress. Reference S, p. 126."}, {"letter": "B", "text": "Hypotension may occur during the procedure.", "answer": "TRUE", "explanation": "There are a number of factors that may cause a fall in blood pressure. It should be recognized and, if possible, treated: it may precede cardiac arrest. Reference U, p. 91."}, {"letter": "C", "text": "Dissection of a coronary artery is rarely of clinical importance.", "answer": "FALSE", "explanation": "Urgent surgical intervention may be required (Reference S, p. 163). Dissection is an uncommon complication of coronary arteriography, but cardiac arrest usually ensues."}, {"letter": "D", "text": "Bradycardia does not usually require treatment.", "answer": "FALSE", "explanation": "It should be treated, for it may herald asystole. Reference U, p. 91."}, {"letter": "E", "text": "20 ml of contrast is a suitable injection for demonstrating the left coronary artery.", "answer": "FALSE", "explanation": "This is too large an amount. The quantity and speed of injection, usually 2–9 ml by hand, may be decided upon from the appearances of a test injection of 1–2 ml. Reference S, p. 160."}]}, {"qid": "T23", "stem": "In cardiac angiography:", "options": [{"letter": "A", "text": "The Sones technique includes the use of a catheter exchange sheath in the femoral artery.", "answer": "FALSE", "explanation": "It uses a single catheter, introduced from a cut-down on the brachial artery, for catheterization of the left ventricle and coronary arteries. Reference S, p. 159."}, {"letter": "B", "text": "A pigtail catheter is safest for a left ventricular angiogram.", "answer": "TRUE", "explanation": "Because of its flexibility and side holes, a pigtail catheter is less likely to recoil during an injection and become malpositioned in a small vessel or the wall of a cardiac chamber. Reference S, p. 148."}, {"letter": "C", "text": "A cine-film frequency of 15 frames per second is usually adequate for examination of the coronary arteries.", "answer": "FALSE", "explanation": "30–60 frames per second are required. Reference B, p. 223."}, {"letter": "D", "text": "Contrast injected into a coronary artery should rapidly disperse.", "answer": "TRUE", "explanation": "If it does not do so, then a partial occlusion of the coronary artery by the catheter may have occurred. The catheter should be withdrawn immediately. Reference S, p. 160."}, {"letter": "E", "text": "Perforation of an artery or cardiac chamber may occur.", "answer": "TRUE", "explanation": "This is more likely to occur with stiff and end-hole catheters. It may be recognized by a change in pressure or difficulty in withdrawing blood on aspiration. Reference S, p. 159."}]}, {"qid": "T24", "stem": "In pulmonary angiography:", "options": [{"letter": "A", "text": "A pigtail catheter is placed midway between the pulmonary valve and bifurcation.", "answer": "TRUE", "explanation": "Reference S, p. 155."}, {"letter": "B", "text": "30 ml of contrast is injected via a power injector over 3 seconds into the main artery.", "answer": "FALSE", "explanation": "45 ml in 1.5 seconds is an appropriate quantity and rate. Reference S, p. 155."}, {"letter": "C", "text": "AP and lateral films are required.", "answer": "FALSE", "explanation": "The lateral film is of no value because of superimposition. The AP view is sufficient, although an oblique view may be obtained if required. Reference S, p. 155."}, {"letter": "D", "text": "Balloon-occlusion catheters can be used to provide improved image quality.", "answer": "TRUE", "explanation": "They can be used in selected parts of the pulmonary arterial tree which are known to be abnormal from a previously performed perfusion scan. Reference: Bynum, L. J., et al. Radiographic techniques for balloon-occlusion pulmonary angiography. Radiology; 133:518–20 (1982)."}, {"letter": "E", "text": "Rupture of the right ventricular chordae tendinae can occur.", "answer": "TRUE", "explanation": "This occurs as the pigtail is withdrawn, and is avoided by using the guide to straighten out the end of the catheter. Reference S, p. 156."}]}, {"qid": "T25", "stem": "In inferior mesenteric angiography:", "options": [{"letter": "A", "text": "The artery arises from the left anterolateral aspect of the aorta.", "answer": "TRUE", "explanation": "Reference S, p. 118."}, {"letter": "B", "text": "The artery arises at L2.", "answer": "FALSE", "explanation": "It arises at L3. Reference S, p. 118."}, {"letter": "C", "text": "A sidewinder catheter should not be used.", "answer": "FALSE", "explanation": "It is commonly used. Its shape can be formed in the arch of the aorta before catheterization of the artery, and it should be straightened before removal at the end of procedure."}, {"letter": "D", "text": "Films are taken with the patient in the RPO position.", "answer": "FALSE", "explanation": "The patient should be in the LPO position to open out the artery."}, {"letter": "E", "text": "35 ml iopamidol at 14 ml s⁻¹ is a suitable injection.", "answer": "FALSE", "explanation": "25 ml at 8 ml s⁻¹ is appropriate. Reference S, p. 112 (Table 8.3)."}]}]}, {"title": "Section 6 · Splenoportography and the Biliary Tract", "questions": [{"qid": "T26", "stem": "In percutaneous splenoportography (PSP):", "options": [{"letter": "A", "text": "The puncture is made in the anterior axillary line if the spleen is impalpable.", "answer": "FALSE", "explanation": "The smaller the spleen, the more posteriorly is the puncture made. When the spleen is impalpable, the puncture is made in the posterior axillary line with slight cephalad and anterior angulation to the needle. Reference J, p. 268."}, {"letter": "B", "text": "The inferior mesenteric vein is seen in the normal examination.", "answer": "FALSE", "explanation": "Reference H, p. 918."}, {"letter": "C", "text": "The left gastric vein is better demonstrated than by the venous phase of a coeliac angiogram in the normal patient.", "answer": "FALSE", "explanation": "It is not normally seen at PSP. Reference S, p. 165."}, {"letter": "D", "text": "The normal pulp pressure is less than 20 mmHg.", "answer": "FALSE", "explanation": "It is normally less than 11 mmHg. Reference S, p. 169."}, {"letter": "E", "text": "Gelfoam is used to reduce bleeding.", "answer": "TRUE", "explanation": "And should be used routinely in patients at particular risk of bleeding. Reference S, p. 169."}]}, {"qid": "T27", "stem": "Oral cholecystographic contrast media:", "options": [{"letter": "A", "text": "Differ from water-soluble contrast media in that the carbon-5 position in the benzene ring is unsubstituted.", "answer": "TRUE", "explanation": "This causes them to be bound to plasma protein, reducing their glomerular filtration and leading to their preferential excretion by the liver. Reference S, p. 60."}, {"letter": "B", "text": "Are lipid soluble.", "answer": "TRUE", "explanation": "Iopanoic acid is the most lipid soluble of the oral cholecystographic media. Reference S, p. 60."}, {"letter": "C", "text": "Have peak concentrations in the bile ducts at 10–14 hours after administration.", "answer": "FALSE", "explanation": "As far as ipodate is concerned, the peak concentration in the ducts occurs at about 3 hours. Maximum levels in the gall bladder occur at 14–19 hours depending on the particular contrast medium. Reference S, p. 62."}, {"letter": "D", "text": "Do not usually undergo an enterohepatic circulation.", "answer": "FALSE", "explanation": "There is some deconjugation of the glucuronide and absorption in the ileum. Reference S, p. 62."}, {"letter": "E", "text": "Are removed from the blood by passive diffusion.", "answer": "FALSE", "explanation": "An active transport mechanism is used. It is rate limited. Reference S, p. 62."}]}, {"qid": "T28", "stem": "In oral cholecystography:", "options": [{"letter": "A", "text": "The contrast agents are uricosuric.", "answer": "TRUE", "explanation": "This may account for the occasional nephrotoxicity of the contrast agents. A good fluid intake should be encouraged and does not interfere with the activity of the media. Reference: Mudge, G. H. Uricosuric action of cholecystographic agents. New England Journal of Medicine; 284:929–33 (1971)."}, {"letter": "B", "text": "Smoking may interfere with opacification of the biliary tree.", "answer": "TRUE", "explanation": "It is advisable to ask patients not to smoke prior to the examination. Reference S, p. 63."}, {"letter": "C", "text": "The prone oblique view demonstrates the bladder neck.", "answer": "FALSE", "explanation": "It demonstrates the fundus. This, being the most anterior part of the gall bladder, is where the contrast collects in the prone position. The neck and body are best seen on the supine oblique (30 degrees left side raised) position. Reference J, p. 94."}, {"letter": "D", "text": "Screening is not helpful.", "answer": "FALSE", "explanation": "Screening is the most effective way of obtaining films in which the gall bladder is not obscured by overlying bowel gas. Reference J, p. 94."}, {"letter": "E", "text": "Renal excretion of contrast medium indicates hepatic disease.", "answer": "FALSE", "explanation": "There is a variable rate of renal excretion in the normal patient, e.g. 21–57% of ipodate is removed by the kidneys. Reference S, p. 62."}]}, {"qid": "T29", "stem": "In intravenous cholangiography:", "options": [{"letter": "A", "text": "Monomeric compounds are used.", "answer": "FALSE", "explanation": "The intravenous media have dimeric molecules with high aqueous solubility. Reference S, p. 69."}, {"letter": "B", "text": "Glucagon is contra-indicated.", "answer": "FALSE", "explanation": "There appears to be improved visualization of the biliary tree after injection of glucagon. Reference S, p. 71."}, {"letter": "C", "text": "Opacification of the biliary tree is unlikely when the serum bilirubin is over 68 µmol l⁻¹.", "answer": "TRUE", "explanation": "Reference S, p. 71."}, {"letter": "D", "text": "Contrast refluxing into the first part of the duodenum simulates an opacified gall bladder in post-cholecystectomy patients.", "answer": "TRUE", "explanation": "It may be misinterpreted as a gall bladder. Oral contrast will demonstrate the position of the duodenum in such cases. Reference J, p. 102."}, {"letter": "E", "text": "An erect film of the gall bladder is performed at 24 hours if there is stratification of bile on the first erect film.", "answer": "TRUE", "explanation": "The stratification or layering phenomenon is thought to be due to poor mixing of contrast laden new bile and old bile. Mixing will have occurred on the later film. Reference S, p. 73."}]}, {"qid": "T30", "stem": "In the radiological investigation of the biliary tree:", "options": [{"letter": "A", "text": "Oral cholecystographic contrast media give good results during acute cholecystitis.", "answer": "FALSE", "explanation": "The gall bladder frequently fails to opacify. This has been shown to be due to the action of bacteria which deconjugate the contrast and permit its reabsorption by the gall bladder itself. Reference S, p. 60."}, {"letter": "B", "text": "Ipodate leaves no radio-opaque residue in the gut.", "answer": "FALSE", "explanation": ""}, {"letter": "C", "text": "Up to 15 punctures are performed with a fine, flexible needle in percutaneous transhepatic cholangiography (PTC).", "answer": "FALSE", "explanation": "If the ducts are dilated, then the procedure is best abandoned on failure to enter a bile duct after four needle insertions. Reference S, p. 81."}, {"letter": "D", "text": "Erect films are useful in PTC.", "answer": "TRUE", "explanation": "They may give the best demonstration of the common bile duct of any films taken. Reference S, p. 81."}, {"letter": "E", "text": "Contrast containing 350 mg iodine per 100 ml is used at operative cholangiography.", "answer": "FALSE", "explanation": "The contrast preferred is one containing 150 mg per 100 ml (e.g. Hypaque 25%). Too high a concentration of iodine will obscure small stones. Reference S, p. 76."}]}, {"qid": "T31", "stem": "In the examination of the biliary tree:", "options": [{"letter": "A", "text": "It is abnormal for the intramural segment of the bile duct to appear as a gap on T-tube cholangiography.", "answer": "FALSE", "explanation": "The intramural segment normally has a narrow lumen or appears as a gap on a T-tube or operative cholangiography. It should not be interpreted as abnormal. Reference E, p. 788."}, {"letter": "B", "text": "Reflux of contrast along the pancreatic duct during T-tube cholangiography indicates ductal obstruction.", "answer": "FALSE", "explanation": "This is a common finding in the normal examination. Reference E, p. 788."}, {"letter": "C", "text": "15 ml of contrast should be injected before any films are exposed at operative cholangiography.", "answer": "FALSE", "explanation": "The first film should be taken after the injection of about 3 ml because the terminal portion of the bile duct may otherwise be obscured by contrast in the duodenum. A satisfactory sequence is to take films when 3, 5–8, and 12 ml have been injected. Reference S, p. 76."}, {"letter": "D", "text": "The upper limit for the diameter of the normal bile duct on radiographs is 14 mm.", "answer": "FALSE", "explanation": "The accepted normal range is 2–10 mm. Reference E, p. 787."}, {"letter": "E", "text": "Stasis of contrast on a post-operative intravenous cholangiogram indicates existing obstruction.", "answer": "TRUE", "explanation": "Distension and over-filling of the hepatic radicles also suggests obstruction. Reference E, p. 791."}]}, {"qid": "T32", "stem": "Endoscopic retrograde cholangiopancreatography (ERCP):", "options": [{"letter": "A", "text": "Is indicated in the investigation of pancreatic pseudocyst.", "answer": "FALSE", "explanation": "This is a contra-indication to the procedure. If discovered during the procedure, it should not be fully opacified. Antibiotics are given and surgical drainage within 24 hours considered. Reference S, p. 87 and p. 92."}, {"letter": "B", "text": "Is contra-indicated in the presence of thoracic aortic aneurysm.", "answer": "TRUE", "explanation": "Reference S, p. 87."}, {"letter": "C", "text": "Is hazardous in the presence of duodenal diverticula.", "answer": "FALSE", "explanation": "Although they may make endoscopy difficult."}, {"letter": "D", "text": "Requires 8–12 ml to fill the normal pancreatic duct.", "answer": "FALSE", "explanation": "2–5 ml are required. Reference S, p. 88."}, {"letter": "E", "text": "Has a risk of 1% of causing pancreatitis.", "answer": "TRUE", "explanation": "Reference S, p. 92."}]}, {"qid": "T33", "stem": "In the percutaneous extraction of retained biliary calculi:", "options": [{"letter": "A", "text": "The optimum time for the procedure is 2 weeks post-operation.", "answer": "FALSE", "explanation": "The T-tube is left for 4–6 weeks to allow a good fibrous tract to form before the procedure is attempted. Reference K, p. 120."}, {"letter": "B", "text": "The catheter is manipulated to a point distal to a stone in the common bile duct.", "answer": "TRUE", "explanation": "The extraction device can then be advanced to the catheter tip. The catheter is then withdrawn to permit capture of the stone. Reference K, p. 121."}, {"letter": "C", "text": "A Dormia basket is used to capture the stone.", "answer": "TRUE", "explanation": "It should not be advanced beyond the tip of the catheter because of the risk of ductal injury, including perforation. Reference K, p. 121."}, {"letter": "D", "text": "If a standard angiographic catheter is used the T-tube is removed prior to insertion of the guide wire.", "answer": "FALSE", "explanation": "The T-tube is removed after the guide wire is inserted. The catheter is then passed over the guide. Reference K, p. 122."}, {"letter": "E", "text": "Antibiotic cover is necessary.", "answer": "TRUE", "explanation": "A broad-spectrum antibiotic is given for 24 hours before, and for 2–3 days after, the procedure. Reference K, p. 121."}]}]}, {"title": "Section 7 · Arthrography of the Knee", "questions": [{"qid": "T34", "stem": "In arthrography of the knee:", "options": [{"letter": "A", "text": "The needle should be introduced superior to the patella.", "answer": "FALSE", "explanation": "The needle is introduced into the patello-femoral joint space, at a point 1 cm posterior to the mid-point of the patella. Either a lateral or medial approach can be used. Reference S, p. 307."}, {"letter": "B", "text": "The integrity of the cruciates is demonstrated in the AP projection.", "answer": "FALSE", "explanation": "This may be accomplished in the lateral view with the knee flexed at 60 degrees or more. A film should be taken with the tibia under stress from being drawn anteriorly. Reference S, p. 307."}, {"letter": "C", "text": "Ioxoglate is less rapidly absorbed than iothalamate.", "answer": "TRUE", "explanation": "Because, being a dimer, ioxoglate has a large molecule and a slower rate of absorption than monomeric compounds such as iothalamate. Ioxoglate is preferred when the procedure is prolonged. Reference S, p. 305."}, {"letter": "D", "text": "Adrenaline reduces synovial secretion.", "answer": "TRUE", "explanation": "0.3 ml of 1 in 1000 adrenaline may be added to the contrast. Reference S, p. 305."}, {"letter": "E", "text": "15–20 ml of positive contrast are usually required.", "answer": "FALSE", "explanation": "About 3 ml are injected. Reference S, p. 307."}]}, {"qid": "T35", "stem": "In arthrography of the knee:", "options": [{"letter": "A", "text": "There is no need to aspirate a joint effusion before injection of contrast.", "answer": "FALSE", "explanation": "It is important that an effusion be aspirated because it will dilute the contrast and also causes bubble formation. Reference S, p. 307."}, {"letter": "B", "text": "Double-contrast is the method of choice for demonstrating cartilage lesions.", "answer": "TRUE", "explanation": "Because the method leads to a thin layer of contrast over the cartilage being outlined by air within the joint. Single positive-contrast arthrography is best for determining whether ligaments, tendons or the joint capsule are ruptured. Reference K, p. 57."}, {"letter": "C", "text": "Double-contrast is the method of choice for evaluating radio-opaque loose bodies.", "answer": "FALSE", "explanation": "Negative-contrast is best in this situation because contrast will obscure the loose body. Negative-contrast arthrography gives poor film contrast and detail of internal joint structures. Reference K, p. 57."}, {"letter": "D", "text": "Intra-articular injection of contrast usually causes some pain.", "answer": "FALSE", "explanation": "The injection is painless. If the patient complains of pain, an extra-articular injection should be suspected — in which case, the contrast medium will remain around the needle tip. Reference K, p. 61."}, {"letter": "E", "text": "Some positive-contrast remains in the normal joint for up to 24 hours.", "answer": "FALSE", "explanation": "It is rapidly absorbed. Air, however, remains for 2–3 days. The patient should be warned that he will experience some discomfort during this time. Reference K, p. 61."}]}, {"qid": "36", "stem": "In hip arthrography:", "options": [{"letter": "A", "text": "Sedation or general anaesthesia is required in young children.", "answer": "TRUE", "explanation": "Reference S, p. 308."}, {"letter": "B", "text": "Fluoroscopy is used to assist needle placement.", "answer": "TRUE", "explanation": "Reference K, p. 78."}, {"letter": "C", "text": "The anterior (vertical) approach is favoured when there is a hip prosthesis.", "answer": "FALSE", "explanation": "An anterolateral approach is preferred because the prosthesis obscures the metallic needle. Reference K, p. 79."}, {"letter": "D", "text": "A small amount of contrast enters the narrow zone of lucency that surrounds the normal prosthesis.", "answer": "FALSE", "explanation": "This suggests that loosening of the prosthesis has occurred. Reference K, p. 78."}, {"letter": "E", "text": "Subtraction films should be obtained where there is a prosthesis.", "answer": "TRUE", "explanation": "Because of the difficulty in distinguishing contrast from the radio-opaque cement. Reference K, p. 79."}]}, {"qid": "37", "stem": "In hysterosalpingography:", "options": [{"letter": "A", "text": "Pethidine is suitable for premedication.", "answer": "FALSE", "explanation": "It stimulates smooth muscle. This may result in difficulty in filling the tubes. Reference S, p. 245."}, {"letter": "B", "text": "Urografin 370 is a suitable contrast.", "answer": "TRUE", "explanation": "Because of its high viscosity at room temperature. Reference S, p. 248."}, {"letter": "C", "text": "The procedure is abandoned if venous intravasation occurs.", "answer": "FALSE", "explanation": "The incidence of intravasation is 0.6–3.7%. It is of no significance. The cannula is repositioned and a successful examination usually obtained. Reference S, p. 249."}, {"letter": "D", "text": "The scar of previous caesarian section is demonstrated on frontal films.", "answer": "FALSE", "explanation": "A lateral view is required. The uterus is carrot shaped in this projection. Reference S, p. 248."}, {"letter": "E", "text": "Uterine malignancy is a contra-indication to the procedure.", "answer": "FALSE", "explanation": "It may be used to evaluate the extent of endometrial carcinoma. Dissemination of tumour cells by the technique is not known to occur. Reference S, p. 244."}]}, {"qid": "38", "stem": "In lymphography:", "options": [{"letter": "A", "text": "The thoracic duct cannot normally be demonstrated.", "answer": "FALSE", "explanation": "It will be opacified on films of the chest taken at the end of the procedure. Reference J, p. 286."}, {"letter": "B", "text": "The injection is made at a rate of about 15 ml per hour.", "answer": "FALSE", "explanation": "The maximum desirable rate is 10 ml per hour. Faster injection rates than this will cause extravasation. Reference J, p. 285."}, {"letter": "C", "text": "The injection is stopped if there is marked obstruction.", "answer": "TRUE", "explanation": "The injection should also be stopped on identifying a lymphatico-venous connection. Reference S, p. 187."}, {"letter": "D", "text": "A 24 gauge needle is used to cannulate the lymphatics.", "answer": "FALSE", "explanation": "27–30 gauge needles are used. Reference J, p. 280."}, {"letter": "E", "text": "Follow-up films add no diagnostic information in patients with malignant disease.", "answer": "FALSE", "explanation": "They are of great importance. The contrast remains in the nodes for up to a year or more in diagnostic amounts. This permits assessment of the effect of treatment and may give added information over the immediate and 24-hour films. Reference S, p. 189."}]}, {"qid": "39", "stem": "In lymphography:", "options": [{"letter": "A", "text": "Small veins may be mistaken for a lymphatic.", "answer": "TRUE", "explanation": "Because of this, it is advisable to take a radiograph of the calf at an early stage of the injection. Reference S, p. 186."}, {"letter": "B", "text": "The contrast medium should be seen as globules on a radiograph of the calf.", "answer": "FALSE", "explanation": "Globulation occurs when Lipiodol is injected intravenously. It has been described as the 'caviare sign'. Reference S, p. 186."}, {"letter": "C", "text": "Blood staining of the sputum in the week after injection usually indicates that a pulmonary oil embolus has occurred.", "answer": "FALSE", "explanation": "Slight blood staining of the sputum occurs in about one-fifth of patients between 3 and 10 days after injection. It is thought to result from the breakdown of the oily contrast into fatty acids in the lungs. Reference S, p. 190."}, {"letter": "D", "text": "Cerebral oil embolus is a rare but usually fatal complication.", "answer": "FALSE", "explanation": "In a series of 10000, two cases of cerebral oil emboli were recorded. Both patients recovered completely. Reference S, p. 190."}, {"letter": "E", "text": "24-hour films are taken to demonstrate the lymphatic vessels.", "answer": "FALSE", "explanation": "The lymphatic vessels are devoid of contrast at 24 hours. The films at this time show the nodes. Reference S, p. 188."}]}, {"qid": "40", "stem": "In lymphography:", "options": [{"letter": "A", "text": "The procedure may be performed if the patient is receiving a course of radiotherapy to the chest.", "answer": "FALSE", "explanation": "It is unsafe in this situation because of the risk of cerebral oil embolus. Reference J, p. 279."}, {"letter": "B", "text": "Severe emphysema is a contra-indication to the procedure.", "answer": "TRUE", "explanation": "Because there is depression of lung function after the injection of contrast as the oil is filtered by the pulmonary capillaries. Reference S, p. 183."}, {"letter": "C", "text": "The injection is stopped when the cisterna chyli is seen.", "answer": "FALSE", "explanation": "The injection is stopped when the contrast medium has reached the level of L4. Reference S, p. 188."}, {"letter": "D", "text": "Ideally, 20 ml Lipiodol is used in each leg.", "answer": "FALSE", "explanation": "A maximum of 8 ml is used per side. Reference S, p. 188."}, {"letter": "E", "text": "The internal iliac nodes are usually demonstrated.", "answer": "FALSE", "explanation": "These nodes receive lymph from pelvic structures, but not the lower limbs."}]}, {"qid": "41", "stem": "In the normal pedal lymphangiogram:", "options": [{"letter": "A", "text": "The cisterna chyli is usually demonstrated as a distinct sac at the level of L2.", "answer": "FALSE", "explanation": "It is intermittently demonstrated and then is usually seen as a plexus of vessels. Reference: Jackson, B. T. and Kinmonth, J. B. The normal lymphographic appearances of the lumbar lymphatics. Clinical Radiology; 25:175-86 (1974)."}, {"letter": "B", "text": "The left chain of lumbar lymph nodes usually extends higher than the right.", "answer": "TRUE", "explanation": "In 51% of cases it extends to a higher vertebral level than the right or the mid chain. The right reaches a higher level in 17% of cases. Reference: Clinical Radiology; 25:175-86 (1974)."}, {"letter": "C", "text": "Lymphatics do not cross between the lumbar trunks.", "answer": "FALSE", "explanation": "Cross-over occurs in 45% of lymphangiograms. Cross-over from right to left occurs twice as commonly as in the reverse direction, which presumably accounts for the finding of metastases from right gonadal tumours in the left lumbar nodes in a significant number of patients. Reference: Jackson, B. T. and Kinmonth, J. B. Lumbar lymphatic crossover. Clinical Radiology; 25:187-93 (1974)."}, {"letter": "D", "text": "A gap in the lumbar lymph trunk on the right is abnormal.", "answer": "FALSE", "explanation": "It is associated with a right lower lumbar bypass vessel, usually at the L3/4 level. In contrast, the left lumbar chain is always continuous. Reference: Clinical Radiology; 25:187-93 (1974)."}, {"letter": "E", "text": "The lumbar nodes may normally extend laterally beyond the tips of the transverse processes.", "answer": "FALSE", "explanation": "If they do, then they are displaced. Reference: Clinical Radiology; 25:187-93 (1974)."}]}, {"qid": "42", "stem": "Hepatic oil embolism following lymphography:", "options": [{"letter": "A", "text": "Occurs as a result of lymphaticoportal anastomoses.", "answer": "TRUE", "explanation": "Reference: Silverstone, E. J., et al. The CT appearances of hepatic oil embolism following lymphography. British Journal of Radiology; 57:779-83 (1984)."}, {"letter": "B", "text": "May occur when the nodes are normal.", "answer": "FALSE", "explanation": "The nodes must be diseased, because the lymphaticovenous connections do not open up unless there is obstruction to the lymphatics. Reference: British Journal of Radiology; 57:779-83 (1984)."}, {"letter": "C", "text": "May appear as irregular streaks of increased attenuation on CT.", "answer": "TRUE", "explanation": "This should not be confused with metastatic disease. The presence of lymphatic opacification or, rarely, free intraperitoneal contrast will suggest the correct diagnosis. Reference: British Journal of Radiology; 57:779-83 (1984)."}, {"letter": "D", "text": "Causes a permanent change in the radiological appearance of the liver parenchyma.", "answer": "FALSE", "explanation": "The oil disperses. Reference: British Journal of Radiology; 57:779-83 (1984)."}, {"letter": "E", "text": "Tends to occur in the left lobe with sparing of the right lobe.", "answer": "FALSE", "explanation": "The left lobe is spared. This may be due to the heavy oil gravitating to the more inferiorly placed right portal vein. Reference: British Journal of Radiology; 57:779-83 (1984)."}]}, {"qid": "43", "stem": "In sialography:", "options": [{"letter": "A", "text": "The parotid duct opens opposite the upper canine.", "answer": "FALSE", "explanation": "It opens opposite the second upper molar. Reference S, p. 5."}, {"letter": "B", "text": "The duct of the parotid gland is approximately 6 cm in length.", "answer": "TRUE", "explanation": "Reference H, p. 766."}, {"letter": "C", "text": "The injection may be made via gravity and a reservoir of contrast some 70 cm above the patient's head.", "answer": "TRUE", "explanation": "The secreting pressure of the gland lies between 54 and 76 cm of water; hence, the reservoir has to be elevated to a height of about 70 cm in order to exceed this. Reference S, p. 8."}, {"letter": "D", "text": "The success of the procedure in examining the parotid depends on the rapid injection of 2–3 ml of contrast.", "answer": "FALSE", "explanation": "The injection should be made very slowly. In the healthy gland, 0.5–0.75 ml of contrast is often adequate. Too fast an injection causes pain. The maximum amount that should be injected is 2 ml at one time. Reference S, p. 6."}, {"letter": "E", "text": "The sublingual ducts may open into the submaxillary duct.", "answer": "TRUE", "explanation": "So that they may injected in error. Reference H, p. 766."}]}, {"qid": "44", "stem": "In the investigation of facial structures:", "options": [{"letter": "A", "text": "The inferior canaliculus of the lacrimal system has a vertical and a horizontal component.", "answer": "TRUE", "explanation": "The vertical component is about 2 mm long, whilst the horizontal part is 7 mm or so in length. Reference J, p. 120."}, {"letter": "B", "text": "Ioxaglate is preferred for dacrocystography.", "answer": "FALSE", "explanation": "Lipiodol is the contrast of choice. About 2 ml is injected. Reference S, p. 301."}, {"letter": "C", "text": "99mTc-labelled DTPA is used for the technique of lacrimal scintillography.", "answer": "FALSE", "explanation": "Tc-labelled sulphur colloid is used. Reference Z2, p. 115."}, {"letter": "D", "text": "Delayed films are obtained in sialography.", "answer": "TRUE", "explanation": "To assess the clearing of contrast from the gland, films are exposed after a sialogogue (e.g. a slice of lemon) has been sucked by the patient. Reference S, p. 8."}, {"letter": "E", "text": "The cannula may be removed from the parotid duct before exposing films when using water-soluble contrast.", "answer": "FALSE", "explanation": "Water-soluble contrast is used by some radiologists. It must have a high iodine concentration. Because of its relatively low viscosity, the cannula must be left in the duct when taking films, or significant leaking of contrast out of the duct will occur. Reference S, p. 6."}]}, {"qid": "45", "stem": "In bronchography:", "options": [{"letter": "A", "text": "Propyliodone is the contrast of choice.", "answer": "TRUE", "explanation": "Propyliodone (Dionosil) is available either as a suspension in arachis oil or as an aqueous suspension. The latter gives better coating of the bronchial mucosa and may also be diluted. Reference S, p. 202."}, {"letter": "B", "text": "1 ml of contrast per year of age per side is required in children of normal size. 17 68", "answer": "TRUE", "explanation": "With an additional 1–3 ml if there is plain film evidence of bronchiectasis. Reference J, p. 147."}, {"letter": "C", "text": "Premedication is unnecessary.", "answer": "FALSE", "explanation": "It is an unpleasant procedure which requires both a sedative and an agent for reducing bronchial secretions. Reference S, p. 202."}, {"letter": "D", "text": "The use of lignocaine is hazardous only when it is given in doses of 800 mg or more.", "answer": "FALSE", "explanation": "Convulsions and cardiorespiratory problems occur when 200 mg or more is given. Reference S, p. 202."}, {"letter": "E", "text": "Some contrast may be detected in the bronchi for up to 3 weeks.", "answer": "FALSE", "explanation": "It is usually entirely expectorated within 2 days. Reference S, p. 203. Radiological Techniques and Radiography"}]}, {"qid": "46", "stem": "In bronchography:", "options": [{"letter": "A", "text": "Oily contrast is less irritant than aqueous contrast.", "answer": "TRUE", "explanation": "Reference J, p. 134."}, {"letter": "B", "text": "Aqueous contrast gives better filling of small bronchi than oily contrast.", "answer": "FALSE", "explanation": "Oily contrast gives better peripheral filling. Reference S, p. 202."}, {"letter": "C", "text": "Asthma is a contra-indication to the procedure.", "answer": "TRUE", "explanation": "Because the procedure may provoke an attack. Reference S, p. 202."}, {"letter": "D", "text": "The catheter is placed in the right main bronchus for examination of the right lung.", "answer": "FALSE", "explanation": "It is placed in the intermediate bronchus. Reference S, p. 204."}, {"letter": "E", "text": "Oily contrast is not used with a fibre-optic bronchoscope.", "answer": "TRUE", "explanation": "Because it cannot be removed from the bronchoscope."}]}, {"qid": "47", "stem": "In fluoroscopy of the chest:", "options": [{"letter": "A", "text": "The left leaf of the diaphragm usually moves more than the right.", "answer": "TRUE", "explanation": "Reference W, p. 435."}, {"letter": "B", "text": "Sniffing causes upward movement of the diaphragm.", "answer": "FALSE", "explanation": "The diaphragm normally moves downwards. An upward movement is paradoxical and may be seen in paralysis. Reference W, p. 435."}, {"letter": "C", "text": "The dependent leaf of the diaphragm has less mobility in the decubitus patient.", "answer": "FALSE", "explanation": "It has greater mobility and usually lies high in the chest. Reference W, p. 435."}, {"letter": "D", "text": "Vascular structures diminish in size during the Valsalva manoeuvre.", "answer": "TRUE", "explanation": "This may help to distinguish them from non-vascular structures such as enlarged nodes. Reference W, p. 7."}, {"letter": "E", "text": "Areas of calcification within the heart can be demonstrated.", "answer": "TRUE", "explanation": "And their exact site determined. Reference H, p. 720."}]}, {"qid": "48", "stem": "In tomography of the paranasal sinuses and orbits, the radiation dose to the eyes is reduced by:", "options": [{"letter": "A", "text": "Using rare-earth screens rather than calcium tungstate screens.", "answer": "TRUE", "explanation": "Reference: Eddlestone, B., et al. Eye dose measurements using conventional and rare earth screens during tomography of the paranasal sinuses. British Journal of Radiology; 50:266-70 (1977)."}, {"letter": "B", "text": "Use of the AP position.", "answer": "FALSE", "explanation": "A 98% reduction in dose to the eyes can be obtained by use of the PA position: e.g. for Agfa Gevaert MR 400 (blue-emitting rare earth) screens and Kodak RP 56 film, the dose measured was 400 and 8 mrad in the AP and PA positions, respectively. Reference: British Journal of Radiology; 50:266-70 (1977)."}, {"letter": "C", "text": "Correct selection of plane of tomographic cut.", "answer": "TRUE", "explanation": "By keeping the number of exposures to a minimum."}, {"letter": "D", "text": "The use, in practice, of eye shields.", "answer": "FALSE", "explanation": "Eye shields, although they halve the dose to the eyes in tomography of the middle ear, cause blurring of the image in the orbito-ethmoidal region. They are not, therefore, practicable. Reference: British Journal of Radiology; 50:266-70 (1977)."}, {"letter": "E", "text": "Hypocycloidal rather than linear movement.", "answer": "FALSE", "explanation": "In Eddlestone's study, the average dose for linear tomography was 26.4 mrad per cut, and for hypocycloidal, 33.5 mrad per cut. Reference: British Journal of Radiology; 50:266-70 (1977)."}]}, {"qid": "49", "stem": "Concerning the hips and pelvis:", "options": [{"letter": "A", "text": "The AP view of the hip is centred 2 cm below the midpoint of the inguinal ligament.", "answer": "TRUE", "explanation": "Reference R, p. 133, Figs 497-8. The inguinal ligament extends from the anterior superior iliac spine to the pubic tubercle."}, {"letter": "B", "text": "The angle of anteversion of the femoral neck on the femoral shaft is 15-20 degrees in adults.", "answer": "FALSE", "explanation": "It is normally about 8 degrees. Reference H, p. 134 (Table 5-1)."}, {"letter": "C", "text": "In the 'von Rosen' position the legs are abducted 25 degrees from the midline.", "answer": "FALSE", "explanation": "This view is used for demonstrating congenital dislocation of the hip. In the normal pelvis, a line drawn through the femoral shaft will be directed to the upper edge of the bony acetabular wall. In congenital dislocation, the line of the femoral shaft will point to the anterior superior iliac spine. At least 45 degrees of abduction is essential if the view is not to give misleading results. Reference H, p. 145."}, {"letter": "D", "text": "In the 'von Rosen' position the legs are internally rotated.", "answer": "TRUE", "explanation": "Reference H, p. 145."}, {"letter": "E", "text": "The acetabular angle (the slope of the acetabulum to the horizontal) is normally about 40 degrees in a child of 6 months.", "answer": "FALSE", "explanation": "The angle is normally no more than 34 degrees in a child aged between 3 and 12 months. Before this age, the normal range is very wide. The angle is of use in assessing congenital dislocation of the hip. Reference H, p. 144."}]}, {"qid": "50", "stem": "In plain abdominal radiography:", "options": [{"letter": "A", "text": "A short exposure time is unnecessary.", "answer": "FALSE", "explanation": "A short exposure time is used so that movement blur does not affect the image. Ideally, it should not exceed 0.08 seconds. Reference S, p. 376."}, {"letter": "B", "text": "The lower border of the cassette should be positioned at the level of the symphysis pubis.", "answer": "FALSE", "explanation": "The cassette should be placed below the symphysis pubis, because otherwise the obliquity of the rays will project the pubis off the film. Reference S, p. 376."}, {"letter": "C", "text": "The erect abdominal film is more likely to show free subdiaphragmatic air than an erect chest film.", "answer": "FALSE", "explanation": "Because of the lower exposure used, and because the centring point is more favourable, the chest radiograph is superior to the erect film of the abdomen in detecting free subdiaphragmatic air. Reference: Miller, R. E. and Nelson, S. W. The roentgenologic demonstration of tiny amounts of free intraperitoneal gas: experimental and clinical studies. Am. J. Roent; 112:574-85 (1971)."}, {"letter": "D", "text": "As little as 1 ml of free intraperitoneal air may be demonstrated.", "answer": "TRUE", "explanation": "Miller and Nelson showed that this was possible. The best method for showing free gas is to lie the patient in the left lateral decubitus position for at least 10 minutes prior to performing an erect film of the chest. Reference: Am. J. Roent; 112:574-85 (1971)."}, {"letter": "E", "text": "The injection of 50 ml of air via a nasogastric tube may assist in the diagnosis of a perforation.", "answer": "TRUE", "explanation": "Reference S, p. 11."}]}, {"qid": "51", "stem": "The following projections are appropriate:", "options": [{"letter": "A", "text": "A right posterior oblique 15-25 degrees for the demonstration of the left sacroiliac joint.", "answer": "TRUE", "explanation": "Reference R, p. 166."}, {"letter": "B", "text": "The AP oblique projection of the wrist for optimal demonstration of the pisiform.", "answer": "TRUE", "explanation": "The best view of the pisiform is obtained by this projection. Reference R, p. 15 (Fig. 50)."}, {"letter": "C", "text": "The left posterior oblique 25 degrees to demonstrate the right glenohumeral joint.", "answer": "FALSE", "explanation": "This position would be suitable for showing the left glenohumeral joint. Reference R, p. 63."}, {"letter": "D", "text": "The AP knee for optimal frontal demonstration of the patella.", "answer": "FALSE", "explanation": "It is best done PA so as to bring the patella close to the film and thereby to reduce magnification and geometric unsharpness (Reference H, p. 164). A short focus-to-film distance may be used to blur the femoral condyles. It is important to support the patient's thigh and ankle for comfort."}, {"letter": "E", "text": "A left posterior oblique 45 degrees for visualization of the left pars interarticularis.", "answer": "TRUE", "explanation": "The opposite side to the sacroiliac joint demonstrated. Reference H, p. 130."}]}, {"qid": "52", "stem": "In the radiography of the cervical spine:", "options": [{"letter": "A", "text": "No tube angulation is required in the AP view provided that the canthomeatal line (CML) is at 90 degrees to the film.", "answer": "FALSE", "explanation": "The CML is elevated above the horizontal so as to superimpose mandible and occiput and display as much of the cervical vertebrae as possible. The tube is angled 5-10 degrees cephalad. Reference R, p. 182."}, {"letter": "B", "text": "The intervertebral foramina nearer the film are seen in the AP oblique projection.", "answer": "FALSE", "explanation": "The foramina nearer the tube are seen (Reference R, p. 188). Whether performed AP or PA, the foramina demonstrated are those away from the side to which the patient is looking."}, {"letter": "C", "text": "Tomography is often essential when there is an injury to the axis.", "answer": "TRUE", "explanation": "When there is a fracture of the dens and there is difficulty in positioning the head so that there is no superimposition of other structures, tomography will usually provide a clear view of the area. Reference R, p. 181."}, {"letter": "D", "text": "The AP view is done first in the injured, stretchered patient.", "answer": "FALSE", "explanation": "The lateral projection is performed first using a horizontal beam. It is viewed before going onto the AP projection. Reference R, p. 186."}, {"letter": "E", "text": "A long focus-to-film distance is required for the lateral projection.", "answer": "TRUE", "explanation": "The long object-to-film distance tends to cause a loss of definition, especially if a broad focus is used. A long focus-to-film distance is employed to reduce magnification and loss of definition. Reference R, p. 184."}]}, {"qid": "53", "stem": "Patient movement during an exposure may be usefully employed in:", "options": [{"letter": "A", "text": "The AP view of the lumbar spine.", "answer": "TRUE", "explanation": "A long exposure in this situation may help to blur out the unwanted image of bowel gas. Reference R, p. 204."}, {"letter": "B", "text": "The PA view of the scapula.", "answer": "TRUE", "explanation": "The shadows of the ribs are blurred when the patient breathes gently and smoothly during a long exposure of about 5 seconds. Reference R, p. 64."}, {"letter": "C", "text": "The lateral oblique view of the temporomandibular joints.", "answer": "FALSE", "explanation": "Views are taken with the mouth open and closed. Reference R, p. 322."}, {"letter": "D", "text": "The AP view of the cervical spine.", "answer": "TRUE", "explanation": "The mandible may be blurred out usefully by the patient opening and closing his mouth during a prolonged exposure. All the cervical vertebrae can then be seen on a single exposure. Reference R, p. 184."}, {"letter": "E", "text": "The prone oblique view of the sternum.", "answer": "TRUE", "explanation": "The rib shadows are blurred out (Reference R, p. 237). The lateral view of the dorsal spine also makes use of patient movement during an exposure."}]}, {"qid": "54", "stem": "The lordotic AP projection of the chest is useful in evaluating:", "options": [{"letter": "A", "text": "An apical lesion.", "answer": "TRUE", "explanation": "The projection may help when the apices of the lung are obscured on the standard PA film by ribs or clavicle. Reference E, p. 235."}, {"letter": "B", "text": "The middle lobe.", "answer": "TRUE", "explanation": "This is because the longest axis of the lobe takes up a position that is more in line with the X-ray. Reference E, p. 235."}, {"letter": "C", "text": "Pleural effusions.", "answer": "FALSE", "explanation": "A lateral decubitus film is useful for demonstrating effusions. Reference E, p. 236."}, {"letter": "D", "text": "Fluid in the oblique fissure.", "answer": "TRUE", "explanation": "The fissure is at less of an oblique angle to the X-ray in this projection. Reference E, p. 235."}, {"letter": "E", "text": "The carina.", "answer": "FALSE", "explanation": "An over-penetrated film or tomography are useful. Reference E, p. 236 and 238."}]}, {"qid": "55", "stem": "The following are features of the air-gap technique for radiography of the chest:", "options": [{"letter": "A", "text": "The dose of radiation to the skin is higher than with conventional radiography.", "answer": "FALSE", "explanation": "It is lower because the X-ray beam used has a higher peak energy (120 kVp or more). Reference H, p. 650."}, {"letter": "B", "text": "Good definition of mediastinal structures.", "answer": "TRUE", "explanation": "Reference H, p. 650."}, {"letter": "C", "text": "Good definition of soft pulmonary shadows.", "answer": "FALSE", "explanation": "Reference H, p. 650."}, {"letter": "D", "text": "Wide exposure latitude.", "answer": "TRUE", "explanation": ""}, {"letter": "E", "text": "The use of selective filters.", "answer": "TRUE", "explanation": "These are necessary because of the wide range of density between mediastinum and lung. Reference Z3, p. 747."}]}, {"qid": "56", "stem": "In radiography of the chest:", "options": [{"letter": "A", "text": "A pleural effusion consisting of 5-10 ml of fluid can be seen in a lateral decubitus position.", "answer": "TRUE", "explanation": "This was shown by Moskowitz et al. when they took films of a corpse in the lateral decubitus position after they had injected the pleural cavity with small amounts of fluid. Reference: Moskowitz, H., et al. Roentgen visualization of minute pleural effusion: an experimental study to determine the minimum amount of pleural fluid visible on a radiograph. Radiology; 109:33-5 (1973)."}, {"letter": "B", "text": "Lower lobe disease is best seen in the lordotic projection.", "answer": "FALSE", "explanation": ""}, {"letter": "C", "text": "Only the posterior portion of the left hemidiaphragm is seen on the lateral projection.", "answer": "TRUE", "explanation": "This is one of the signs used to differentiate the leaves of the diaphragm on the lateral film. Reference N, 22.3 p. 617."}, {"letter": "D", "text": "The posterior wall of the bronchus intermedius can usually be seen on a lateral film.", "answer": "TRUE", "explanation": "It forms a radiodense strip 0.5-3.0 mm wide between the air in the bronchus and the lung in the azygo-oesophageal recess. It can be seen in most lateral films, and well in about 55%. It is always well demonstrated by CT. A varied number of pathological conditions can cause the strip to be thickened. Reference: Webb, W. R., et al. Posterior wall of the bronchus intermedius: radiographic-CT correlation. Am. J. Roent; 142:907-11 (1984)."}, {"letter": "E", "text": "Heart size does not usually increase by more than 1.5 cm in consecutive films.", "answer": "TRUE", "explanation": "Although in two 'normal' patients in a series of 100, the heart was 2 and 3 cm larger. Reference Z4."}]}, {"qid": "57", "stem": "In pelvimetry:", "options": [{"letter": "A", "text": "A kVp of 60-70 should be used.", "answer": "FALSE", "explanation": "A high kVp of 100-120 is used to limit the radiation dose. Reference Z5."}, {"letter": "B", "text": "The sagittal (AP) diameter of the inlet normally measures 10-10.5 cm.", "answer": "FALSE", "explanation": "The mean value is 11.6 cm. Contraction exists when the diameter is less than 10.5 cm. Reference Z5."}, {"letter": "C", "text": "The central beam is directed at the symphysis pubis in the AP view.", "answer": "FALSE", "explanation": "The centring point is 2 cm above the symphysis pubis. Reference Z5."}, {"letter": "D", "text": "The outlet diameter increases during late pregnancy.", "answer": "TRUE", "explanation": "Because of relaxation of the symphysis pubis and rotation of the sacroiliac joints. The measurement may increase by 1-1.75 cm. It is argued that pelvimetry should be performed at the onset of labour to take this into account. Reference Z5."}, {"letter": "E", "text": "The bispinous diameter is normally greater than 10 cm.", "answer": "TRUE", "explanation": "If it is less than 10 cm it indicates contraction. Reference Z5. Radiological Techniques and Radiography"}]}, {"qid": "58", "stem": "The following are absolutely or relatively contra-indicated:", "options": [{"letter": "A", "text": "Barium follow-through in suspected small-bowel obstruction.", "answer": "FALSE", "explanation": "The small intestine secretes fluid which dilutes the barium so that there is no realistic danger of impaction. Barium is advantageous to conventional water-soluble contrast because of its greater density and because it has fewer side effects. Reference S, p. 22."}, {"letter": "B", "text": "Intravenous cholangiography when oral cholecystography has failed 24 hours previously.", "answer": "TRUE", "explanation": "In this situation, there is a greater incidence of both major and minor reactions, and poor visualization of the ducts is more likely. Reference: Finby, N. and Blasberg, G. A note on the blocking of hepatic excretion during cholangiographic study. Gastroenterology; 46:276-7 (1964)."}, {"letter": "C", "text": "Hysterosalpingography performed in the mid-part of the menstrual cycle.", "answer": "FALSE", "explanation": "This is a good time to perform the examination because there is less likelihood of cornual spasm or intravasation of contrast. Reference S, p. 245."}, {"letter": "D", "text": "Percutaneous transhepatic cholangiography in a patient with cholestatic jaundice.", "answer": "FALSE", "explanation": "This procedure is used to make the distinction between a cholestatic jaundice and an extrahepatic obstruction. Reference S, p. 80."}, {"letter": "E", "text": "Pulmonary angiography when the end-diastolic pulmonary pressures are greater than 20 mm Hg.", "answer": "TRUE", "explanation": "There were three deaths in a series of 1350 pulmonary angiograms. These patients all had raised end-diastolic pulmonary pressures (over 20 mm Hg). The deaths occurred 1-2 hours after the injection of contrast. Although catheterization had been uneventful, the injection of contrast had resulted in a drop in the systemic arterial pressure and eventually death in all three patients. Reference: Mills, S. R., et al. The incidence, etiologies and avoidance of complications of pulmonary angiography in a large series. Radiology; 136:295-9 (1980)."}]}, {"qid": "59", "stem": "In abdominal ultrasound:", "options": [{"letter": "A", "text": "The intrahepatic branches of the hepatic artery are not generally seen.", "answer": "TRUE", "explanation": "Reference E, p. 1350."}, {"letter": "B", "text": "Portal veins are identified by the high-intensity echoes around them.", "answer": "TRUE", "explanation": "Reference T, p. 81."}, {"letter": "C", "text": "The normal pancreatic duct cannot be seen.", "answer": "FALSE", "explanation": "Segments of it may be seen and normally measure no more than 3 mm in diameter. Reference T, p. 88."}, {"letter": "D", "text": "Free blood can be distinguished from ascites.", "answer": "FALSE", "explanation": "Reference E, p. 1357."}, {"letter": "E", "text": "The AP diameter of the normal pancreas is 1-3 cm.", "answer": "TRUE", "explanation": "The pancreas has a crescenteric shape on transverse section. Reference E, p. 1352."}]}, {"qid": "60", "stem": "In the technique of ultrasound:", "options": [{"letter": "A", "text": "Subcutaneous fat may produce reverberation echoes.", "answer": "TRUE", "explanation": "And this may obscure anterior structures such as the anterior bladder wall. Reference T, p. 52."}, {"letter": "B", "text": "Careful selection of the depth of a water bath is unnecessary.", "answer": "FALSE", "explanation": "The depth must be greater than that of the structure being examined. If it is less than this, any reverberations between the transducer and the bath bottom will be displayed over the area of interest. Reference T, p. 52."}, {"letter": "C", "text": "Areas of low attenuation give rise to an artefactual accentuation of echoes from deeper structures.", "answer": "TRUE", "explanation": "The echoes received from liver beyond a cyst or the gall bladder may be enhanced in this way. The artefact results from time gain compensation. Reference T, p. 52."}, {"letter": "D", "text": "Water baths are not indicated in scanning neonates.", "answer": "FALSE", "explanation": "They may be helpful because their warmth may serve to comfort the child and because they insulate the child from the movements of the transducer. Reference T, p. 50."}, {"letter": "E", "text": "Olive oil cannot be used as the coupling fluid.", "answer": "FALSE", "explanation": "It is perfectly adequate. Paraffin oil, which is also suitable, is advocated by some and has the advantage of low cost. Oils are sticky so that patient preference is for the more easily removed hypoallergenic gels. Reference T, p. 54."}]}, {"qid": "61", "stem": "At ultrasound examination of the abdomen:", "options": [{"letter": "A", "text": "The hepatic artery is seen.", "answer": "TRUE", "explanation": "With the splenic artery, it is seen on a transverse section branching from the coeliac axis in a 'seagull' pattern. Reference F, p. 79."}, {"letter": "B", "text": "The spleen is usually well seen on a scan made through the anterior abdominal wall.", "answer": "FALSE", "explanation": "Visualization of the spleen frequently requires scanning in the lower intercostal spaces (e.g. the tenth). It may help to lie the patient on his right side. By this means, a scan along the length of the spleen is obtained. This is normally not greater than 12 cm. Reference T, p. 130."}, {"letter": "C", "text": "The spiral valve of the gall bladder causes a distal acoustic shadow.", "answer": "TRUE", "explanation": "Which should not be confused with a calculus. Reference T, p. 90."}, {"letter": "D", "text": "The renal pyramids may be seen as separate structures.", "answer": "TRUE", "explanation": "Reference T, p. 101."}, {"letter": "E", "text": "The adrenal glands are more reliably imaged than with CT.", "answer": "FALSE", "explanation": ""}]}, {"qid": "62", "stem": "In the use of ultrasound:", "options": [{"letter": "A", "text": "The hepatic veins have poorly echogenic walls.", "answer": "TRUE", "explanation": "A feature that helps to identify them. Reference T, p. 81."}, {"letter": "B", "text": "The renal parenchyma appears as dense as that of liver.", "answer": "FALSE", "explanation": "It appears less dense than liver. Reference T, p. 98 (Fig. 9.1)."}, {"letter": "C", "text": "The renal hilum is echo free.", "answer": "FALSE", "explanation": "It is echo dense. The echoes probably emanate from renal vessels. Reference T, p. 101."}, {"letter": "D", "text": "The bile duct normally measures 6-9 mm in diameter.", "answer": "FALSE", "explanation": "It should not normally measure more than 5 mm in diameter. Reference T, p. 101."}, {"letter": "E", "text": "The gall bladder is best examined after the patient has had a fatty meal.", "answer": "FALSE", "explanation": "It is essential that the patient is adequately fasted so as to distend the gall bladder as much as possible. The contractility of the organ can be subsequently assessed by giving the patient a fatty meal. Reference T, p. 89."}]}, {"qid": "63", "stem": "In fetal ultrasound:", "options": [{"letter": "A", "text": "Pulsations of the heart are first seen at 7 weeks with a real-time scanner.", "answer": "TRUE", "explanation": "Reference M, p. 410."}, {"letter": "B", "text": "The four-chamber view of the heart is obtained with a scan at 60 degrees to the long axis of the fetus.", "answer": "FALSE", "explanation": "It is achieved with a transverse scan of the thorax. Reference M, p. 508."}, {"letter": "C", "text": "The gestation sac is first detected at about 6 weeks after the last menstrual period (LMP).", "answer": "TRUE", "explanation": "Reference T, p. 58."}, {"letter": "D", "text": "The umbilical vein can be usually demonstrated.", "answer": "TRUE", "explanation": "Measurements of fetal abdominal circumference made at this level can be extrapolated to give an estimate of fetal weight. Reference: Campbell, S. and Wilkin, D. Ultrasonic measurement of fetal abdomen circumference in the estimation of fetal weight. British Journal of Obstetrics and Gynaecology; 82:689-97 (1975)."}, {"letter": "E", "text": "Dense echoes are obtained from the mid-line of the fetal skull when intrauterine death has occurred.", "answer": "FALSE", "explanation": "The mid-line echoes disappear in fetal death. Other signs of intrauterine death include the loss of fetal heart motion, oedema of the skin (giving a double outline to the head and a halo of echoes around the body), and bizarre shape of the head. Reference F, p. 29."}]}, {"qid": "64", "stem": "The biparietal diameter (BPD) of the fetal skull:", "options": [{"letter": "A", "text": "Is measured from the 7th week after the LMP.", "answer": "FALSE", "explanation": "The fetal head is measurable from about the 12th week of pregnancy. Reference T, p. 64."}, {"letter": "B", "text": "Is measured at the level of the cavum of the septum pellucidum.", "answer": "TRUE", "explanation": "Which is also the level of the thalamus and third ventricle. Reference M, p. 427."}, {"letter": "C", "text": "Is normally greater than 70 mm at 20 weeks.", "answer": "FALSE", "explanation": "The mean BPD at this time is 50.2 mm. Mean measurements of 70 mm or more are obtained in normal pregnancies after 26 weeks. Reference: Campbell, S. and Newman, G. B. Growth of the fetal biparietal diameter during normal pregnancy. Journal of Obstetrics and Gynaecology of the British Commonwealth; 78:513-9 (1971)."}, {"letter": "D", "text": "Is normally 90 mm at term.", "answer": "FALSE", "explanation": "The mean BPD at term is 98.1 mm. Reference: Journal of Obstetrics and Gynaecology of the British Commonwealth; 78:513-9 (1971)."}, {"letter": "E", "text": "Gives a less accurate estimate of fetal maturity in the third trimester than earlier in pregnancy.", "answer": "TRUE", "explanation": "Because the rate of growth is slower and because of moulding of the fetal head late in pregnancy. Reference M, p. 427."}]}, {"qid": "65", "stem": "In the obstetric patient:", "options": [{"letter": "A", "text": "The fetus is identified radiographically at about 10 weeks after the LMP.", "answer": "FALSE", "explanation": "It usually becomes visible at 16 weeks. Reference E, p. 919."}, {"letter": "B", "text": "The dilatation of the calices seen at intravenous urography during pregnancy usually resolves at about 4 weeks post partum.", "answer": "FALSE", "explanation": "It resolves at about 10-12 weeks. Reference E, p. 919."}, {"letter": "C", "text": "The crown-rump length is accurate in assessing fetal age up to the 20th week of pregnancy.", "answer": "FALSE", "explanation": "It becomes inaccurate after 12 weeks because of flexion of the fetal spine. Reference M, p. 423."}, {"letter": "D", "text": "The crown-rump length at 10 weeks is 33 mm.", "answer": "TRUE", "explanation": "Reference: Robinson, H. P. and Fleming, J. E. E. A critical evaluation of sonar 'crown-rump length' measurements. British Journal of Obstetrics and Gynaecology; 82:702-10 (1975)."}, {"letter": "E", "text": "A crown-rump length of 27 mm is compatible with a menstrual age of 8 weeks.", "answer": "FALSE", "explanation": "It is consistent with a pregnancy of 9 weeks and 3 days. At 8 weeks, the mean (±SD) crown-rump length is 17 ± 4.9 mm. Reference: British Journal of Obstetrics and Gynaecology; 82:702-10 (1975)."}]}, {"qid": "66", "stem": "In pelvic and fetal ultrasound:", "options": [{"letter": "A", "text": "Correctly sited intra-uterine contraceptive devices are seen.", "answer": "TRUE", "explanation": "The use of ultrasound is a cost-effective and safe way of checking on their correct placement. Reference T, p. 56."}, {"letter": "B", "text": "A 'cavitary echo' is seen in the midline of the non-pregnant uterus.", "answer": "TRUE", "explanation": "It is an echo produced by the contact of the endometrial surfaces. Reference T, p. 56."}, {"letter": "C", "text": "Femur length is not a reliable indicator of fetal age.", "answer": "FALSE", "explanation": "It is at least as reliable as measurement of the BPD. Reference M, p. 428."}, {"letter": "D", "text": "The chorionic plate is not normally visible.", "answer": "FALSE", "explanation": "It may be seen as an echogenic line. Reference T, p. 67."}, {"letter": "E", "text": "The diagnosis of placenta praevia is made in the second trimester.", "answer": "FALSE", "explanation": "It should not be diagnosed until at least 32 weeks because the lower uterine segment is not fully developed before this. Commonly, a placenta that extends to the cervical os is seen to migrate out of the lower uterine segment in the third trimester. Reference T, p. 68."}]}, {"qid": "67", "stem": "In ultrasonic scanning of ovarian follicles:", "options": [{"letter": "A", "text": "The right ovary is more commonly undetectable than the left.", "answer": "FALSE", "explanation": "The left is not seen more often. This is because it is easily covered by the sigmoid colon. Reference M, p. 604."}, {"letter": "B", "text": "Follicle size prior to ovulation is normally 22-28 mm.", "answer": "FALSE", "explanation": "The follicle has a diameter of 18-24 mm at the time of ovulation with a mean of 20.2 mm. Reference M, p. 607."}, {"letter": "C", "text": "The cumulus oophorous is detectable within the developing follicle.", "answer": "TRUE", "explanation": "It is a sign of impending ovulation. Reference M, p. 610."}, {"letter": "D", "text": "Internal echoes within a full-size follicle indicates that ovulation has failed.", "answer": "FALSE", "explanation": "It is one of the signs that ovulation has occurred. Reference M, p. 611."}, {"letter": "E", "text": "The endometrium appears as a ring shadow after ovulation.", "answer": "TRUE", "explanation": "Reference M, p. 614. Radiological Techniques and Radiography"}]}, {"qid": "68", "stem": "In water-soluble contrast myelography via a lumbar puncture:", "options": [{"letter": "A", "text": "The L1/2 interspace is usually used.", "answer": "FALSE", "explanation": "The L3/4 interspace is chosen. Reference S, p. 266."}, {"letter": "B", "text": "An extra-arachnoid injection is more likely to occur if the puncture is performed with the patient erect.", "answer": "FALSE", "explanation": "This is more likely to occur in a decubitus position. This is because the lumbar ar
